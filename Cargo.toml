[workspace]
resolver = "2"
members = [
    "crates/usnm-core",
    "crates/usnm-search",
    "crates/usnm-store",
    "crates/usnm-api",
    "crates/usnm-ingest",
    "crates/usnm-state",
    "crates/usnm-telemetry",
]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
rust-version = "1.85"
repository = "https://github.com/tgoodyear/usnewsmap.com"

[workspace.dependencies]
usnm-core = { path = "crates/usnm-core" }
usnm-search = { path = "crates/usnm-search" }
usnm-store = { path = "crates/usnm-store" }
usnm-state = { path = "crates/usnm-state" }
usnm-telemetry = { path = "crates/usnm-telemetry" }
anyhow = "1"
arc-swap = "1"
arrow-array = "60"
arrow-schema = "60"
async-trait = "0.1"
axum = "0.8"
base64 = "0.22"
bytes = "1"
bzip2 = "0.6"
chrono = { version = "0.4", default-features = false, features = ["std", "serde", "clock"] }
clap = { version = "4", features = ["derive", "env"] }
flate2 = "1"
form_urlencoded = "1"
http-body-util = "0.1"
futures = "0.3"
governor = "0.10"
httpdate = "1"
parquet = { version = "60", default-features = false, features = ["arrow", "zstd"] }
moka = { version = "0.12", features = ["future"] }
# Telemetry to Application Insights (usnm-telemetry). opentelemetry-application-insights
# 0.46 needs Rust 1.95; 0.45 (opentelemetry 0.32) keeps the workspace's rust-version.
opentelemetry = { version = "0.32", default-features = false, features = ["trace", "metrics", "internal-logs"] }
opentelemetry_sdk = { version = "0.32", default-features = false, features = ["trace", "metrics", "internal-logs"] }
opentelemetry-application-insights = { version = "0.45", default-features = false, features = ["trace", "metrics"] }
opentelemetry-http = { version = "0.32", default-features = false }
rustix = { version = "1", default-features = false, features = ["fs", "std"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["compression-gzip", "cors", "fs", "set-header", "timeout", "trace"] }
tracing = "0.1"
tracing-opentelemetry = { version = "0.34", default-features = false }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
unicode-normalization = "0.1"
zstd = "0.13"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
