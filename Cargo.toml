[workspace]
resolver = "2"
members = [
    "crates/usnm-alto",
    "crates/usnm-boinc",
    "crates/usnm-core",
    "crates/usnm-search",
    "crates/usnm-store",
    "crates/usnm-api",
    "crates/usnm-ingest",
    "crates/usnm-ocr-contract",
    "crates/usnm-ocr-dash",
    "crates/usnm-ocr-survey",
    "crates/usnm-ocr-worker",
    "crates/usnm-overlay",
    "crates/usnm-state",
    "crates/usnm-telemetry",
]

[workspace.package]
edition = "2021"
license = "MIT"
rust-version = "1.95"
repository = "https://github.com/tgoodyear/usnewsmap.com"

[workspace.dependencies]
usnm-alto = { path = "crates/usnm-alto" }
usnm-core = { path = "crates/usnm-core" }
usnm-ocr-contract = { path = "crates/usnm-ocr-contract" }
usnm-ocr-survey = { path = "crates/usnm-ocr-survey" }
usnm-overlay = { path = "crates/usnm-overlay" }
usnm-search = { path = "crates/usnm-search" }
usnm-store = { path = "crates/usnm-store" }
usnm-state = { path = "crates/usnm-state" }
usnm-telemetry = { path = "crates/usnm-telemetry" }
anyhow = "1"
arc-swap = "1"
arrow-array = "60"
arrow-schema = "60"
async-trait = "0.1"
axum = "0.8"
# HTTPS for the OCR dashboard (usnm-ocrdash): rustls with ring, the provider reqwest already uses.
axum-server = { version = "0.8", default-features = false, features = ["tls-rustls-no-provider"] }
base64 = "0.23"
blake2 = "0.11"
bytes = "1"
bzip2 = "0.6"
caseless = "0.2"
chrono = { version = "0.4", default-features = false, features = ["std", "serde", "clock"] }
clap = { version = "4", features = ["derive", "env"] }
flate2 = "1"
form_urlencoded = "1"
http-body-util = "0.1"
futures = "0.3"
governor = "0.10"
httpdate = "1"
# The md5s in LoC's BagIt batch manifests, checked against each fetched JP2 (#368).
md-5 = "0.11"
# The bounded ALTO reader (usnm-alto): streaming, no DTD processing.
quick-xml = "0.42"
parquet = { version = "60", default-features = false, features = ["arrow", "zstd"] }
moka = { version = "0.12", features = ["future"] }
# Telemetry to Application Insights (usnm-telemetry). The opentelemetry crates move together;
# opentelemetry-application-insights 0.46 (opentelemetry 0.33) needs Rust 1.95.
opentelemetry = { version = "0.33", default-features = false, features = ["trace", "metrics", "internal-logs"] }
opentelemetry_sdk = { version = "0.33", default-features = false, features = ["trace", "metrics", "internal-logs"] }
opentelemetry-application-insights = { version = "0.46", default-features = false, features = ["trace", "metrics"] }
opentelemetry-http = { version = "0.33", default-features = false }
rustix = { version = "1", default-features = false, features = ["fs", "std"] }
# JSON Schemas of the OCR engine contract (usnm-ocr-contract, 13 §13.4.8).
schemars = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tar = "0.4"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["compression-gzip", "cors", "fs", "set-header", "timeout", "trace"] }
tracing = "0.1"
tracing-opentelemetry = { version = "0.34", default-features = false }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
unicode-general-category = "1"
unicode-normalization = "0.1"
zstd = "0.14"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
