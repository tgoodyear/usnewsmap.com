  /api/v1/hits:
    get:
      operationId: hitsAlias1
      summary: Matching pages from one place or newspaper
      parameters:
      - name: q
        in: query
        required: false
        description: The search, up to 256 characters and 12 terms. Words are all required unless `mode`
          says otherwise; a phrase goes in double quotes, `OR` joins alternatives (up to 4), a leading
          `-` excludes a word, `word*` matches words starting with `word` (at least 5 letters), `?` and
          `*` inside a word match one character or any run, `word~ocr` also matches OCR's common misspellings,
          and `2 OF (a b c)` matches pages with at least 2 of up to 6 words or phrases. Without `q`, a
          single `lccn` lists that newspaper's pages by date; `mode`, `near`, `fuzzy`, `bucket` and `sort=relevant`
          then need `q`.
        allowEmptyValue: true
        schema:
          type: string
      - name: mode
        in: query
        required: false
        description: How the words of `q` combine. Without it, a quoted `q` is a phrase and any other
          needs all its words.
        allowEmptyValue: true
