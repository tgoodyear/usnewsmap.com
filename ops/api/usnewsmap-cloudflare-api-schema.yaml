      - name: to
        in: query
        required: false
        description: The last date. Dates outside `bounds` in `/v1/meta` move to the nearest bound; `from`
          after `to` is a 400.
        allowEmptyValue: true
        schema:
          type: string
          pattern: ^(?:(?:\s|\+|%20|%09)*(?:[+-]|%2[Bb])?[0-9]{1,10}-[0-9]{1,2}-[0-9]{1,2}(?:\s|\+|%20|%09)*)?$
      - name: state
        in: query
        required: false
        description: 'USPS state codes, any case: only places in these states.'
        allowEmptyValue: true
        schema:
          type: string
          pattern: ^(?:\s|\+|%20|%09)*(?:(?:[A-Za-z]{2})(?:\s|\+|%20|%09)*)?(?:(?:,|%2[Cc])(?:\s|\+|%20|%09)*(?:(?:[A-Za-z]{2})(?:\s|\+|%20|%09)*)?)*$
      - name: lccn
        in: query
        required: false
        description: Newspapers by LCCN. Without `place`, a single LCCN selects that newspaper's pages;
          with `place`, a filter.
        allowEmptyValue: true
        schema:
          type: string
          pattern: ^(?:\s|\+|%20|%09)*(?:(?:[a-z0-9]{1,16})(?:\s|\+|%20|%09)*)?(?:(?:,|%2[Cc])(?:\s|\+|%20|%09)*(?:(?:[a-z0-9]{1,16})(?:\s|\+|%20|%09)*)?)*$
      - name: lang
        in: query
        required: false
        description: 'Three-letter language codes from `languages` in `/v1/meta`: pages in any of them
          (by `language_filter`: each page''s languages, or its newspaper''s).'
        allowEmptyValue: true
        schema:
          type: string
          pattern: ^(?:\s|\+|%20|%09)*(?:(?:[A-Za-z]{3})(?:\s|\+|%20|%09)*)?(?:(?:,|%2[Cc])(?:\s|\+|%20|%09)*(?:(?:[A-Za-z]{3})(?:\s|\+|%20|%09)*)?)*$
