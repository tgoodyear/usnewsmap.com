        in: query
        required: false
        description: The time bucket. `auto` picks `year` for more than 30 years, `month` for more than
          3, `week` for more than 4 months and `day` otherwise.
        allowEmptyValue: true
        schema:
          type: string
          pattern: ^(?:auto|year|month|week|day)?$
      - name: v
        in: query
        required: false
        description: The `index_version` the client expects. Another version than the one served is a
          307 to the same request at the served one; without `v`, the response is cacheable for 5 minutes
          only and `Content-Location` names the URL with it.
        allowEmptyValue: true
        schema:
          type: string
      - name: source
        in: query
        required: false
        description: 'The corpus searched: the newspapers, the debates and documents of Congress (`congress`
          in `/v1/meta`), or both.'
        allowEmptyValue: true
