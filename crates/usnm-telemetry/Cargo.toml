[package]
name = "usnm-telemetry"
version = "0.1.0"
description = "Logs, traces and metrics for the US News Map services: JSON logs on stdout, OpenTelemetry to Application Insights with an Entra token"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
# A fake Application Insights ingestion endpoint for tests.
testing = ["dep:axum", "tokio/net"]

[dependencies]
usnm-store.workspace = true
anyhow.workspace = true
async-trait.workspace = true
axum = { workspace = true, optional = true }
chrono.workspace = true
flate2.workspace = true
opentelemetry.workspace = true
opentelemetry_sdk.workspace = true
opentelemetry-application-insights.workspace = true
opentelemetry-http.workspace = true
reqwest.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time"] }
tracing.workspace = true
tracing-opentelemetry.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
axum.workspace = true
tokio = { workspace = true, features = ["rt", "time", "net"] }

[lints]
workspace = true
