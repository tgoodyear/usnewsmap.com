[package]
name = "usnm-ingest"
version = "0.1.0"
description = "US News Map ingest pipeline: curate LoC batches, build indexes and reference snapshots, publish"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
# The damage metric (12 §12.5 Step 6): only this binary embeds its word lists.
usnm-core = { workspace = true, features = ["damage"] }
usnm-corpus-signals.workspace = true
# The Congress fetches (`usnm-ingest congress-globe`, `congress-serialset`) and the
# release's Congress index set.
usnm-congress.workspace = true
# The local OCR pipeline (`ocr-sync`, `ocr-seed`, `ocr-enqueue`, `ocr-damage`, ...)
# and the release's replacement rule.
usnm-ocr-local.workspace = true
usnm-ocr-route.workspace = true
# Text agreement between LoC and American Stories (`ocr-agreement`, #962).
usnm-ocr-quality.workspace = true
usnm-ocr-contract = { workspace = true, default-features = true }
usnm-overlay.workspace = true
usnm-store.workspace = true
usnm-state.workspace = true
usnm-telemetry.workspace = true
# The search cluster's bench runs searches as the API does (src/cluster/bench.rs).
usnm-search.workspace = true
anyhow.workspace = true
arrow-array.workspace = true
arrow-schema.workspace = true
async-trait.workspace = true
bytes.workspace = true
bzip2.workspace = true
chrono.workspace = true
clap.workspace = true
flate2.workspace = true
futures.workspace = true
opentelemetry.workspace = true
parquet.workspace = true
reqwest = { workspace = true, features = ["stream", "http2"] }
rskafka.workspace = true
rustix.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tar.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "process", "sync", "time"] }
tracing.workspace = true
unicode-normalization.workspace = true
zstd.workspace = true

[dev-dependencies]
usnm-api = { path = "../usnm-api" }
usnm-telemetry = { workspace = true, features = ["testing"] }
axum.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "process", "sync", "time", "net", "test-util"] }
# The JSON log a finish reads (`finish::RunLog`), captured in the tests.
tracing-subscriber.workspace = true

[lints]
workspace = true
