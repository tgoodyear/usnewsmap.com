[package]
name = "usnm-ocr-quality"
version = "0.1.0"
description = "Per-page OCR quality without transcription (#522): alignment with backtrace, the three-cornered-hat error model, consensus, findability, confusion pairs, scan features and crop selection"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
usnm-alto.workspace = true
usnm-ocr-contract = { workspace = true, default-features = false }
anyhow.workspace = true
chrono.workspace = true
image.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
unicode-normalization.workspace = true

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["process"] }

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
