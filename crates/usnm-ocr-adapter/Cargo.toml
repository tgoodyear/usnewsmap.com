[package]
name = "usnm-ocr-adapter"
version = "0.1.0"
description = "US News Map OCR engine adapters: the adapter side of the engine contract, and a text-only Tesseract adapter (#307; 13 §13.4)"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "usnm-ocr-adapter-tesseract-text"
path = "src/bin/usnm-ocr-adapter-tesseract-text.rs"

[dependencies]
chrono.workspace = true
quick-xml.workspace = true
tempfile.workspace = true
unicode-normalization.workspace = true
unicode-general-category.workspace = true
usnm-alto.workspace = true
usnm-ocr-route.workspace = true
usnm-ocr-contract = { workspace = true, default-features = true }
anyhow.workspace = true
clap.workspace = true
rustix = { workspace = true, features = ["process"] }
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true

[dev-dependencies]
usnm-ocr-worker = { path = "../usnm-ocr-worker" }
tokio.workspace = true

[lints]
workspace = true
