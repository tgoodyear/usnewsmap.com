[package]
name = "usnm-ocr-worker"
version = "0.1.0"
description = "US News Map on-prem OCR worker: re-OCR damaged pages from a queue (#296)"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
usnm-alto.workspace = true
usnm-ocr-route.workspace = true
usnm-core = { workspace = true, features = ["damage"] }
usnm-corpus-signals.workspace = true
usnm-ocr-contract = { workspace = true, default-features = true }
usnm-overlay.workspace = true
usnm-store.workspace = true
usnm-telemetry.workspace = true
anyhow.workspace = true
arrow-array.workspace = true
arrow-schema.workspace = true
bzip2.workspace = true
parquet.workspace = true
tar.workspace = true
async-trait.workspace = true
axum.workspace = true
base64.workspace = true
bytes.workspace = true
chrono.workspace = true
md-5.workspace = true
httpdate.workspace = true
image.workspace = true
clap.workspace = true
moka.workspace = true
opentelemetry.workspace = true
quick-xml.workspace = true
reqwest.workspace = true
rustix.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "net", "process", "sync", "time"] }
tracing.workspace = true

[features]
# The stand-in LoC (src/standin.rs) for other crates' tests.
standin = []

[dev-dependencies]
opentelemetry_sdk = { workspace = true, features = ["testing"] }
tower.workspace = true
tracing-subscriber.workspace = true
usnm-ocr-local.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "process", "sync", "time", "net", "test-util"] }

[lints]
workspace = true
