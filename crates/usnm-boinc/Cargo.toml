[package]
name = "usnm-boinc"
version = "0.1.0"
description = "Opt-in stock BOINC batch transport for the newspaper OCR pipeline"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# `cloud validatord` (the cloud server's validation webhook) is not in any default build.
# Build it with `cargo build --release -p usnm-boinc --features cloud-validatord`.
[features]
cloud-validatord = ["dep:axum"]

[dependencies]
async-trait.workspace = true
usnm-core = { workspace = true, features = ["damage"] }
usnm-ocr-adapter = { path = "../usnm-ocr-adapter" }
usnm-ocr-contract = { workspace = true, default-features = true }
usnm-ocr-quality.workspace = true
usnm-ocr-survey.workspace = true
usnm-overlay.workspace = true
usnm-store.workspace = true
usnm-state.workspace = true
usnm-alto.workspace = true
usnm-ocr-worker = { path = "../usnm-ocr-worker" }
usnm-ocr-local.workspace = true
anyhow.workspace = true
# The dev-only validator webhook service (cloud validatord), built only with that feature.
axum = { workspace = true, optional = true }
arrow-array.workspace = true
arrow-schema.workspace = true
parquet.workspace = true
quick-xml.workspace = true
base64.workspace = true
bytes.workspace = true
chrono.workspace = true
clap.workspace = true
# PNM too: the line re-read decodes the test image crate's scans (#1621).
image = { workspace = true, features = ["pnm"] }
hayro-jpeg2000.workspace = true
rustix = { workspace = true, features = ["process", "thread"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
md-5.workspace = true
reqwest.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["process"] }
tracing-subscriber.workspace = true

[dev-dependencies]
axum.workspace = true
usnm-test-support.workspace = true
rustix = { workspace = true, features = ["event"] }
tokio = { workspace = true, features = ["test-util"] }
usnm-ocr-worker = { path = "../usnm-ocr-worker", features = ["standin"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

# Not `workspace = true`: native/win.rs calls the Win32 job object API, which is unsafe. It is
# the only module that allows it (as usnm-ocr-quality's slot control does).
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
