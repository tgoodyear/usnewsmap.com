[package]
name = "usnm-ocr-dash"
version = "0.1.0"
description = "US News Map on-prem OCR: a read-only LAN dashboard of the scan fetch, the nodes and the hosts (#296, #368)"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "usnm-ocrdash"
path = "src/main.rs"

[dependencies]
usnm-core.workspace = true
usnm-ocr-contract = { workspace = true, default-features = true }
usnm-ocr-worker = { path = "../usnm-ocr-worker" }
anyhow.workspace = true
axum.workspace = true
axum-server.workspace = true
bytes.workspace = true
chrono.workspace = true
clap.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "net", "signal", "sync", "time"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
quick-xml.workspace = true
tempfile.workspace = true
tower.workspace = true

[lints]
workspace = true
