<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 1100 520" width="1100" height="520" role="img" aria-labelledby="quality-bulk-t quality-bulk-d">
<title id="quality-bulk-t">Quality pass and LoC bulk OCR archives</title>
<desc id="quality-bulk-d">Two on-prem lanes beside OCR. The quality pass: queue-quality fetch lists, scans fetched into buffer/, usnm-quality-follow building usnm_quality units for BOINC, and quality-collect loading the results into the quality database. The bulk lane: usnm-loc-bulk downloads LoC's bulk OCR archives one at a time, usnm-loc-alto-stats parses them into Parquet, and the word-confidence tables are loaded hourly into the quality database.</desc>
<style>
.dg { --k:#0b0b0b; --k2:#52514e; --bg:#fcfcfb; --lx:#f4f1e6; --lh:#f1f1ee; --la:#e8f0fb; --bx:#ffffff;
  --good:#0ca30c; --run:#2a78d6; --wait:#fab219; --none:#898781; width:100%; height:auto; max-width:1500px; display:block;
  font: 12px/1.2 system-ui, -apple-system, "Segoe UI", sans-serif; color:var(--k); }
@media (prefers-color-scheme: dark) { .dg { --k:#ffffff; --k2:#c3c2b7; --bg:#1a1a19; --lx:#2a2820; --lh:#262625;
  --la:#17233a; --bx:#0d0d0d; --run:#3987e5; } }
.dg text { fill:var(--k); } .dg .sub, .dg .lane { fill:var(--k2); }
.dg .lane.x { stroke:var(--lx); } .dg .lane.h { stroke:var(--lh); } .dg .lane.a { stroke:var(--la); }
.dg .lane { paint-order:stroke; stroke-width:5; stroke-linejoin:round; font-size:11px; font-weight:600; letter-spacing:0.04em; text-transform:uppercase; }
.dg .band { stroke:var(--none); stroke-width:1; stroke-opacity:0.35; }
.dg .band.x { fill:var(--lx); } .dg .band.h { fill:var(--lh); } .dg .band.a { fill:var(--la); }
.dg .card { fill:var(--bx); stroke:var(--k2); stroke-width:1.5; }
.dg .azure .card { stroke-dasharray:none; }
.dg .ttl { font-weight:700; font-size:13px; }
.dg .st { font-style:italic; fill:var(--k2); }
.dg .bar { fill:var(--none); }
.dg [data-state="done"] .bar { fill:var(--good); } .dg [data-state="running"] .bar { fill:var(--run); }
.dg [data-state="waiting"] .bar { fill:var(--wait); } .dg [data-state="failed"] .bar { fill:#d03b3b; }
.dg [data-state="not-built"] .card { stroke-dasharray:6 4; }
.dg .arrow { fill:none; stroke:var(--k2); stroke-width:1.5; }
.dg .tip { fill:var(--k2); }
.dg .al { font-size:11px; fill:var(--k2); }
</style>
<defs><marker id="ah-quality-bulk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="tip" d="M0 0 L10 5 L0 10 z"/></marker></defs>
<rect x="0" y="0" width="1100" height="520" fill="none"/>
<rect class="band x" x="4" y="6" width="1092" height="112" rx="6"/>
<rect class="band h" x="4" y="126" width="1092" height="388" rx="6"/>
<g id="quality-bulk-src" class="box x" data-state="none">
<rect class="card" x="10" y="28" width="420" height="64" rx="4"/>
<rect class="bar" x="10" y="29" width="6" height="62" rx="2"/>
<text class="ttl" x="24" y="47">LoC and mirrors</text>
<text x="24" y="62">scans: the same sources and order as the OCR fetch</text>
<text x="24" y="77">bulk: LoC's OCR archives, ALTO with word confidence</text>
</g>
<g id="quality-bulk-qm" class="box local" data-state="none">
<rect class="card" x="10" y="150" width="200" height="79" rx="4"/>
<rect class="bar" x="10" y="151" width="6" height="77" rx="2"/>
<text class="ttl" x="24" y="169">1  Quality fetch lists</text>
<text x="24" y="184">build-quality in the build</text>
<text x="24" y="199">container makes queue-</text>
<text x="24" y="214">quality-* manifests every 2 h</text>
</g>
<g id="quality-bulk-qf" class="box local" data-state="none">
<rect class="card" x="230" y="150" width="200" height="94" rx="4"/>
<rect class="bar" x="230" y="151" width="6" height="92" rx="2"/>
<text class="ttl" x="244" y="169">2  Scan fetcher</text>
<text x="244" y="184">bucket, then mirrors, then</text>
<text x="244" y="199">LoC, under the pacer; scans</text>
<text x="244" y="214">go to buffer/ and are</text>
<text x="244" y="229">deleted after their chunk ships</text>
</g>
<g id="quality-bulk-qu" class="box local" data-state="none">
<rect class="card" x="450" y="150" width="200" height="79" rx="4"/>
<rect class="bar" x="450" y="151" width="6" height="77" rx="2"/>
<text class="ttl" x="464" y="169">3  usnm-quality-follow</text>
<text x="464" y="184">in the build container:</text>
<text x="464" y="199">builds usnm_quality units</text>
<text x="464" y="214">from the fetched scans</text>
</g>
<g id="quality-bulk-qb" class="box local" data-state="none">
<rect class="card" x="670" y="150" width="200" height="64" rx="4"/>
<rect class="bar" x="670" y="151" width="6" height="62" rx="2"/>
<text class="ttl" x="684" y="169">4  BOINC usnm_quality</text>
<text x="684" y="184">volunteers run the quality</text>
<text x="684" y="199">comparisons</text>
</g>
<g id="quality-bulk-qc" class="box local" data-state="none">
<rect class="card" x="890" y="150" width="200" height="64" rx="4"/>
<rect class="bar" x="890" y="151" width="6" height="62" rx="2"/>
<text class="ttl" x="904" y="169">5  quality-collect</text>
<text x="904" y="184">loads the results into the</text>
<text x="904" y="199">usnm_quality database</text>
</g>
<g id="quality-bulk-bd" class="box local" data-state="@@cls:bulk@@">
<rect class="card" x="10" y="340" width="200" height="124" rx="4"/>
<rect class="bar" x="10" y="341" width="6" height="122" rx="2"/>
<text class="ttl" x="24" y="359">6  usnm-loc-bulk</text>
<text x="24" y="374">downloads the archives one</text>
<text x="24" y="389">at a time through the LoC</text>
<text x="24" y="404">pacer, into the scan store's</text>
<text x="24" y="419">bulk dataset (#1075)</text>
<text x="24" y="434">@@txt:bulk@@</text>
<text class="st" x="24" y="449">@@lbl:bulk@@</text>
</g>
<g id="quality-bulk-bs" class="box local" data-state="none">
<rect class="card" x="230" y="340" width="200" height="79" rx="4"/>
<rect class="bar" x="230" y="341" width="6" height="77" rx="2"/>
<text class="ttl" x="244" y="359">7  usnm-loc-alto-stats</text>
<text x="244" y="374">parses each archive's ALTO</text>
<text x="244" y="389">into Parquet tables of</text>
<text x="244" y="404">word confidence</text>
</g>
<g id="quality-bulk-bl" class="box local" data-state="none">
<rect class="card" x="450" y="340" width="200" height="64" rx="4"/>
<rect class="bar" x="450" y="341" width="6" height="62" rx="2"/>
<text class="ttl" x="464" y="359">8  quality.loc_alto</text>
<text x="464" y="374">loaded hourly into the</text>
<text x="464" y="389">quality database</text>
</g>
<g id="quality-bulk-br" class="box local" data-state="none">
<rect class="card" x="670" y="340" width="240" height="94" rx="4"/>
<rect class="bar" x="670" y="341" width="6" height="92" rx="2"/>
<text class="ttl" x="684" y="359">9  Used for ordering</text>
<text x="684" y="374">loc_wc_mean feeds the OCR</text>
<text x="684" y="389">ranking and the image pass's</text>
<text x="684" y="404">order; no text reaches</text>
<text x="684" y="419">the search index from here</text>
</g>
<path class="arrow" d="M330 106 L330 150" marker-end="url(#ah-quality-bulk)"/>
<text class="al" x="338" y="138">scans</text>
<path class="arrow" d="M210 197 L230 197" marker-end="url(#ah-quality-bulk)"/>
<path class="arrow" d="M430 197 L450 197" marker-end="url(#ah-quality-bulk)"/>
<path class="arrow" d="M650 197 L670 197" marker-end="url(#ah-quality-bulk)"/>
<path class="arrow" d="M870 197 L890 197" marker-end="url(#ah-quality-bulk)"/>
<path class="arrow" d="M220 106 L220 320 L110 320 L110 340" marker-end="url(#ah-quality-bulk)"/>
<text class="al" x="228" y="316">archives</text>
<path class="arrow" d="M210 390 L230 390" marker-end="url(#ah-quality-bulk)"/>
<path class="arrow" d="M430 390 L450 390" marker-end="url(#ah-quality-bulk)"/>
<path class="arrow" d="M650 390 L670 390" marker-end="url(#ah-quality-bulk)"/>
<text class="lane x" x="14" y="22">Library of Congress and mirrors</text>
<text class="lane h" x="14" y="142">Home network (on-premises)</text>
</svg>
