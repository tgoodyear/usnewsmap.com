<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 1100 470" width="1100" height="470" role="img" aria-labelledby="serial-set-t serial-set-d">
<title id="serial-set-t">Serial Set from GovInfo</title>
<desc id="serial-set-d">GovInfo's Serial Set sitemaps, metadata and PDFs are read by usnm-sset on an OCR node, which takes each PDF's text layer with pdftotext, keeps the metadata and page text in a local raw store, writes curated/congress/serialset in Azure, and the release with the Congress option builds the Congress index.</desc>
<style>
.dg { --k:#0b0b0b; --k2:#52514e; --bg:#fcfcfb; --lx:#f4f1e6; --lh:#f1f1ee; --la:#e8f0fb; --bx:#ffffff;
  --good:#0ca30c; --run:#2a78d6; --wait:#fab219; --none:#898781; width:100%; height:auto; max-width:1500px; display:block;
  font: 12px/1.2 system-ui, -apple-system, "Segoe UI", sans-serif; color:var(--k); }
@media (prefers-color-scheme: dark) { .dg { --k:#ffffff; --k2:#c3c2b7; --bg:#1a1a19; --lx:#2a2820; --lh:#262625;
  --la:#17233a; --bx:#0d0d0d; --run:#3987e5; } }
.dg text { fill:var(--k); } .dg .sub, .dg .lane { fill:var(--k2); }
.dg .lane.x { stroke:var(--lx); } .dg .lane.h { stroke:var(--lh); } .dg .lane.a { stroke:var(--la); }
.dg .lane { paint-order:stroke; stroke-width:5; stroke-linejoin:round; font-size:11px; font-weight:600; letter-spacing:0.04em; text-transform:uppercase; }
.dg .band { stroke:var(--none); stroke-width:1; stroke-opacity:0.35; }
.dg .band.x { fill:var(--lx); } .dg .band.h { fill:var(--lh); } .dg .band.a { fill:var(--la); }
.dg .card { fill:var(--bx); stroke:var(--k2); stroke-width:1.5; }
.dg .azure .card { stroke-dasharray:none; }
.dg .ttl { font-weight:700; font-size:13px; }
.dg .st { font-style:italic; fill:var(--k2); }
.dg .bar { fill:var(--none); }
.dg [data-state="done"] .bar { fill:var(--good); } .dg [data-state="running"] .bar { fill:var(--run); }
.dg [data-state="waiting"] .bar { fill:var(--wait); } .dg [data-state="failed"] .bar { fill:#d03b3b; }
.dg [data-state="not-built"] .card { stroke-dasharray:6 4; }
.dg .arrow { fill:none; stroke:var(--k2); stroke-width:1.5; }
.dg .tip { fill:var(--k2); }
.dg .al { font-size:11px; fill:var(--k2); }
</style>
<defs><marker id="ah-serial-set" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="tip" d="M0 0 L10 5 L0 10 z"/></marker></defs>
<rect x="0" y="0" width="1100" height="470" fill="none"/>
<rect class="band x" x="4" y="6" width="1092" height="112" rx="6"/>
<rect class="band h" x="4" y="126" width="1092" height="178" rx="6"/>
<rect class="band a" x="4" y="312" width="1092" height="150" rx="6"/>
<g id="serial-set-g" class="box x" data-state="none">
<rect class="card" x="10" y="28" width="200" height="79" rx="4"/>
<rect class="bar" x="10" y="29" width="6" height="77" rx="2"/>
<text class="ttl" x="24" y="47">Serial Set packages</text>
<text x="24" y="62">sitemaps (one per year),</text>
<text x="24" y="77">MODS metadata, PDFs;</text>
<text x="24" y="92">public, no API key</text>
</g>
<g id="serial-set-run" class="box local" data-state="@@cls:sset-fetch@@">
<rect class="card" x="10" y="150" width="200" height="139" rx="4"/>
<rect class="bar" x="10" y="151" width="6" height="137" rx="2"/>
<text class="ttl" x="24" y="169">1  usnm-sset</text>
<text x="24" y="184">congress-serialset command</text>
<text x="24" y="199">one request at a time, paced;</text>
<text x="24" y="214">pdftotext reads the PDF's own</text>
<text x="24" y="229">text layer: no OCR. The PDF</text>
<text x="24" y="244">is deleted after reading</text>
<text x="24" y="259">@@txt:sset-fetch@@</text>
<text class="st" x="24" y="274">@@lbl:sset-fetch@@</text>
</g>
<g id="serial-set-raw" class="box local" data-state="none">
<rect class="card" x="230" y="150" width="200" height="94" rx="4"/>
<rect class="bar" x="230" y="151" width="6" height="92" rx="2"/>
<text class="ttl" x="244" y="169">2  Raw store on the node</text>
<text x="244" y="184">MODS and page texts,</text>
<text x="244" y="199">zstd, so a stopped volume</text>
<text x="244" y="214">resumes without its PDFs;</text>
<text x="244" y="229">state file for the lock</text>
</g>
<g id="serial-set-cur" class="box azure" data-state="@@cls:sset-curated@@">
<rect class="card" x="10" y="336" width="240" height="124" rx="4"/>
<rect class="bar" x="10" y="337" width="6" height="122" rx="2"/>
<text class="ttl" x="24" y="355">4  curated/congress/serialset/</text>
<text x="24" y="370">{volume}/{attempt}/ Parquet</text>
<text x="24" y="385">and counts.json; one attempt</text>
<text x="24" y="400">per finished volume, written</text>
<text x="24" y="415">over the node's Arc identity</text>
<text x="24" y="430">@@txt:sset-curated@@</text>
<text class="st" x="24" y="445">@@lbl:sset-curated@@</text>
</g>
<g id="serial-set-rel" class="box azure" data-state="@@cls:sset-release@@">
<rect class="card" x="450" y="336" width="200" height="109" rx="4"/>
<rect class="bar" x="450" y="337" width="6" height="107" rx="2"/>
<text class="ttl" x="464" y="355">5  Release with --congress</text>
<text x="464" y="370">USNM_CONGRESS, off by</text>
<text x="464" y="385">default; rebuilds the</text>
<text x="464" y="400">Congress set when units</text>
<text x="464" y="415">change</text>
<text class="st" x="464" y="430">@@lbl:sset-release@@</text>
</g>
<g id="serial-set-idx" class="box azure" data-state="@@cls:sset-index@@">
<rect class="card" x="670" y="336" width="200" height="109" rx="4"/>
<rect class="bar" x="670" y="337" width="6" height="107" rx="2"/>
<text class="ttl" x="684" y="355">6  Congress index</text>
<text x="684" y="370">congress-index.yaml, named</text>
<text x="684" y="385">in current.json under</text>
<text x="684" y="400">congress; searched with</text>
<text x="684" y="415">source=congress</text>
<text class="st" x="684" y="430">@@lbl:sset-index@@</text>
</g>
<path class="arrow" d="M110 107 L110 150" marker-end="url(#ah-serial-set)"/>
<path class="arrow" d="M210 219.5 L230 197" marker-end="url(#ah-serial-set)"/>
<path class="arrow" d="M110 289 L130 336" marker-end="url(#ah-serial-set)"/>
<path class="arrow" d="M250 398 L450 390.5" marker-end="url(#ah-serial-set)"/>
<path class="arrow" d="M650 390.5 L670 390.5" marker-end="url(#ah-serial-set)"/>
<text class="lane x" x="14" y="22">GovInfo (U.S. Government Publishing Office)</text>
<text class="lane h" x="14" y="142">Home network (OCR node 3)</text>
<text class="lane a" x="14" y="328">Azure (data lake, private)</text>
</svg>
