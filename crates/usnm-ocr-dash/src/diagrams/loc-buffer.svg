<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 1100 820" width="1100" height="820" role="img" aria-labelledby="loc-buffer-t loc-buffer-d">
<title id="loc-buffer-t">LoC buffer set: English pages read again, scans held briefly</title>
<desc id="loc-buffer-d">The same path as the keep set, but the scans of the other badly damaged English pages sit in a rolling buffer on the scan store and are deleted after each page's output is uploaded.</desc>
<style>
.dg { --k:#0b0b0b; --k2:#52514e; --bg:#fcfcfb; --lx:#f4f1e6; --lh:#f1f1ee; --la:#e8f0fb; --bx:#ffffff;
  --good:#0ca30c; --run:#2a78d6; --wait:#fab219; --none:#898781; width:100%; height:auto; max-width:1100px; display:block;
  font: 12px/1.2 system-ui, -apple-system, "Segoe UI", sans-serif; color:var(--k); }
@media (prefers-color-scheme: dark) { .dg { --k:#ffffff; --k2:#c3c2b7; --bg:#1a1a19; --lx:#2a2820; --lh:#262625;
  --la:#17233a; --bx:#0d0d0d; --run:#3987e5; } }
.dg text { fill:var(--k); } .dg .sub, .dg .lane { fill:var(--k2); }
.dg .lane { font-size:11px; font-weight:600; letter-spacing:0.04em; text-transform:uppercase; }
.dg .band { stroke:var(--none); stroke-width:1; stroke-opacity:0.35; }
.dg .band.x { fill:var(--lx); } .dg .band.h { fill:var(--lh); } .dg .band.a { fill:var(--la); }
.dg .card { fill:var(--bx); stroke:var(--k2); stroke-width:1.5; }
.dg .azure .card { stroke-dasharray:none; }
.dg .ttl { font-weight:700; font-size:13px; }
.dg .st { font-style:italic; fill:var(--k2); }
.dg .bar { fill:var(--none); }
.dg [data-state="done"] .bar { fill:var(--good); } .dg [data-state="running"] .bar { fill:var(--run); }
.dg [data-state="waiting"] .bar { fill:var(--wait); }
.dg [data-state="not-built"] .card { stroke-dasharray:6 4; }
.dg .arrow { fill:none; stroke:var(--k2); stroke-width:1.5; }
.dg .tip { fill:var(--k2); }
.dg .al { font-size:11px; fill:var(--k2); }
</style>
<defs><marker id="ah-loc-buffer" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="tip" d="M0 0 L10 5 L0 10 z"/></marker></defs>
<rect x="0" y="0" width="1100" height="820" fill="none"/>
<rect class="band x" x="4" y="6" width="1092" height="112" rx="6"/>
<text class="lane" x="14" y="22">Library of Congress</text>
<rect class="band h" x="4" y="126" width="1092" height="352" rx="6"/>
<text class="lane" x="14" y="142">Home network (on-premises)</text>
<rect class="band a" x="4" y="486" width="1092" height="328" rx="6"/>
<text class="lane" x="14" y="502">Azure (exchange account and data lake)</text>
<g id="loc-buffer-l" class="box x" data-state="none">
<rect class="card" x="230" y="28" width="200" height="79" rx="4"/>
<rect class="bar" x="230" y="29" width="6" height="77" rx="2"/>
<text class="ttl" x="244" y="47">tile.loc.gov storage</text>
<text x="244" y="62">batch JP2 for each page;</text>
<text x="244" y="77">if it cannot place a page:</text>
<text x="244" y="92">loc.gov item API + IIIF JPEG</text>
</g>
<g id="loc-buffer-pull" class="box local" data-state="@@cls:pull@@">
<rect class="card" x="10" y="150" width="200" height="109" rx="4"/>
<rect class="bar" x="10" y="151" width="6" height="107" rx="2"/>
<text class="ttl" x="24" y="169">2  Manifest copy</text>
<text x="24" y="184">pull-manifest.sh, run on an</text>
<text x="24" y="199">OCR node, copies it from</text>
<text x="24" y="214">ocr-out/manifests to the</text>
<text x="24" y="229">scan store: manifests/</text>
<text class="st" x="24" y="244">@@lbl:pull@@</text>
</g>
<g id="loc-buffer-fet" class="box local" data-state="@@cls:fetch-buffer@@">
<rect class="card" x="230" y="150" width="200" height="139" rx="4"/>
<rect class="bar" x="230" y="151" width="6" height="137" rx="2"/>
<text class="ttl" x="244" y="169">3  Scan fetcher</text>
<text x="244" y="184">container, no Azure access;</text>
<text x="244" y="199">buffer set: English pages not</text>
<text x="244" y="214">in the keep set, after it.</text>
<text x="244" y="229">Waits while buffer/ is at</text>
<text x="244" y="244">its size cap</text>
<text x="244" y="259">@@txt:fetch-buffer@@</text>
<text class="st" x="244" y="274">@@lbl:fetch-buffer@@</text>
</g>
<g id="loc-buffer-store" class="box local" data-state="@@cls:store-buffer@@">
<rect class="card" x="450" y="150" width="200" height="124" rx="4"/>
<rect class="bar" x="450" y="151" width="6" height="122" rx="2"/>
<text class="ttl" x="464" y="169">4  Scan store: buffer/</text>
<text x="464" y="184">ZFS pool on the home</text>
<text x="464" y="199">server; rolling buffer.</text>
<text x="464" y="214">A scan is deleted once its</text>
<text x="464" y="229">output is uploaded; the</text>
<text x="464" y="244">sidecar stays as .done</text>
<text class="st" x="464" y="259">@@lbl:store-buffer@@</text>
</g>
<g id="loc-buffer-node" class="box local" data-state="@@cls:nodes@@">
<rect class="card" x="450" y="332" width="200" height="139" rx="4"/>
<rect class="bar" x="450" y="333" width="6" height="137" rx="2"/>
<text class="ttl" x="464" y="351">7  OCR nodes 3 and 4</text>
<text x="464" y="366">worker + Tesseract in a</text>
<text x="464" y="381">container per page; reads</text>
<text x="464" y="396">the scan over HTTP, LoC</text>
<text x="464" y="411">only if the scan is missing</text>
<text x="464" y="426">or fails its checks</text>
<text x="464" y="441">@@txt:nodes@@</text>
<text class="st" x="464" y="456">@@lbl:nodes@@</text>
</g>
<g id="loc-buffer-dmg" class="box azure" data-state="@@cls:manifest@@">
<rect class="card" x="10" y="520" width="200" height="124" rx="4"/>
<rect class="bar" x="10" y="521" width="6" height="122" rx="2"/>
<text class="ttl" x="24" y="539">1  Damage pass, manifest</text>
<text x="24" y="554">ocr-damage scores every</text>
<text x="24" y="569">page; ocr-prefetch-manifest</text>
<text x="24" y="584">lists pages above 0.25 in</text>
<text x="24" y="599">curated/audit/damage/v2;</text>
<text x="24" y="614">copy in ocr-out/manifests</text>
<text class="st" x="24" y="629">@@lbl:manifest@@</text>
</g>
<g id="loc-buffer-seed" class="box azure" data-state="@@cls:seed-buffer@@">
<rect class="card" x="230" y="520" width="200" height="109" rx="4"/>
<rect class="bar" x="230" y="521" width="6" height="107" rx="2"/>
<text class="ttl" x="244" y="539">5  Seed step</text>
<text x="244" y="554">ocr-sync seeds ocr-bulk from</text>
<text x="244" y="569">a named plan, only pages</text>
<text x="244" y="584">already on the scan store</text>
<text x="244" y="599">(fetched list from node 3)</text>
<text class="st" x="244" y="614">@@lbl:seed-buffer@@</text>
</g>
<g id="loc-buffer-q" class="box azure" data-state="@@cls:queues@@">
<rect class="card" x="450" y="520" width="200" height="124" rx="4"/>
<rect class="bar" x="450" y="521" width="6" height="122" rx="2"/>
<text class="ttl" x="464" y="539">6  Queues</text>
<text x="464" y="554">ocr-bulk, ocr-priority;</text>
<text x="464" y="569">workers take priority first;</text>
<text x="464" y="584">unreadable pages go to</text>
<text x="464" y="599">ocr-deadletter</text>
<text x="464" y="614">@@txt:queues@@</text>
<text class="st" x="464" y="629">@@lbl:queues@@</text>
</g>
<g id="loc-buffer-out" class="box azure" data-state="@@cls:out@@">
<rect class="card" x="670" y="520" width="200" height="94" rx="4"/>
<rect class="bar" x="670" y="521" width="6" height="92" rx="2"/>
<text class="ttl" x="684" y="539">8  ocr-out</text>
<text x="684" y="554">ALTO and one-row parts</text>
<text x="684" y="569">from the nodes; entries are</text>
<text x="684" y="584">deleted after 30 days</text>
<text class="st" x="684" y="599">@@lbl:out@@</text>
</g>
<g id="loc-buffer-sync" class="box azure" data-state="@@cls:sync@@">
<rect class="card" x="890" y="520" width="200" height="109" rx="4"/>
<rect class="bar" x="890" y="521" width="6" height="107" rx="2"/>
<text class="ttl" x="904" y="539">9  ocr-sync</text>
<text x="904" y="554">hourly job: checks each</text>
<text x="904" y="569">part, moves rejects to</text>
<text x="904" y="584">ocr-quarantine, deletes</text>
<text x="904" y="599">what it has picked up</text>
<text class="st" x="904" y="614">@@lbl:sync@@</text>
</g>
<g id="loc-buffer-loc" class="box azure" data-state="@@cls:ocrlocal@@">
<rect class="card" x="890" y="674" width="200" height="94" rx="4"/>
<rect class="bar" x="890" y="675" width="6" height="92" rx="2"/>
<text class="ttl" x="904" y="693">10  curated/ocr-local/</text>
<text x="904" y="708">alto, pages by lccn,</text>
<text x="904" y="723">deadletter, revoked;</text>
<text x="904" y="738">both damage scores kept</text>
<text class="st" x="904" y="753">@@lbl:ocrlocal@@</text>
</g>
<g id="loc-buffer-rb" class="box azure" data-state="@@cls:rebuild@@">
<rect class="card" x="670" y="674" width="200" height="109" rx="4"/>
<rect class="bar" x="670" y="675" width="6" height="107" rx="2"/>
<text class="ttl" x="684" y="693">11  Full rebuild (#283)</text>
<text x="684" y="708">release --ocr-local, set with</text>
<text x="684" y="723">USNM_OCR_LOCAL: our text</text>
<text x="684" y="738">replaces LoC's where it</text>
<text x="684" y="753">scores clearly lower damage</text>
<text class="st" x="684" y="768">@@lbl:rebuild@@</text>
</g>
<g id="loc-buffer-idx" class="box azure" data-state="@@cls:index-ocr@@">
<rect class="card" x="450" y="674" width="200" height="109" rx="4"/>
<rect class="bar" x="450" y="675" width="6" height="107" rx="2"/>
<text class="ttl" x="464" y="693">12  Search index</text>
<text x="464" y="708">qw-index and the</text>
<text x="464" y="723">reference snapshot;</text>
<text x="464" y="738">pages searchable with</text>
<text x="464" y="753">our text from here on</text>
<text class="st" x="464" y="768">@@lbl:index-ocr@@</text>
</g>
<path class="arrow" d="M330 107 L330 150" marker-end="url(#ah-loc-buffer)"/>
<text class="al" x="338.0" y="138">paced, honours Retry-After</text>
<path class="arrow" d="M110 520 L110 259" marker-end="url(#ah-loc-buffer)"/>
<path class="arrow" d="M210 204.5 L230 219.5" marker-end="url(#ah-loc-buffer)"/>
<path class="arrow" d="M430 219.5 L450 212" marker-end="url(#ah-loc-buffer)"/>
<path class="arrow" d="M520 274 L520 332" marker-end="url(#ah-loc-buffer)"/>
<text class="al" x="375.0" y="307.0">read, HTTP on the LAN</text>
<path class="arrow" d="M580 332 L580 274" marker-end="url(#ah-loc-buffer)"/>
<text class="al" x="588.0" y="307.0">delete after upload</text>
<path class="arrow" d="M430 574.5 L450 582" marker-end="url(#ah-loc-buffer)"/>
<path class="arrow" d="M550 520 L550 471" marker-end="url(#ah-loc-buffer)"/>
<text class="al" x="558.0" y="506">take</text>
<path class="arrow" d="M650 401.5 L770 401.5 L770 520" marker-end="url(#ah-loc-buffer)"/>
<text class="al" x="662" y="395.5">ALTO and parts, create only</text>
<path class="arrow" d="M870 567 L890 574.5" marker-end="url(#ah-loc-buffer)"/>
<path class="arrow" d="M990 629 L990 674" marker-end="url(#ah-loc-buffer)"/>
<path class="arrow" d="M890 721 L870 728.5" marker-end="url(#ah-loc-buffer)"/>
<path class="arrow" d="M670 728.5 L650 728.5" marker-end="url(#ah-loc-buffer)"/>
</svg>
