<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 1100 700" width="1100" height="700" role="img" aria-labelledby="loc-buffer-t loc-buffer-d">
<title id="loc-buffer-t">LoC buffer set: queued and quality-pass pages under buffer/</title>
<desc id="loc-buffer-d">The same path as the keep set for the pages filed under buffer/: queued English pages outside the keep set and quality-pass pages. OCR's buffer scans are kept; quality-pass scans are deleted after their chunk ships.</desc>
<style>
.dg { --k:#0b0b0b; --k2:#52514e; --bg:#fcfcfb; --lx:#f4f1e6; --lh:#f1f1ee; --la:#e8f0fb; --bx:#ffffff;
  --good:#0ca30c; --run:#2a78d6; --wait:#fab219; --none:#898781; width:100%; height:auto; max-width:1500px; display:block;
  font: 12px/1.2 system-ui, -apple-system, "Segoe UI", sans-serif; color:var(--k); }
@media (prefers-color-scheme: dark) { .dg { --k:#ffffff; --k2:#c3c2b7; --bg:#1a1a19; --lx:#2a2820; --lh:#262625;
  --la:#17233a; --bx:#0d0d0d; --run:#3987e5; } }
.dg text { fill:var(--k); } .dg .sub, .dg .lane { fill:var(--k2); }
.dg .lane.x { stroke:var(--lx); } .dg .lane.h { stroke:var(--lh); } .dg .lane.a { stroke:var(--la); }
.dg .lane { paint-order:stroke; stroke-width:5; stroke-linejoin:round; font-size:11px; font-weight:600; letter-spacing:0.04em; text-transform:uppercase; }
.dg .band { stroke:var(--none); stroke-width:1; stroke-opacity:0.35; }
.dg .band.x { fill:var(--lx); } .dg .band.h { fill:var(--lh); } .dg .band.a { fill:var(--la); }
.dg .card { fill:var(--bx); stroke:var(--k2); stroke-width:1.5; }
.dg .azure .card { stroke-dasharray:none; }
.dg .ttl { font-weight:700; font-size:13px; }
.dg .st { font-style:italic; fill:var(--k2); }
.dg .bar { fill:var(--none); }
.dg [data-state="done"] .bar { fill:var(--good); } .dg [data-state="running"] .bar { fill:var(--run); }
.dg [data-state="waiting"] .bar { fill:var(--wait); } .dg [data-state="failed"] .bar { fill:#d03b3b; }
.dg [data-state="not-built"] .card { stroke-dasharray:6 4; }
.dg .arrow { fill:none; stroke:var(--k2); stroke-width:1.5; }
.dg .tip { fill:var(--k2); }
.dg .al { font-size:11px; fill:var(--k2); }
</style>
<defs><marker id="ah-loc-buffer" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="tip" d="M0 0 L10 5 L0 10 z"/></marker></defs>
<rect x="0" y="0" width="1100" height="700" fill="none"/>
<rect class="band x" x="4" y="6" width="1092" height="112" rx="6"/>
<rect class="band h" x="4" y="126" width="1092" height="392" rx="6"/>
<rect class="band a" x="4" y="526" width="1092" height="168" rx="6"/>
<g id="loc-buffer-l" class="box x" data-state="none">
<rect class="card" x="230" y="26" width="860" height="79" rx="4"/>
<rect class="bar" x="230" y="27" width="6" height="77" rx="2"/>
<text class="ttl" x="244" y="45">Scan sources, in order</text>
<text x="244" y="60">1. LoC's S3 bucket ndnp-batches: public batches only (about 38% of pages), md5-checked, one request at a time</text>
<text x="244" y="75">2. State-partner Chronicling America mirrors (nbu, pst, oru, scu), then the Wayback Machine, for the JP2</text>
<text x="244" y="90">3. LoC's storage service; 4. the loc.gov item API and IIIF JPEG for a page the batch route cannot place</text>
</g>
<g id="loc-buffer-pull" class="box local" data-state="@@cls:pull@@">
<rect class="card" x="10" y="150" width="200" height="124" rx="4"/>
<rect class="bar" x="10" y="151" width="6" height="122" rx="2"/>
<text class="ttl" x="24" y="169">2  Manifests</text>
<text x="24" y="184">the plan, plus fetch lists</text>
<text x="24" y="199">built in the build container:</text>
<text x="24" y="214">queue-ocr-* (hourly, from</text>
<text x="24" y="229">queued pages), then</text>
<text x="24" y="244">queue-quality-* (every 2 h)</text>
<text class="st" x="24" y="259">@@lbl:pull@@</text>
</g>
<g id="loc-buffer-fet" class="box local" data-state="@@cls:fetch-buffer@@">
<rect class="card" x="230" y="150" width="200" height="139" rx="4"/>
<rect class="bar" x="230" y="151" width="6" height="137" rx="2"/>
<text class="ttl" x="244" y="169">3  Scan fetcher</text>
<text x="244" y="184">usnm-loc-fetch, same route</text>
<text x="244" y="199">and manifests; files queued</text>
<text x="244" y="214">and quality-pass pages that</text>
<text x="244" y="229">are not in the keep set</text>
<text x="244" y="244">under buffer/</text>
<text x="244" y="259">@@txt:fetch-buffer@@</text>
<text class="st" x="244" y="274">@@lbl:fetch-buffer@@</text>
</g>
<g id="loc-buffer-store" class="box local" data-state="@@cls:store-buffer@@">
<rect class="card" x="450" y="150" width="200" height="109" rx="4"/>
<rect class="bar" x="450" y="151" width="6" height="107" rx="2"/>
<text class="ttl" x="464" y="169">4  Scan store: buffer/</text>
<text x="464" y="184">ZFS pool on the home</text>
<text x="464" y="199">server. OCR's scans are kept;</text>
<text x="464" y="214">quality-pass scans are</text>
<text x="464" y="229">deleted after their chunk ships</text>
<text class="st" x="464" y="244">@@lbl:store-buffer@@</text>
</g>
<g id="loc-buffer-seed" class="box local" data-state="@@cls:seed@@">
<rect class="card" x="10" y="350" width="200" height="124" rx="4"/>
<rect class="bar" x="10" y="351" width="6" height="122" rx="2"/>
<text class="ttl" x="24" y="369">5  Seed and claim</text>
<text x="24" y="384">ocr-sync's hourly seed puts</text>
<text x="24" y="399">the named plan's pages in</text>
<text x="24" y="414">ocr_bulk; the claim takes</text>
<text x="24" y="429">only pages on the fetched</text>
<text x="24" y="444">list (every 30 min)</text>
<text class="st" x="24" y="459">@@lbl:seed@@</text>
</g>
<g id="loc-buffer-q" class="box local" data-state="@@cls:queues@@">
<rect class="card" x="230" y="350" width="200" height="124" rx="4"/>
<rect class="bar" x="230" y="351" width="6" height="122" rx="2"/>
<text class="ttl" x="244" y="369">6  Queues</text>
<text x="244" y="384">on-prem pgmq: ocr_priority,</text>
<text x="244" y="399">ocr_bulk; the claim takes</text>
<text x="244" y="414">priority first; unreadable</text>
<text x="244" y="429">pages go to ocr_deadletter</text>
<text x="244" y="444">@@txt:queues@@</text>
<text class="st" x="244" y="459">@@lbl:queues@@</text>
</g>
<g id="loc-buffer-node" class="box local" data-state="@@cls:nodes@@">
<rect class="card" x="450" y="350" width="200" height="124" rx="4"/>
<rect class="bar" x="450" y="351" width="6" height="122" rx="2"/>
<text class="ttl" x="464" y="369">7  BOINC usnm_ocr</text>
<text x="464" y="384">claimed pages bundled into</text>
<text x="464" y="399">workunits with their scans,</text>
<text x="464" y="414">read by volunteers, then</text>
<text x="464" y="429">collected on-prem (#1053)</text>
<text x="464" y="444">@@txt:nodes@@</text>
<text class="st" x="464" y="459">@@lbl:nodes@@</text>
</g>
<g id="loc-buffer-sync" class="box local" data-state="@@cls:sync@@">
<rect class="card" x="670" y="350" width="200" height="124" rx="4"/>
<rect class="bar" x="670" y="351" width="6" height="122" rx="2"/>
<text class="ttl" x="684" y="369">9  ocr-sync</text>
<text x="684" y="384">hourly, in the build</text>
<text x="684" y="399">container: checks each part,</text>
<text x="684" y="414">moves rejects to</text>
<text x="684" y="429">ocr-quarantine, imports the</text>
<text x="684" y="444">rest; also runs the seed</text>
<text class="st" x="684" y="459">@@lbl:sync@@</text>
</g>
<g id="loc-buffer-rb" class="box local" data-state="@@cls:rebuild@@">
<rect class="card" x="890" y="350" width="200" height="124" rx="4"/>
<rect class="bar" x="890" y="351" width="6" height="122" rx="2"/>
<text class="ttl" x="904" y="369">11  Release / rebuild</text>
<text x="904" y="384">full rebuild (#283) built</text>
<text x="904" y="399">in the build container;</text>
<text x="904" y="414">USNM_OCR_LOCAL: our text</text>
<text x="904" y="429">where preferred; weekly</text>
<text x="904" y="444">releases return with #955</text>
<text class="st" x="904" y="459">@@lbl:rebuild@@</text>
</g>
<g id="loc-buffer-dmg" class="box azure" data-state="@@cls:manifest@@">
<rect class="card" x="10" y="560" width="200" height="109" rx="4"/>
<rect class="bar" x="10" y="561" width="6" height="107" rx="2"/>
<text class="ttl" x="24" y="579">1  Damage pass, manifest</text>
<text x="24" y="594">ocr-damage scores every</text>
<text x="24" y="609">page; ocr-prefetch-manifest</text>
<text x="24" y="624">lists pages above 0.25 in</text>
<text x="24" y="639">curated/audit/damage/v2</text>
<text class="st" x="24" y="654">@@lbl:manifest@@</text>
</g>
<g id="loc-buffer-out" class="box azure" data-state="@@cls:out@@">
<rect class="card" x="450" y="560" width="200" height="109" rx="4"/>
<rect class="bar" x="450" y="561" width="6" height="107" rx="2"/>
<text class="ttl" x="464" y="579">8  ocr-out</text>
<text x="464" y="594">Azure exchange container:</text>
<text x="464" y="609">ALTO and one-row parts from</text>
<text x="464" y="624">the collect; the fetched list;</text>
<text x="464" y="639">entries deleted after 30 days</text>
<text class="st" x="464" y="654">@@lbl:out@@</text>
</g>
<g id="loc-buffer-loc" class="box azure" data-state="@@cls:ocrlocal@@">
<rect class="card" x="670" y="560" width="200" height="94" rx="4"/>
<rect class="bar" x="670" y="561" width="6" height="92" rx="2"/>
<text class="ttl" x="684" y="579">10  curated/ocr-local/</text>
<text x="684" y="594">alto, pages by lccn,</text>
<text x="684" y="609">deadletter, revoked;</text>
<text x="684" y="624">both damage scores kept</text>
<text class="st" x="684" y="639">@@lbl:ocrlocal@@</text>
</g>
<g id="loc-buffer-idx" class="box azure" data-state="@@cls:index-ocr@@">
<rect class="card" x="890" y="560" width="200" height="109" rx="4"/>
<rect class="bar" x="890" y="561" width="6" height="107" rx="2"/>
<text class="ttl" x="904" y="579">12  Search index</text>
<text x="904" y="594">its own index storage</text>
<text x="904" y="609">account; the API reads it</text>
<text x="904" y="624">through the searcher. Our</text>
<text x="904" y="639">text is searchable from here</text>
<text class="st" x="904" y="654">@@lbl:index-ocr@@</text>
</g>
<path class="arrow" d="M550 105 L550 125 L330 125 L330 150" marker-end="url(#ah-loc-buffer)"/>
<text class="al" x="338" y="142">paced, honours Retry-After</text>
<path class="arrow" d="M220 560 L220 244 L210 244" marker-end="url(#ah-loc-buffer)"/>
<path class="arrow" d="M210 200 L230 200" marker-end="url(#ah-loc-buffer)"/>
<path class="arrow" d="M430 200 L450 200" marker-end="url(#ah-loc-buffer)"/>
<path class="arrow" d="M550 259 L550 350" marker-end="url(#ah-loc-buffer)"/>
<text class="al" x="558" y="300">scans, sent on-prem</text>
<path class="arrow" d="M500 259 L500 320 L110 320 L110 350" marker-end="url(#ah-loc-buffer)"/>
<text class="al" x="300" y="314">fetched list</text>
<path class="arrow" d="M210 410 L230 410" marker-end="url(#ah-loc-buffer)"/>
<path class="arrow" d="M430 410 L450 410" marker-end="url(#ah-loc-buffer)"/>
<text class="al" x="432" y="404">claim</text>
<path class="arrow" d="M550 474 L550 560" marker-end="url(#ah-loc-buffer)"/>
<text class="al" x="558" y="545">results</text>
<path class="arrow" d="M650 590 L700 474" marker-end="url(#ah-loc-buffer)"/>
<text class="al" x="690" y="545">read</text>
<path class="arrow" d="M800 474 L800 560" marker-end="url(#ah-loc-buffer)"/>
<text class="al" x="808" y="545">import</text>
<path class="arrow" d="M870 600 L960 474" marker-end="url(#ah-loc-buffer)"/>
<path class="arrow" d="M1020 474 L1020 560" marker-end="url(#ah-loc-buffer)"/>
<text class="al" x="1028" y="545">publish</text>
<text class="lane x" x="14" y="22">Library of Congress and mirrors</text>
<text class="lane h" x="14" y="142">Home network (on-premises)</text>
<text class="lane a" x="14" y="542">Azure (exchange account, data lake, index storage)</text>
</svg>
