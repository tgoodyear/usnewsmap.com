[package]
name = "usnm-core"
version = "0.1.0"
description = "US News Map domain types: page keys, time buckets, query language, canonical parameters"
edition.workspace = true
# The code is MIT. The word lists under data/ (zstd-compressed as .txt.zst,
# except data/page-language-words.txt) are data exported from wordfreq 3.1.1
# (CC BY-SA 4.0, with Google Books Ngram terms), except
# data/damage-words/chr.txt.zst, chr-attested.txt.zst and haw.txt.zst (CC0) and yi.txt.zst (CC BY-SA
# 4.0), and data/page-language-words.txt, derived from all of them (CC BY-SA 4.0):
# data/README.md.
license = "MIT AND CC-BY-SA-4.0 AND CC0-1.0"
rust-version.workspace = true

[dependencies]
anyhow = { workspace = true, optional = true }
caseless.workspace = true
chrono.workspace = true
form_urlencoded.workspace = true
fst = { workspace = true, optional = true }
httpdate.workspace = true
libm = { workspace = true, optional = true }
rustc-hash.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json = { workspace = true, optional = true }
sha2.workspace = true
thiserror.workspace = true
unicode-general-category.workspace = true
unicode-normalization.workspace = true

[features]
# The damage metric and its word lists (12 §12.5 Steps 4 and 5): off by
# default, so the API binary doesn't embed the lists.
damage = ["dep:serde_json"]
# The reference-free OCR quality measure, version 1 (`qe`): its resource
# files are downloaded, not embedded.
qe = ["dep:anyhow", "dep:fst", "dep:libm", "dep:serde_json"]

[build-dependencies]
zstd.workspace = true

# Packs and applies the quality measure's resource files (docs in the example).
[[example]]
name = "qe"
required-features = ["qe"]

[dev-dependencies]
serde_json.workspace = true
zstd.workspace = true

[lints]
workspace = true
