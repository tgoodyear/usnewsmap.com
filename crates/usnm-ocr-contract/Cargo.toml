[package]
name = "usnm-ocr-contract"
version = "0.1.0"
description = "US News Map on-prem OCR wire formats: queue messages, dead letters, the scan prefetch manifest, the engine contract and the runs record (#296, #307; 13 §13.2, §13.4)"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = ["pipeline"]
pipeline = [
    "dep:usnm-core",
    "dep:usnm-overlay",
    "dep:usnm-alto",
    "dep:arrow-array",
    "dep:arrow-schema",
    "dep:parquet",
    "dep:bytes",
    "dep:clap",
]

[[bin]]
name = "usnm-ocr-contract-schema"
path = "src/bin/usnm-ocr-contract-schema.rs"
required-features = ["pipeline"]

[dependencies]
usnm-core = { workspace = true, optional = true }
usnm-overlay = { workspace = true, optional = true }
usnm-alto = { workspace = true, optional = true }
anyhow.workspace = true
arrow-array = { workspace = true, optional = true }
arrow-schema = { workspace = true, optional = true }
base64.workspace = true
bytes = { workspace = true, optional = true }
chrono.workspace = true
clap = { workspace = true, optional = true }
parquet = { workspace = true, optional = true }
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true

[lints]
workspace = true
