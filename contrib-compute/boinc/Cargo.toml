[package]
name = "usnm-boinc"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
publish = false
description = "BOINC project glue for the usnewsmap OCR contribution route: work generator, validator, assimilator, runner"

[lib]
name = "usnm_boinc"
path = "src/lib.rs"

[[bin]]
name = "usnm-boinc-workgen"
path = "src/bin/workgen.rs"

[[bin]]
name = "usnm-boinc-validate"
path = "src/bin/validate.rs"

[[bin]]
name = "usnm-boinc-assimilate"
path = "src/bin/assimilate.rs"

[[bin]]
name = "usnm-ocr-run"
path = "src/bin/ocr_run.rs"

[dependencies]
md-5 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[lints.clippy]
all = "warn"
