name: codeql

# CodeQL's advanced setup, in place of default setup, so a change analyses
# only the languages it touches (scripts/ci/codeql-languages.sh): an HTML,
# CSS, Markdown, Bicep or JSON data change runs no analysis (package.json,
# lock files and tsconfig*.json count as JavaScript). The weekly run
# analyses every language on main, as default setup did. Same languages,
# query suite and build mode as default setup, and the same categories
# (/language:<lang>), so the alerts it raised carry over. Rust is analysed on
# main pushes and weekly, not on pull requests (#1585).
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A push to main analyses only its own diff, so each gets its own group: a later push must not
  # replace a pending scan of Rust that pull requests leave to main (#1585).
  group: codeql-${{ github.event.pull_request.number || (github.event_name == 'push' && github.sha) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  languages:
    name: codeql languages
    runs-on: ubuntu-latest
    outputs:
      languages: ${{ steps.l.outputs.languages }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: l
        run: scripts/ci/codeql-languages.sh
        env:
          BEFORE_SHA: ${{ github.event.before }}

  analyze:
    name: codeql (${{ matrix.language }})
    needs: languages
    if: needs.languages.outputs.languages != '[]'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(needs.languages.outputs.languages) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}
