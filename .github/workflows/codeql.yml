name: codeql

# CodeQL's advanced setup, in place of default setup, so a change analyses
# only the languages it touches (scripts/ci/codeql-languages.sh): an HTML,
# CSS, Markdown, Bicep or JSON data change runs no analysis (package.json,
# lock files and tsconfig*.json count as JavaScript). The weekly run
# analyses every language on main, as default setup did. Same languages,
# query suite and build mode as default setup, and the same categories
# (/language:<lang>), so the alerts it raised carry over.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  languages:
    name: codeql languages
    runs-on: ubuntu-latest
    outputs:
      languages: ${{ steps.l.outputs.languages }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: l
        run: scripts/ci/codeql-languages.sh
        env:
          BEFORE_SHA: ${{ github.event.before }}

  analyze:
    name: codeql (${{ matrix.language }})
    needs: languages
    if: needs.languages.outputs.languages != '[]'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(needs.languages.outputs.languages) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: /language:${{ matrix.language }}
