name: boinc-worker
# Native builds on both architectures. Publishing remains manual and main-only.
run-name: ${{ github.event_name == 'workflow_dispatch' && format('boinc-worker ({0})', inputs.correlation) || github.event.pull_request.title }}
on:
  workflow_dispatch:
    inputs:
      correlation:
        description: Identifies this run
        required: false
        default: manual
  pull_request:
    paths:
      - .github/workflows/boinc-worker.yml
      - .github/actions/boinc-worker-build/**
      - ocr/engines/tesseract/**
      - ocr/engines/engines.toml
      - ocr/boinc/Containerfile
      - scripts/boinc/smoke-worker.py
      - crates/**
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - .dockerignore
      # Files the crates it builds embed (scripts/ci/changes.sh finds them).
      - "catalog/**"
      - "fixtures/ocr-gold/bundle-v1.lock.json"
      - "infra/quickwit/**"
      - "ocr/boinc/qwen/disk-policy.json"
      - "ocr/boinc/qwen/weights.lock"
      - "ocr/boinc/usnm_qwen_benchmark_in"
      - "ocr/engines/ndlocr-lite/models.lock"
      - "ocr/routing/routes.toml"
      - "!**/*.md"
permissions:
  contents: read
concurrency:
  group: boinc-worker-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  IMAGE: ghcr.io/tgoodyear/usnm-boinc-worker
jobs:
  # Whether this change touches what the image is built from (scripts/ci/changes.sh):
  # a crate counts when the image builds it, not for being under crates/.
  # Not named `changes`: ci.yml's required check has that name.
  inputs:
    name: worker image inputs
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.f.outputs.boinc_worker }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: f
        run: scripts/ci/changes.sh
  check:
    name: worker image (${{ matrix.arch }}, native build)
    needs: inputs
    if: github.event_name == 'pull_request' && needs.inputs.outputs.build == 'true'
    strategy: &native
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            base: mirror.gcr.io/library/debian@sha256:918311b7b6c4c6f68b232ba516584925f6c78ad82b6fd534b98979df6438e483
            rust: docker.io/library/rust@sha256:b36c246742b4d323472588f789601be34eb4af053255e2af53969078ee8dcec7
          - arch: arm64
            runner: ubuntu-24.04-arm
            base: docker.io/library/debian@sha256:a2ca65377c251208de42e1a2722cb949211236c161b634f6f3663754e2d06850
            rust: docker.io/library/rust@sha256:e393e07b3c3c39f238de676b0eb60c03dc7aefe5d6e37be6d29c686bf4d7e256
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/boinc-worker-build
        with:
          image: ${{ env.IMAGE }}
          tag: ${{ github.sha }}-${{ matrix.arch }}
          arch: ${{ matrix.arch }}
          base_image: ${{ matrix.base }}
          rust_image: ${{ matrix.rust }}
  publish:
    name: worker image (${{ matrix.arch }}, build and push)
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    strategy: *native
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: build
        uses: ./.github/actions/boinc-worker-build
        with:
          image: ${{ env.IMAGE }}
          tag: ${{ github.sha }}-${{ matrix.arch }}
          arch: ${{ matrix.arch }}
          base_image: ${{ matrix.base }}
          rust_image: ${{ matrix.rust }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Push the tested architecture
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
          ARCH: ${{ matrix.arch }}
          ENGINE: ${{ steps.build.outputs.tesseract_image }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$ACTOR" --password-stdin
          trap 'docker logout ghcr.io' EXIT
          tag="$IMAGE:$GITHUB_SHA-$ARCH"
          docker push "$tag"
          digest=$(docker buildx imagetools inspect "$tag" --format '{{json .Manifest}}' | jq -er .digest)
          [[ $digest =~ ^sha256:[0-9a-f]{64}$ ]]
          mkdir release
          jq -n --arg arch "$ARCH" --arg image "$IMAGE@$digest" --arg engine "$ENGINE" --arg commit "$GITHUB_SHA" \
            '{arch:$arch,image:$image,tesseract_image:$engine,commit:$commit}' > "release/$ARCH.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: boinc-worker-release-${{ matrix.arch }}
          path: release/*.json
          if-no-files-found: error
  index:
    name: worker image (publish multi-architecture index)
    needs: publish
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.index.outputs.digest }}
      image: ${{ steps.index.outputs.image }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: boinc-worker-release-*
          merge-multiple: true
          path: release
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - id: index
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$ACTOR" --password-stdin
          trap 'docker logout ghcr.io' EXIT
          refs=()
          for arch in amd64 arm64; do
            file="release/$arch.json"
            jq -e --arg a "$arch" --arg c "$GITHUB_SHA" '.arch == $a and .commit == $c' "$file" > /dev/null
            ref=$(jq -er .image "$file")
            [[ $ref == "$IMAGE@sha256:"* && ${ref##*@} =~ ^sha256:[0-9a-f]{64}$ ]]
            refs+=("$ref")
          done
          docker buildx imagetools create --tag "$IMAGE:$GITHUB_SHA" "${refs[@]}"
          manifest=$(docker buildx imagetools inspect "$IMAGE:$GITHUB_SHA" --format '{{json .Manifest}}')
          jq -e '[.manifests[].platform | select(.os == "linux") | .architecture] | sort == ["amd64", "arm64"]' <<< "$manifest" > /dev/null
          digest=$(jq -er .digest <<< "$manifest")
          [[ $digest =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "image=$IMAGE@$digest" >> "$GITHUB_OUTPUT"
          {
            echo "Worker index: $IMAGE@$digest"
            echo
            echo '| Architecture | Worker manifest | TESSERACT_IMAGE (engine configuration ID) |'
            echo '| --- | --- | --- |'
            for arch in amd64 arm64; do
              jq -r '[.arch,.image,.tesseract_image] | "| " + join(" | ") + " |"' "release/$arch.json"
            done
            echo
            echo 'Use the index digest for worker/cohort identity. Assessment/gold engine-base metadata remains architecture-specific.'
            echo 'Verify anonymous pulls, drain old cohorts, and sign/publish a new app version before using this release.'
          } >> "$GITHUB_STEP_SUMMARY"
