name: boinc-worker
# The BOINC worker image volunteers pull (ADR-0019, addendum): the Tesseract
# engine image first, then ocr/boinc/Containerfile on it, with TESSERACT_IMAGE
# pinned to the engine's image id. A manual run publishes it to
# ghcr.io/tgoodyear/usnm-boinc-worker and reports its registry digest and its
# TESSERACT_IMAGE (docs/boinc.md, "Publish the worker image"). A pull request
# that changes what it is built from builds it without pushing.
#
# Publishing is manual on purpose: every pushed image needs its own signed app
# version and a drained cohort before it is used (docs/boinc.md, "Build the
# worker image"), so a push to main publishes nothing.
# The run's name carries the dispatch's correlation id, so the one who started it
# can find this run (docs/boinc.md, "Publish the worker image").
run-name: ${{ github.event_name == 'workflow_dispatch' && format('boinc-worker ({0})', inputs.correlation) || github.event.pull_request.title }}
on:
  workflow_dispatch:
    inputs:
      correlation:
        description: "Identifies this run, for finding it after the dispatch"
        required: false
        default: "manual"
  pull_request:
    paths:
      - ".github/workflows/boinc-worker.yml"
      - "ocr/engines/tesseract/**"
      - "ocr/boinc/Containerfile"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".dockerignore"

permissions:
  contents: read

concurrency:
  group: boinc-worker-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/tgoodyear/usnm-boinc-worker

jobs:
  worker:
    name: worker image (build${{ github.event_name == 'workflow_dispatch' && ', push' || '' }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
      image: ${{ steps.push.outputs.image }}
      tesseract_image: ${{ steps.engine.outputs.tesseract_image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The plain docker builder: ocr/boinc/Containerfile is FROM the engine's
      # local image id, which only the daemon's own image store can resolve.
      - name: Build the Tesseract engine image
        id: engine
        run: |
          docker build -f ocr/engines/tesseract/Containerfile -t usnm-ocr/tesseract:worker ocr/engines/tesseract
          id=$(docker image inspect --format '{{.Id}}' usnm-ocr/tesseract:worker)
          [[ $id =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::unexpected engine image id $id"; exit 1; }
          echo "tesseract_image=$id" >> "$GITHUB_OUTPUT"
          echo "engine image $id"
      - name: Build the worker image on it
        env:
          TESSERACT_IMAGE: ${{ steps.engine.outputs.tesseract_image }}
          SHA: ${{ github.sha }}
        run: |
          docker build -f ocr/boinc/Containerfile --build-arg "TESSERACT_IMAGE=$TESSERACT_IMAGE" \
            --build-arg TESSERACT_FROM=usnm-ocr/tesseract:worker \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=$SHA" \
            --label "org.opencontainers.image.description=usnewsmap BOINC OCR worker (Tesseract and usnm-boinc)" \
            -t "$IMAGE:$SHA" .
      # FROM resolved the engine's tag: its layers must be the engine's, in order.
      - name: The image is built on the engine image
        env:
          TESSERACT_IMAGE: ${{ steps.engine.outputs.tesseract_image }}
          SHA: ${{ github.sha }}
        run: |
          engine=$(docker image inspect --format '{{json .RootFS.Layers}}' "$TESSERACT_IMAGE")
          worker=$(docker image inspect --format '{{json .RootFS.Layers}}' "$IMAGE:$SHA")
          jq -e --argjson e "$engine" '.[0:($e | length)] == $e' <<< "$worker" > /dev/null ||
            { echo "::error::the worker image is not built on $TESSERACT_IMAGE"; exit 1; }
      - name: The image names its engine and runs usnm-boinc
        env:
          TESSERACT_IMAGE: ${{ steps.engine.outputs.tesseract_image }}
          SHA: ${{ github.sha }}
        run: |
          got=$(docker image inspect --format '{{range .Config.Env}}{{println .}}{{end}}' "$IMAGE:$SHA" |
            sed -n 's/^USNM_TESSERACT_IMAGE=//p')
          [ "$got" = "$TESSERACT_IMAGE" ] || { echo "::error::USNM_TESSERACT_IMAGE is '$got', not $TESSERACT_IMAGE"; exit 1; }
          docker run --rm --network=none "$IMAGE:$SHA" /usr/local/bin/usnm-boinc --help > /dev/null
          docker run --rm --network=none "$IMAGE:$SHA" tesseract --version
      - name: Push to GHCR
        id: push
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
          SHA: ${{ github.sha }}
          TESSERACT_IMAGE: ${{ steps.engine.outputs.tesseract_image }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$ACTOR" --password-stdin
          docker push "$IMAGE:$SHA"
          ref=$(docker image inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$IMAGE:$SHA" | grep "^$IMAGE@" | head -n 1)
          digest=${ref#"$IMAGE@"}
          [[ $digest =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::no registry digest after the push ($ref)"; exit 1; }
          docker logout ghcr.io
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "image=$IMAGE@$digest" >> "$GITHUB_OUTPUT"
          {
            echo "### Worker image"
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| image | \`$IMAGE@$digest\` |"
            echo "| digest (GOLD_ENGINE_IMAGE, ASSESS_ENGINE_IMAGE) | \`$digest\` |"
            echo "| TESSERACT_IMAGE (GOLD_ENGINE_BASE, ASSESS_ENGINE_BASE) | \`$TESSERACT_IMAGE\` |"
            echo "| commit | \`$SHA\` |"
            echo
            echo "A new package is private: make it public once (docs/boinc.md, \"Publish the worker image\")."
          } >> "$GITHUB_STEP_SUMMARY"
