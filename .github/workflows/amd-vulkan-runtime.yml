name: amd-vulkan-runtime
on:
  workflow_dispatch:
  pull_request:
    paths:
      - scripts/ci/lavapipe.lock
      - .github/workflows/amd-vulkan-runtime.yml
      - boinc/apps/qwen/amd-device-map.cpp
      - boinc/apps/qwen/llama.lock
      - boinc/scripts/patch_amd_vulkan_identity.py
      - boinc/scripts/build_amd_vulkan_runtime.ps1
  push:
    branches: [main]
    paths:
      - scripts/ci/lavapipe.lock
      - .github/workflows/amd-vulkan-runtime.yml
      - boinc/apps/qwen/amd-device-map.cpp
      - boinc/apps/qwen/llama.lock
      - boinc/scripts/patch_amd_vulkan_identity.py
      - boinc/scripts/build_amd_vulkan_runtime.ps1

permissions:
  contents: read

jobs:
  # Unsigned build input for the reviewed Windows AMD release. It is not hardware acceptance.
  windows:
    name: patched b12084 Vulkan runtime (Windows x64)
    runs-on: windows-2025
    timeout-minutes: 120
    env:
      VULKAN_VERSION: 1.4.357.0
      VULKAN_SHA256: 81f474711e9042f4cd22b31b2f7a8870db2e428b21586fb43dd80150be97310d
      LLAMA_COMMIT: f9448cddc48c129a4abc7ff9c2a84c2b4c101c61
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ggml-org/llama.cpp
          ref: ${{ env.LLAMA_COMMIT }}
          path: amd-llama-source
          persist-credentials: false
      - name: Install pinned Vulkan SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Join-Path $env:RUNNER_TEMP 'VulkanSDK-Installer.exe'
          Invoke-WebRequest "https://sdk.lunarg.com/sdk/download/$env:VULKAN_VERSION/windows/vulkansdk-windows-X64-$env:VULKAN_VERSION.exe" -OutFile $installer
          if ((Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:VULKAN_SHA256) { throw 'Vulkan SDK digest mismatch' }
          & $installer --accept-licenses --default-answer --confirm-command install
          if ($LASTEXITCODE -ne 0) { throw 'Vulkan SDK installation failed' }
          Add-Content $env:GITHUB_ENV "VULKAN_SDK=C:\VulkanSDK\$env:VULKAN_VERSION"
          Add-Content $env:GITHUB_PATH "C:\VulkanSDK\$env:VULKAN_VERSION\bin"
      - name: Build patched runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $vcvars = Join-Path $vs 'VC\Auxiliary\Build\vcvars64.bat'
          cmd /c "`"$vcvars`" && pwsh -NoProfile -File boinc\scripts\build_amd_vulkan_runtime.ps1 -Source amd-llama-source -Build amd-llama-build -Output amd-vulkan-runtime"
          if ($LASTEXITCODE -ne 0) { throw 'Patched runtime build failed' }
      - name: Compare loading against the pinned release registry
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $asset = (Get-Content boinc\apps\qwen\llama.lock -Raw | ConvertFrom-Json).assets.'win-vulkan-x64'
          gh release download b12084 --repo ggml-org/llama.cpp --pattern $asset.file --dir amd-pinned
          if ($LASTEXITCODE -ne 0) { throw 'Pinned release download failed' }
          $zip = Join-Path amd-pinned $asset.file
          if ((Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne $asset.sha256) { throw 'Pinned release digest mismatch' }
          Expand-Archive $zip amd-baseline
          New-Item -ItemType Directory amd-patched | Out-Null
          Copy-Item amd-baseline\* amd-patched -Recurse
          Copy-Item amd-vulkan-runtime\ggml-vulkan.dll amd-patched\ggml-vulkan.dll -Force
          $source = Join-Path $PWD 'boinc\apps\qwen\amd-device-map.cpp'
          @"
          #define main helper_main
          #include "$($source.Replace('\','/'))"
          #undef main
          int main(int argc, char **argv) {
              if (argc != 2) return 2;
              try { std::printf("%zu\n", vulkan_devices(argv[1]).size()); return 0; }
              catch (const std::exception &e) { std::printf("%s\n", e.what()); return 1; }
          }
          "@ | Set-Content amd-probe.cpp -Encoding ascii
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          cmd /c "`"$(Join-Path $vs 'VC\Auxiliary\Build\vcvars64.bat')`" && cl /nologo /std:c++17 /EHsc /W4 /WX /D_CRT_SECURE_NO_WARNINGS amd-probe.cpp /Fe:amd-probe.exe"
          if ($LASTEXITCODE -ne 0) { throw 'Probe build failed' }
          # The hosted runner has no GPU, so matching device results alone do not prove
          # compatibility; the plugin checks below must also pass.
          $baseline = & .\amd-probe.exe (Resolve-Path amd-baseline); $baselineCode = $LASTEXITCODE
          $patched = & .\amd-probe.exe (Resolve-Path amd-patched); $patchedCode = $LASTEXITCODE
          "baseline=$baselineCode $baseline"; "patched=$patchedCode $patched"
          if ($baselineCode -ne $patchedCode -or "$baseline" -ne "$patched") { throw 'Patched runtime changed pinned plugin loading' }
          # Independent of GPU initialization: each plugin must load with its bundle and export
          # the backend entry point, and the patched DLL must keep the signed ABI and imports.
          @"
          #include <windows.h>
          #include <cstdio>
          int wmain(int argc, wchar_t **argv) {
              if (argc != 2) return 2;
              HMODULE dll = LoadLibraryExW(argv[1], nullptr, LOAD_WITH_ALTERED_SEARCH_PATH);
              if (!dll) { std::printf("load failed %lu\n", GetLastError()); return 1; }
              bool ok = GetProcAddress(dll, "ggml_backend_init") != nullptr;
              FreeLibrary(dll);
              std::puts(ok ? "plugin loaded" : "ggml_backend_init missing");
              return ok ? 0 : 1;
          }
          "@ | Set-Content amd-load.cpp -Encoding ascii
          cmd /c "`"$(Join-Path $vs 'VC\Auxiliary\Build\vcvars64.bat')`" && cl /nologo /EHsc /W4 /WX amd-load.cpp /Fe:amd-load.exe && dumpbin /nologo /exports amd-baseline\ggml-vulkan.dll > amd-baseline.exports && dumpbin /nologo /exports amd-patched\ggml-vulkan.dll > amd-patched.exports && dumpbin /nologo /dependents amd-baseline\ggml-vulkan.dll > amd-baseline.imports && dumpbin /nologo /dependents amd-patched\ggml-vulkan.dll > amd-patched.imports"
          if ($LASTEXITCODE -ne 0) { throw 'Plugin inspection failed' }
          foreach ($bundle in 'amd-baseline', 'amd-patched') {
            $result = & .\amd-load.exe (Resolve-Path "$bundle\ggml-vulkan.dll"); "$bundle $result"
            if ($LASTEXITCODE -ne 0) { throw "$bundle plugin did not load" }
          }
          function Get-Exports($file) { @(Get-Content $file | ForEach-Object { if ($_ -match '^\s+\d+\s+[0-9A-F]+\s+[0-9A-F]+\s+(\S+)') { $Matches[1] } } | Sort-Object -Unique) }
          function Get-Imports($file) { @(Get-Content $file | ForEach-Object { if ($_ -match '^\s+(\S+\.dll)\s*$') { $Matches[1].ToLowerInvariant() } } | Sort-Object -Unique) }
          $baselineExports = Get-Exports amd-baseline.exports; $patchedExports = Get-Exports amd-patched.exports
          if ($baselineExports -notcontains 'ggml_backend_init' -or (Compare-Object $baselineExports $patchedExports)) { throw 'Patched runtime changed plugin exports' }
          $baselineImports = Get-Imports amd-baseline.imports; $patchedImports = Get-Imports amd-patched.imports
          $extra = @($patchedImports | Where-Object { $baselineImports -notcontains $_ })
          if (-not $patchedImports -or $extra) { throw "Patched runtime needs DLLs outside the signed bundle: $extra" }
          "exports=$($patchedExports -join ',')"; "imports=$($patchedImports -join ',')"
          $hash = (Get-FileHash amd-vulkan-runtime\ggml-vulkan.dll -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  ggml-vulkan.dll" | Set-Content amd-vulkan-runtime\SHA256SUMS -Encoding ascii
          git rev-parse HEAD | Set-Content amd-vulkan-runtime\GIT_COMMIT -Encoding ascii
      # docs/boinc/apps/amd-gpu.md step 2: the pinned release's own llama-server.exe must start with the
      # patched DLL and load it as its Vulkan backend, the same way it loads the original. The runner has
      # no GPU, so this step alone installs the scripts/ci/lavapipe.lock software driver (Mesa lavapipe).
      # It proves launch, backend registration and the identity export on a software device, not
      # inference on, or device mapping of, a real AMD card.
      - name: Launch the pinned llama-server.exe with the patched runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pin = Get-Content scripts\ci\lavapipe.lock -Raw | ConvertFrom-Json
          $archive = Join-Path $env:RUNNER_TEMP $pin.file
          Invoke-WebRequest $pin.url -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $pin.sha256) { throw 'lavapipe digest mismatch' }
          $mesa = Join-Path $env:RUNNER_TEMP 'mesa'
          & (Join-Path $env:ProgramFiles '7-Zip\7z.exe') x $archive "-o$mesa" -y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'lavapipe extraction failed' }
          $icd = Join-Path $mesa $pin.icd
          $driver = (Get-Content $icd -Raw | ConvertFrom-Json).ICD.library_path
          if (-not (Test-Path (Join-Path (Split-Path $icd) $driver))) { throw "lavapipe ICD names a missing driver: $driver" }
          # Only lavapipe, for this step only. The runner is elevated, and the Vulkan loader ignores
          # VK_DRIVER_FILES/VK_ICD_FILENAMES in elevated processes, so register the manifest under the
          # loader's driver key (empty on this runner) and remove it when the step ends.
          $drivers = 'HKLM:\SOFTWARE\Khronos\Vulkan\Drivers'
          if ((Test-Path $drivers) -and @((Get-Item $drivers).Property).Count) { throw "Runner already has Vulkan drivers: $((Get-Item $drivers).Property)" }
          New-Item $drivers -Force | Out-Null
          New-ItemProperty $drivers -Name $icd -PropertyType DWord -Value 0 | Out-Null
          try {
            # The loader must see it before llama.cpp is asked to.
            $vulkaninfo = Get-ChildItem (Join-Path $env:VULKAN_SDK 'Bin') -Filter 'vulkaninfo*.exe' | Select-Object -First 1
            if (-not $vulkaninfo) { throw 'Vulkan SDK has no vulkaninfo' }
            $env:VK_LOADER_DEBUG = 'error,warn,driver'
            $summary = & $vulkaninfo.FullName --summary 2>&1 | Out-String; $code = $LASTEXITCODE
            Remove-Item Env:VK_LOADER_DEBUG
            "== vulkaninfo exit=$code"; $summary
            if ($code -ne 0 -or $summary -notmatch 'llvmpipe') { throw 'The Vulkan loader did not load the lavapipe driver' }
            # ggml-vulkan skips CPU-type devices unless they are named, and lavapipe is one.
            $env:GGML_VK_VISIBLE_DEVICES = '0'
            # Every device the backend registers, with the identity the backend exports for it.
            $source = Join-Path $PWD 'boinc\apps\qwen\amd-device-map.cpp'
            @"
          #define main helper_main
          #include "$($source.Replace('\','/'))"
          #undef main
          int main(int argc, char **argv) {
              if (argc != 2) return 2;
              std::filesystem::path dir = argv[1];
              Library base((dir / "ggml-base.dll").string());
              Library registry((dir / "ggml.dll").string());
              auto load = registry.symbol<void *(*)(const char *)>("ggml_backend_load");
              auto count = base.symbol<size_t(*)(void *)>("ggml_backend_reg_dev_count");
              auto device = base.symbol<void *(*)(void *, size_t)>("ggml_backend_reg_dev_get");
              auto props = base.symbol<void(*)(void *, Props *)>("ggml_backend_dev_get_props");
              void *reg = load((dir / "ggml-vulkan.dll").string().c_str());
              if (!reg) { std::puts("no Vulkan backend"); return 1; }
              for (size_t i = 0, n = count(reg); i < n; ++i) {
                  Props value{};
                  props(device(reg, i), &value);
                  std::printf("%s|%s|%s\n", value.name ? value.name : "(null)",
                              value.description ? value.description : "(null)", value.device_id ? value.device_id : "(null)");
              }
              return 0;
          }
          "@ | Set-Content amd-devices.cpp -Encoding ascii
            $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
            $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
            cmd /c "`"$(Join-Path $vs 'VC\Auxiliary\Build\vcvars64.bat')`" && cl /nologo /std:c++17 /EHsc /W4 /WX /D_CRT_SECURE_NO_WARNINGS amd-devices.cpp /Fe:amd-devices.exe"
            if ($LASTEXITCODE -ne 0) { throw 'Device probe build failed' }
            $outputs = @{}; $devices = @{}
            foreach ($bundle in 'amd-baseline', 'amd-patched') {
              $dir = (Resolve-Path $bundle).Path
              foreach ($arguments in @('--version'), @('--list-devices')) {
                $log = Join-Path $env:RUNNER_TEMP "$bundle$($arguments[0])"
                $process = Start-Process (Join-Path $dir 'llama-server.exe') -ArgumentList $arguments -WorkingDirectory $dir `
                  -NoNewWindow -Wait -PassThru -RedirectStandardOutput "$log.out" -RedirectStandardError "$log.err"
                $text = (Get-Content "$log.out", "$log.err" -Raw) -join "`n"
                "== $bundle $($arguments -join ' ') exit=$($process.ExitCode)"; $text
                if ($process.ExitCode -ne 0) { throw "$bundle llama-server.exe $($arguments -join ' ') exited $($process.ExitCode)" }
                # Free memory moves between runs; everything else must match.
                $outputs["$bundle $($arguments[0])"] = ($text.Replace($dir, 'BUNDLE') -replace '\d+ MiB free', 'N MiB free')
              }
              $listed = & .\amd-devices.exe $dir 2> "$log-devices.err"; $code = $LASTEXITCODE
              $loaderLog = Get-Content "$log-devices.err" -Raw
              "== $bundle devices exit=$code"; $listed; $loaderLog
              if ($code -ne 0) { throw "$bundle Vulkan backend registered no devices" }
              if (-not $loaderLog.Replace($dir, 'BUNDLE').Contains('loaded Vulkan backend from BUNDLE\ggml-vulkan.dll')) {
                throw "$bundle did not load its own ggml-vulkan.dll"
              }
              $devices[$bundle] = @($listed)
            }
            foreach ($arguments in '--version', '--list-devices') {
              if ($outputs["amd-baseline $arguments"] -ne $outputs["amd-patched $arguments"]) {
                throw "llama-server.exe $arguments differs between the pinned and patched runtimes"
              }
            }
            if ($outputs['amd-patched --list-devices'] -notmatch '(?m)^\s*Vulkan0: llvmpipe') { throw 'llama-server.exe did not list the lavapipe device' }
            # llama-server.exe's logger hides ggml's INFO lines, so prove the source instead: it searches only
            # its own directory and the working directory (both the bundle; GGML_BACKEND_PATH unset), where
            # the only Vulkan backend is the patched DLL, so the listed device came from that DLL.
            if ($env:GGML_BACKEND_PATH) { throw 'GGML_BACKEND_PATH is set' }
            $candidates = @(Get-ChildItem amd-patched -Filter 'ggml-vulkan*.dll')
            $patchedHash = (Get-FileHash amd-vulkan-runtime\ggml-vulkan.dll -Algorithm SHA256).Hash
            if ($candidates.Count -ne 1 -or (Get-FileHash $candidates[0].FullName -Algorithm SHA256).Hash -ne $patchedHash) {
              throw 'The patched bundle does not hold exactly one Vulkan backend, the patched DLL'
            }
            # Same devices; the patch may only fill an identity the pinned runtime leaves empty, and only with a
            # nonzero 8-byte LUID (patch_amd_vulkan_identity.py).
            $baseline = $devices['amd-baseline']; $patched = $devices['amd-patched']
            if ($baseline.Count -lt 1 -or $baseline.Count -ne $patched.Count) { throw 'Patched runtime registered different devices' }
            for ($i = 0; $i -lt $baseline.Count; $i++) {
              $b = $baseline[$i].Split('|'); $p = $patched[$i].Split('|')
              if ($b[0] -ne $p[0] -or $b[1] -ne $p[1]) { throw "Device $i differs: $($baseline[$i]) / $($patched[$i])" }
              if ($b[2] -ne '(null)') {
                if ($p[2] -ne $b[2]) { throw "Patched runtime changed device $i's PCI identity" }
                "device ${i}: PCI identity $($b[2]) from VK_EXT_pci_bus_info, unchanged"
              } elseif ($p[2] -eq '(null)') {
                "device ${i}: no PCI bus info and no valid LUID; both runtimes export no identity"
              } elseif ($p[2] -match '^luid:[0-9a-f]{16}$' -and $p[2] -ne 'luid:0000000000000000') {
                "device ${i}: no PCI bus info; the patched runtime exports $($p[2])"
              } else { throw "Patched runtime exported an invalid identity for device ${i}: $($p[2])" }
            }
            "patched runtime: llama-server.exe starts, lists the same lavapipe device and loads the patched DLL"
          } finally {
            Remove-ItemProperty $drivers -Name $icd
          }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: amd-vulkan-runtime-windows_x86_64
          path: ${{ github.workspace }}/amd-vulkan-runtime/
          if-no-files-found: error
