name: boinc-ocr-native
# The native usnm_ocr and usnm_gold build (#1418, docs/boinc-native-ocr.md). It builds and smoke
# tests; it publishes nothing. The artifact is what a release would stage and sign.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/boinc-ocr-native.yml
      - boinc/apps/native/**
      - boinc/scripts/smoke-native-ocr.sh
      - boinc/scripts/check-native-ocr-build.py
      - boinc/scripts/install.py
      - boinc/images/appver/check_appver.py
      - ocr/engines/tesseract/models.lock
      - ocr/engines/tesseract/Containerfile
      - ocr/engines/engines.toml
      - .dockerignore
      - crates/**
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      # Files the crates it builds embed (scripts/ci/changes.sh finds them).
      - "docs/notes/2026-11-05-german-trust-hold.json"
      - "docs/notes/2026-11-07-serbian-trust-hold.json"
      - "fixtures/ocr-gold/bundle-v1.lock.json"
      - "boinc/apps/qwen/disk-policy.json"
      - "boinc/apps/qwen/weights.lock"
      - "boinc/apps/surya/engine.lock"
      - "boinc/apps/usnm_qwen_benchmark_in"
      - "ocr/engines/ndlocr-lite/models.lock"
      - "ocr/routing/routes.toml"
      - "boinc/scripts/acceptance_server.py"
      - "boinc/project/plan_class_spec.xml"
      - "!**/*.md"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # A crate counts when the app builds it, not for being under crates/ (scripts/ci/changes.sh).
  inputs:
    name: native OCR inputs
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.f.outputs.boinc_ocr_native }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: f
        run: scripts/ci/changes.sh
  build:
    needs: inputs
    if: needs.inputs.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable branch
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install musl tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools
      - name: Test the native worker
        run: "cargo test --locked -p usnm-boinc --lib native::"
      - name: Build the worker
        run: >-
          cargo build --release --locked --target x86_64-unknown-linux-musl
          -p usnm-ocr-app --bin usnm_ocr --example native_fixture
      - name: Build the static Tesseract
        run: |
          docker build -f boinc/apps/native/Containerfile -t usnm-tesseract-native boinc/apps/native
          mkdir build
          docker run --rm --network=none usnm-tesseract-native cat /out/usnm_tesseract > build/usnm_tesseract
          docker run --rm --network=none usnm-tesseract-native cat /out/usnm_tesseract.packages > usnm_tesseract.packages
          chmod +x build/usnm_tesseract
      - name: Fetch the locked models
        run: |
          mkdir tessdata
          grep '^tessdata/' ocr/engines/tesseract/models.lock | while read -r name url sum; do
            curl -fsSL --retry 10 --retry-all-errors --retry-delay 5 -o "$name" "$url"
            echo "$sum  $name" | sha256sum --check --quiet
            cp "$name" "build/tessdata_${name#tessdata/}"
          done
      - name: Make the build manifest
        # bash -eo pipefail, so tee doesn't hide a failure.
        shell: bash
        run: |
          cp target/x86_64-unknown-linux-musl/release/usnm_ocr build/usnm_ocr
          build/usnm_ocr manifest --worker build/usnm_ocr --tesseract "$PWD/build/usnm_tesseract" \
            --tessdata tessdata --out build/usnm_native_build.json | tee build.txt
      - name: Read a page, and refuse a job for another build
        run: boinc/scripts/smoke-native-ocr.sh --build build --fixture target/x86_64-unknown-linux-musl/release/examples/native_fixture
      # What boinc-app-release.sh and the appver image do to this build, short of signing: check it
      # is the container worker's engine and models, stage it, and check the staged version. The
      # signatures need the private key, so a stand-in verifier accepts any.
      - name: Check and stage the build as a release would
        shell: bash
        run: |
          extras=()
          for f in build/*; do [ "${f##*/}" = usnm_ocr ] || extras+=(--extra-file "${f##*/}=$f"); done
          python3 boinc/scripts/check-native-ocr-build.py --binary build/usnm_ocr "${extras[@]}" | tee -a build.txt
          mkdir release
          echo unused > release/code_sign_public
          for app in usnm_ocr_native usnm_gold_native; do
            mkdir -p "release/$app" "release/$app-sigs"
            touch "release/$app/config.xml"
            python3 boinc/scripts/install.py --project "$PWD/release/$app" --kind native --app "$app" \
              --version 1.0 --binary build/usnm_ocr --bundle-dir build
            d="release/$app/apps/$app/1.0/x86_64-pc-linux-gnu"
            for f in "$d"/*; do [ "${f##*/}" = version.xml ] || echo unsigned > "release/$app-sigs/${f##*/}.sig"; done
            python3 boinc/images/appver/check_appver.py --kind native --app "$app" \
              --platform x86_64-pc-linux-gnu --version-dir "$d" --sigs "release/$app-sigs" \
              --public-key release/code_sign_public --crypt-prog /usr/bin/true
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: boinc-ocr-native-x86_64-pc-linux-gnu
          path: |
            build/
            build.txt
            usnm_tesseract.packages
          if-no-files-found: error
