name: boinc-ocr-native
# The native usnm_ocr and usnm_gold build (#1418, docs/boinc/apps/native-ocr.md). It builds and smoke
# tests; it publishes nothing. The artifact is what a release would stage and sign.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/boinc-ocr-native.yml
      - boinc/apps/native/**
      - boinc/scripts/smoke-native-ocr.sh
      - scripts/ci/apt-base.sh
      - boinc/scripts/check-native-ocr-build.py
      - boinc/scripts/install.py
      - boinc/images/appver/check_appver.py
      - ocr/engines/tesseract/models.lock
      - ocr/engines/tesseract/Containerfile
      - ocr/engines/engines.toml
      - .dockerignore
      - crates/**
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      # Files the crates it builds embed (scripts/ci/changes.sh finds them).
      - "ocr/models/chr-phoenix/SHA256SUMS"
      - "docs/notes/2026-11-05-german-trust-hold.json"
      - "docs/notes/2026-11-07-serbian-trust-hold.json"
      - "fixtures/ocr-gold/bundle-v1.lock.json"
      - "boinc/apps/qwen/disk-policy.json"
      - "boinc/apps/qwen/weights.lock"
      - "boinc/apps/surya/engine.lock"
      - "boinc/apps/usnm_qwen_benchmark_in"
      - "boinc/apps/usnm_qwen_2b_benchmark_in"
      - "boinc/apps/usnm_qwen_8b_benchmark_in"
      - "boinc/apps/usnm_qwen_x08_benchmark_in"
      - "ocr/engines/ndlocr-lite/models.lock"
      - "ocr/routing/routes.toml"
      - "boinc/scripts/acceptance_server.py"
      - "boinc/project/native-build-trust.json"
      - "boinc/project/plan_class_spec.xml"
      - "!**/*.md"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # A crate counts when the app builds it, not for being under crates/ (scripts/ci/changes.sh).
  inputs:
    name: native OCR inputs
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.f.outputs.boinc_ocr_native }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: f
        run: scripts/ci/changes.sh
  build:
    needs: inputs
    if: needs.inputs.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable branch
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install musl tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools
      - name: Test the native worker
        run: "cargo test --locked -p usnm-boinc --lib native::"
      - name: Build the worker
        run: >-
          cargo build --release --locked --target x86_64-unknown-linux-musl
          -p usnm-ocr-app --bin usnm_ocr --example native_fixture
      - name: Build the static Tesseract
        run: |
          # The pinned apt base (boinc/apps/native/base.lock, #1683), its snapshot label checked.
          # None while the lock is empty: the build then installs from the Debian snapshot.
          lines=$(scripts/ci/apt-base.sh --app native --check-label docker)
          bases=()
          while IFS= read -r line; do [ -z "$line" ] || bases+=(--build-arg "$line"); done <<< "$lines"
          echo "apt base: ${lines:-none pinned, installing from the Debian snapshot}"
          docker build "${bases[@]}" -f boinc/apps/native/Containerfile -t usnm-tesseract-native boinc/apps/native
          mkdir build
          docker run --rm --network=none usnm-tesseract-native cat /out/usnm_tesseract > build/usnm_tesseract
          docker run --rm --network=none usnm-tesseract-native cat /out/usnm_tesseract.packages > usnm_tesseract.packages
          chmod +x build/usnm_tesseract
      - name: Fetch the locked models
        run: |
          mkdir tessdata
          grep '^tessdata/' ocr/engines/tesseract/models.lock | while read -r name url sum; do
            curl -fsSL --retry 10 --retry-all-errors --retry-delay 5 -o "$name" "$url"
            echo "$sum  $name" | sha256sum --check --quiet
            cp "$name" "build/tessdata_${name#tessdata/}"
          done
      # A model's notice and licence ship with it (Apache-2.0 section 4): chr_phoenix's, from its
      # release, each checked against the release's SHA256SUMS, itself checked against the hash
      # ocr/engines/tesseract/Containerfile pins (#1621).
      - name: Fetch the models' notices
        run: |
          base=$(sed -n 's/^ARG CHR_PHOENIX_RELEASE=//p' ocr/engines/tesseract/Containerfile)
          sums=$(sed -n 's/^ARG CHR_PHOENIX_SUMS=//p' ocr/engines/tesseract/Containerfile)
          mkdir -p tessdata/notices/chr_phoenix
          cd tessdata/notices/chr_phoenix
          for name in SHA256SUMS NOTICE.md LICENSE-Apache-2.0.txt; do
            curl -fsSL --retry 10 --retry-all-errors --retry-delay 5 -o "$name" "$base/$name"
          done
          echo "$sums  SHA256SUMS" | sha256sum --check --quiet
          grep -E '  (NOTICE\.md|LICENSE-Apache-2\.0\.txt)$' SHA256SUMS > checked
          [ "$(wc -l < checked)" -eq 2 ]
          sha256sum --check --quiet checked
          for name in NOTICE.md LICENSE-Apache-2.0.txt; do
            cp "$name" "$GITHUB_WORKSPACE/build/notice_chr_phoenix_$name"
          done
      - name: Make the build manifest
        # bash -eo pipefail, so tee doesn't hide a failure.
        shell: bash
        run: |
          cp target/x86_64-unknown-linux-musl/release/usnm_ocr build/usnm_ocr
          build/usnm_ocr manifest --worker build/usnm_ocr --tesseract "$PWD/build/usnm_tesseract" \
            --tessdata tessdata --out build/usnm_native_build.json | tee build.txt
      - name: Read a page, and refuse a job for another build
        run: boinc/scripts/smoke-native-ocr.sh --build build --fixture target/x86_64-unknown-linux-musl/release/examples/native_fixture
      # What boinc-app-release.sh and the appver image do to this build, short of signing: check it
      # is the container worker's engine and models, stage it, and check the staged version. The
      # signatures need the private key, so a stand-in verifier accepts any.
      - name: Check and stage the build as a release would
        shell: bash
        run: |
          extras=()
          for f in build/*; do [ "${f##*/}" = usnm_ocr ] || extras+=(--extra-file "${f##*/}=$f"); done
          python3 boinc/scripts/check-native-ocr-build.py --binary build/usnm_ocr "${extras[@]}" | tee -a build.txt
          mkdir release
          echo unused > release/code_sign_public
          for app in usnm_ocr_native usnm_gold_native; do
            mkdir -p "release/$app" "release/$app-sigs"
            touch "release/$app/config.xml"
            python3 boinc/scripts/install.py --project "$PWD/release/$app" --kind native --app "$app" \
              --version 1.0 --binary build/usnm_ocr --bundle-dir build
            d="release/$app/apps/$app/1.0/x86_64-pc-linux-gnu"
            for f in "$d"/*; do [ "${f##*/}" = version.xml ] || echo unsigned > "release/$app-sigs/${f##*/}.sig"; done
            python3 boinc/images/appver/check_appver.py --kind native --app "$app" \
              --platform x86_64-pc-linux-gnu --version-dir "$d" --sigs "release/$app-sigs" \
              --public-key release/code_sign_public --crypt-prog /usr/bin/true
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: boinc-ocr-native-x86_64-pc-linux-gnu
          path: |
            build/
            build.txt
            usnm_tesseract.packages
          if-no-files-found: error
  # The macOS builds (docs/boinc/apps/native-ocr.md, Native usnm_ocr on more platforms): the same
  # worker, and Tesseract built from the sources boinc/apps/native/macos-sources.lock pins. Each
  # runner builds for its own architecture. Each build is its own identity: nothing here compares
  # it with the Linux build or with the container's.
  macos:
    needs: inputs
    if: needs.inputs.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
            boinc_platform: arm64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            boinc_platform: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable branch
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Test the native worker
        run: cargo test --locked --target "${{ matrix.target }}" -p usnm-boinc --lib "native::"
      - name: Build the worker
        run: >-
          cargo build --release --locked --target "${{ matrix.target }}"
          -p usnm-ocr-app --bin usnm_ocr --example native_fixture
      - name: Build Tesseract from the pinned sources
        run: |
          boinc/apps/native/build-tesseract-macos.sh --out engine --work "$RUNNER_TEMP/tesseract"
          mkdir build
          cp engine/usnm_tesseract build/usnm_tesseract
          cat engine/usnm_tesseract.sources
      - name: Fetch the locked models
        run: |
          mkdir tessdata
          grep '^tessdata/' ocr/engines/tesseract/models.lock | while read -r name url sum; do
            curl -fsSL --retry 10 --retry-all-errors --retry-delay 5 -o "$name" "$url"
            echo "$sum  $name" | shasum -a 256 --check --quiet
            cp "$name" "build/tessdata_${name#tessdata/}"
          done
      - name: Fetch the models' notices
        run: |
          base=$(sed -n 's/^ARG CHR_PHOENIX_RELEASE=//p' ocr/engines/tesseract/Containerfile)
          sums=$(sed -n 's/^ARG CHR_PHOENIX_SUMS=//p' ocr/engines/tesseract/Containerfile)
          mkdir -p tessdata/notices/chr_phoenix
          cd tessdata/notices/chr_phoenix
          for name in SHA256SUMS NOTICE.md LICENSE-Apache-2.0.txt; do
            curl -fsSL --retry 10 --retry-all-errors --retry-delay 5 -o "$name" "$base/$name"
          done
          echo "$sums  SHA256SUMS" | shasum -a 256 --check --quiet
          grep -E '  (NOTICE\.md|LICENSE-Apache-2\.0\.txt)$' SHA256SUMS > checked
          [ "$(wc -l < checked)" -eq 2 ]
          shasum -a 256 --check --quiet checked
          for name in NOTICE.md LICENSE-Apache-2.0.txt; do
            cp "$name" "$GITHUB_WORKSPACE/build/notice_chr_phoenix_$name"
          done
      - name: Make the build manifest
        shell: bash
        run: |
          cp "target/${{ matrix.target }}/release/usnm_ocr" build/usnm_ocr
          codesign --force --sign - build/usnm_ocr
          build/usnm_ocr manifest --worker build/usnm_ocr --tesseract "$PWD/build/usnm_tesseract" \
            --tessdata tessdata --out build/usnm_native_build.json | tee build.txt
      - name: Read a page, and refuse a job for another build
        run: >-
          boinc/scripts/smoke-native-ocr.sh --build build
          --fixture "target/${{ matrix.target }}/release/examples/native_fixture"
      - name: Check and stage the build as a release would
        shell: bash
        run: |
          platform="${{ matrix.boinc_platform }}"
          extras=()
          for f in build/*; do [ "${f##*/}" = usnm_ocr ] || extras+=(--extra-file "${f##*/}=$f"); done
          python3 boinc/scripts/check-native-ocr-build.py --platform "$platform" --binary build/usnm_ocr \
            "${extras[@]}" | tee -a build.txt
          mkdir release
          echo unused > release/code_sign_public
          for app in usnm_ocr_native usnm_gold_native; do
            mkdir -p "release/$app" "release/$app-sigs"
            touch "release/$app/config.xml"
            python3 boinc/scripts/install.py --project "$PWD/release/$app" --kind native --app "$app" \
              --version 1.0 --platform "$platform" --binary build/usnm_ocr --bundle-dir build
            d="release/$app/apps/$app/1.0/$platform"
            for f in "$d"/*; do [ "${f##*/}" = version.xml ] || echo unsigned > "release/$app-sigs/${f##*/}.sig"; done
            python3 boinc/images/appver/check_appver.py --kind native --app "$app" \
              --platform "$platform" --version-dir "$d" --sigs "release/$app-sigs" \
              --public-key release/code_sign_public --crypt-prog /usr/bin/true
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: boinc-ocr-native-${{ matrix.boinc_platform }}
          path: |
            build/
            build.txt
            engine/usnm_tesseract.sources
          if-no-files-found: error
