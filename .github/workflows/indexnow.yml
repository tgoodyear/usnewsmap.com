name: indexnow

on:
  schedule:
    - cron: "43 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      contents: write
      id-token: write
    # Serialize acknowledgements, never deployments: a pending notification
    # may replace another notification, but must not cancel a queued rollout.
    concurrency:
      group: indexnow-prod
      cancel-in-progress: false
    env:
      APP: ${{ vars.USNM_API_APP }}
      RG: ${{ vars.USNM_RESOURCE_GROUP }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.USNM_CI_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Notify added, changed and removed URLs
        id: indexnow
        env:
          INDEXNOW_STATE_FILE: ${{ runner.temp }}/indexnow/sitemap.sha256
          INDEXNOW_ENVIRONMENT: prod
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci/indexnow.sh
