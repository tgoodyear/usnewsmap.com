name: boinc-ndlocr-lite
run-name: ${{ github.event_name == 'workflow_dispatch' && format('boinc-ndlocr-lite ({0})', inputs.correlation) || github.event.pull_request.title }}
on:
  workflow_dispatch:
    inputs:
      correlation:
        description: Identifies this run
        required: false
        default: manual
  pull_request:
    paths:
      - .github/workflows/boinc-ndlocr-lite.yml
      - ocr/engines/ndlocr-lite/**
      - ocr/boinc/ndlocr-lite/**
      - scripts/boinc/smoke-ndlocr-worker.py
      - scripts/boinc/smoke-ndlocr.py
      - ocr/ja-ocr/testdata/**
      - ocr/ja-ocr/alto.py
      - ocr/ja-ocr/jaocr.py
      - ocr/ja-ocr/undigitized.py
      - crates/**
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - .dockerignore
      # Files the crates it builds embed (scripts/ci/changes.sh finds them).
      - "scripts/boinc/acceptance_server.py"
      - "fixtures/ocr-gold/bundle-v1.lock.json"
      - "ocr/boinc/qwen/disk-policy.json"
      - "ocr/boinc/qwen/weights.lock"
      - "ocr/boinc/surya/engine.lock"
      - "ocr/boinc/usnm_qwen_benchmark_in"
      - "ocr/engines/engines.toml"
      - "ocr/engines/tesseract/models.lock"
      - "ocr/routing/routes.toml"
      - "!**/*.md"
permissions:
  contents: read
concurrency:
  group: boinc-ndlocr-lite-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  IMAGE: ghcr.io/tgoodyear/usnm-boinc-worker
jobs:
  # Whether this change touches what the image is built from (scripts/ci/changes.sh):
  # a crate counts when the image builds it, not for being under crates/.
  # Not named `changes`: ci.yml's required check has that name.
  inputs:
    name: NDLOCR-Lite image inputs
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.f.outputs.boinc_ndlocr }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: f
        run: scripts/ci/changes.sh
  check:
    needs: inputs
    if: github.event_name == 'pull_request' && needs.inputs.outputs.build == 'true'
    name: NDLOCR-Lite (pinned image and CPU contract smoke)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps: &build-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ocr/engines/ndlocr-lite/Containerfile
          load: true
          tags: ${{ env.IMAGE }}:ndlocr-lite-${{ github.sha }}
          cache-from: type=gha,scope=ndlocr-lite
          cache-to: type=gha,mode=max,scope=ndlocr-lite
      - name: Read Japanese headline with no network and read-only root
        run: python3 scripts/boinc/smoke-ndlocr.py --image "$IMAGE:ndlocr-lite-$GITHUB_SHA" --work "$GITHUB_WORKSPACE/ndlocr-smoke"
      - name: Resolve the engine base identity
        id: engine
        run: echo "image=$(docker image inspect --format '{{.Id}}' "$IMAGE:ndlocr-lite-$GITHUB_SHA")" >> "$GITHUB_OUTPUT"
      - name: Build the BOINC wrapper on the verified local engine
        env:
          ENGINE_IMAGE: ${{ steps.engine.outputs.image }}
        run: |
          docker buildx build --builder default --load -f ocr/boinc/ndlocr-lite/Containerfile \
            --build-arg NDLOCR_IMAGE="$ENGINE_IMAGE" \
            --build-arg NDLOCR_FROM="$IMAGE:ndlocr-lite-$GITHUB_SHA" \
            -t "$IMAGE:ndlocr-lite-worker-$GITHUB_SHA" .
      - name: Read a BOINC unit and validate its results offline
        env:
          ENGINE_IMAGE: ${{ steps.engine.outputs.image }}
        run: python3 scripts/boinc/smoke-ndlocr-worker.py --image "$IMAGE:ndlocr-lite-worker-$GITHUB_SHA" --engine-image "$ENGINE_IMAGE" --work "$GITHUB_WORKSPACE/ndlocr-worker-smoke"
      - name: Publish reviewed engine
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$ACTOR" --password-stdin
          trap 'docker logout ghcr.io' EXIT
          docker push "$IMAGE:ndlocr-lite-$GITHUB_SHA"
          docker push "$IMAGE:ndlocr-lite-worker-$GITHUB_SHA"
          digest=$(docker buildx imagetools inspect "$IMAGE:ndlocr-lite-$GITHUB_SHA" --format '{{json .Manifest}}' | jq -er .digest)
          [[ $digest =~ ^sha256:[0-9a-f]{64}$ ]]
          worker=$(docker buildx imagetools inspect "$IMAGE:ndlocr-lite-worker-$GITHUB_SHA" --format '{{json .Manifest}}' | jq -er .digest)
          echo "NDLOCR-Lite BOINC worker: $IMAGE@$worker (job engine base: ${{ steps.engine.outputs.image }})" >> "$GITHUB_STEP_SUMMARY"
          echo "NDLOCR-Lite engine: $IMAGE@$digest" >> "$GITHUB_STEP_SUMMARY"
  publish:
    name: NDLOCR-Lite (build and publish)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps: *build-steps
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
