name: deploy web

# Builds the SPA and uploads it to the Static Web App (08 §8.1). Needs:
#   secret   AZURE_STATIC_WEB_APPS_API_TOKEN   the site's deployment token
#   variable USNM_API_URL                      the API origin (azd output API_URL)
# Without the token the job only builds, so forks and new clones stay green.

on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/deploy-web.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-web
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build
        working-directory: web
        env:
          VITE_API_BASE: ${{ vars.USNM_API_URL }}
        run: |
          if [ -z "$VITE_API_BASE" ] && [ "$HAS_TOKEN" = true ]; then
            echo "::error::Set the repository variable USNM_API_URL (azd env get-value API_URL)"
            exit 1
          fi
          npm ci
          npm run build
      - if: env.HAS_TOKEN != 'true'
        run: echo "::notice::AZURE_STATIC_WEB_APPS_API_TOKEN is not set; built but not deployed"
      - if: env.HAS_TOKEN == 'true'
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: web/dist
          skip_app_build: true
          skip_api_build: true
