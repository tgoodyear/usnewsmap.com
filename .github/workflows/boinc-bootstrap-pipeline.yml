name: boinc-bootstrap-pipeline
on:
  pull_request:
    paths:
      - scripts/boinc/bootstrap_pipeline.py
      - scripts/boinc/test_bootstrap_pipeline.py
      - .github/workflows/boinc-bootstrap-pipeline.yml
      - .github/workflows/boinc-worker.yml
      - .github/workflows/boinc-qwen.yml
  push:
    branches: [main]
    paths:
      - scripts/boinc/bootstrap_pipeline.py
      - scripts/boinc/test_bootstrap_pipeline.py
      - .github/workflows/boinc-bootstrap-pipeline.yml
      - .github/workflows/boinc-worker.yml
      - .github/workflows/boinc-qwen.yml
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -m unittest -v scripts/boinc/test_bootstrap_pipeline.py
      - run: python3 -m py_compile scripts/boinc/bootstrap_pipeline.py
