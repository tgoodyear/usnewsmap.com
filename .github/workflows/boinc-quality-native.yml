name: boinc-quality-native
on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/boinc-quality-native.yml
      - crates/**
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      # What its tests read and its crates embed (scripts/ci/changes.sh finds the embedded files).
      - ocr/contract/**
      - ocr/boinc/qwen/llama.lock
      - ocr/boinc/qwen/weights.lock
      - "!**/*.md"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # Whether this change touches what the native apps are built from (scripts/ci/changes.sh):
  # a crate counts when the apps build or test it, not for being under crates/. This job
  # also runs on manual dispatch, where the selector says everything.
  # Not named `changes`: ci.yml's required check has that name.
  inputs:
    name: native apps inputs
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.f.outputs.boinc_native }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: f
        run: scripts/ci/changes.sh
  build:
    needs: inputs
    if: needs.inputs.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
            boinc_platform: x86_64-pc-linux-gnu
            ext: ""
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            boinc_platform: aarch64-unknown-linux-gnu
            ext: ""
          - runner: macos-15
            target: aarch64-apple-darwin
            boinc_platform: arm64-apple-darwin
            ext: ""
          - runner: macos-15
            target: x86_64-apple-darwin
            boinc_platform: x86_64-apple-darwin
            ext: ""
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            boinc_platform: windows_x86_64
            ext: ".exe"
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable branch
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install Linux musl tools
        if: startsWith(matrix.runner, 'ubuntu-')
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools
      - name: Ensure Rosetta 2 for x86_64-apple-darwin tests
        if: matrix.target == 'x86_64-apple-darwin'
        shell: bash
        run: |
          if ! /usr/bin/pgrep -q oahd; then
            sudo softwareupdate --install-rosetta --agree-to-license
          fi
      - name: Run target determinism and loopback tests (${{ matrix.target }})
        shell: bash
        run: |
          cargo test --locked --target "${{ matrix.target }}" -p usnm-ocr-contract --no-default-features
          cargo test --locked --target "${{ matrix.target }}" -p usnm-ocr-quality -p usnm-quality-app -p usnm-qwen-app
      - name: Build native BOINC binaries (${{ matrix.target }})
        shell: bash
        run: |
          cargo build --release --locked --target "${{ matrix.target }}" -p usnm-quality-app -p usnm-qwen-app
          out_dir="boinc-native-${{ matrix.boinc_platform }}"
          umask 077
          mkdir "$out_dir"
          cp "target/${{ matrix.target }}/release/usnm_quality${{ matrix.ext }}" \
            "$out_dir/usnm_quality_${{ matrix.boinc_platform }}${{ matrix.ext }}"
          cp "target/${{ matrix.target }}/release/usnm_qwen${{ matrix.ext }}" \
            "$out_dir/usnm_qwen_${{ matrix.boinc_platform }}${{ matrix.ext }}"
          if [[ "${{ matrix.runner }}" == "macos-15" ]]; then
            codesign --force --sign - "$out_dir/usnm_quality_${{ matrix.boinc_platform }}"
            codesign --force --sign - "$out_dir/usnm_qwen_${{ matrix.boinc_platform }}"
          fi
          git rev-parse HEAD > "$out_dir/GIT_COMMIT"
          (
            cd "$out_dir"
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "usnm_quality_${{ matrix.boinc_platform }}${{ matrix.ext }}" \
                "usnm_qwen_${{ matrix.boinc_platform }}${{ matrix.ext }}" > SHA256SUMS
            else
              shasum -a 256 "usnm_quality_${{ matrix.boinc_platform }}${{ matrix.ext }}" \
                "usnm_qwen_${{ matrix.boinc_platform }}${{ matrix.ext }}" > SHA256SUMS
            fi
          )
      - name: Bundle signed app-local Microsoft runtime (Windows)
        if: matrix.boinc_platform == 'windows_x86_64'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:GITHUB_WORKSPACE 'boinc-native-windows_x86_64'
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$vs) { throw 'MSVC installation not found' }
          $redist = Get-ChildItem (Join-Path $vs 'VC\Redist\MSVC') -Directory |
            Where-Object { $_.Name -match '^\d+\.\d+\.\d+$' } |
            Sort-Object { [version]$_.Name } -Descending | Select-Object -First 1
          if (!$redist) { throw 'MSVC redistributable not found' }
          $rows = @()
          $crt = @(Get-ChildItem (Join-Path $redist.FullName 'x64') -Directory -Filter 'Microsoft.VC*.CRT')
          if ($crt.Count -ne 1) { throw 'Missing/ambiguous MSVC x64 CRT directory' }
          $files = @(Get-ChildItem -LiteralPath $crt[0].FullName -Filter '*.dll' -File | Sort-Object Name)
          foreach ($required in @('msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll')) {
            if (@($files | Where-Object Name -eq $required).Count -ne 1) { throw "Missing/duplicate app-local $required" }
          }
          foreach ($file in $files) {
            $name = $file.Name.ToLowerInvariant()
            $signature = Get-AuthenticodeSignature $file.FullName
            if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'O=Microsoft Corporation(?:,|$)') {
              throw "Untrusted Microsoft runtime $name"
            }
            Copy-Item $file.FullName (Join-Path $out $name)
            $hash = (Get-FileHash (Join-Path $out $name) -Algorithm SHA256).Hash.ToLowerInvariant()
            [IO.File]::AppendAllText((Join-Path $out 'SHA256SUMS'), "$hash  $name`n", [Text.Encoding]::ASCII)
            $rows += @{ name=$name; sha256=$hash; signature='Valid Microsoft Corporation' }
          }
          @{ version=$redist.Name; files=$rows } | ConvertTo-Json -Depth 4 |
            Set-Content (Join-Path $out 'VC_REDIST_SOURCE.json') -Encoding utf8
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: boinc-native-${{ matrix.boinc_platform }}
          path: ${{ github.workspace }}/boinc-native-${{ matrix.boinc_platform }}/
          if-no-files-found: error
