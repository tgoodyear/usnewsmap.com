name: check-site-deploy

# check.usnewsmap.com (edge/check) after ci passes on main, which runs the site's tests in the
# edge job. scripts/ci/deploy-check-site.sh deploys only when edge/check differs from what is live.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: Deploy even when the live site was built from the same edge/check tree
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: check-site-prod
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        github.event.workflow_run.event == 'push'))
    runs-on: ubuntu-latest
    environment: prod
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.DEPLOY_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: shellcheck -x -S warning scripts/ci/deploy-check-site.sh
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.USNM_CI_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy check.usnewsmap.com
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force && '--force' || '' }}
        run: scripts/ci/deploy-check-site.sh $FORCE
