name: edge-drift

# Cloudflare settings the Worker deploy does not own (zone tracing, route failure
# mode, the Worker's observability, custom domains) can change in the dashboard
# unnoticed. This compares them with edge/fallback-worker/zone-expected.json and
# fails on any difference. Read-only.
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_run:
    workflows: [edge-worker-deploy]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: edge-drift
  cancel-in-progress: true

jobs:
  check:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: prod
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.USNM_CI_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - run: scripts/ci/check-edge-drift.sh --vault usnmtlskvprodffapzy --token-secret usnm-prod-edge-drift-token
