name: ci
# scripts/bootstrap.sh finds the run it dispatched by its correlation id.
run-name: ${{ inputs.correlation != '' && format('ci ({0})', inputs.correlation) || github.event_name == 'pull_request' && github.event.pull_request.title || github.event_name == 'push' && github.event.head_commit.message || 'ci' }}

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      correlation:
        description: "Identifies this run (set by scripts/bootstrap.sh)"
        required: false
        default: ""

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # What a change touches (scripts/ci/changes.sh): jobs it can't affect are
  # skipped, so an infra-only fix doesn't wait on Rust, web and image builds.
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.f.outputs.rust }}
      web: ${{ steps.f.outputs.web }}
      image: ${{ steps.f.outputs.image }}
      fixtures: ${{ steps.f.outputs.fixtures }}
      ops: ${{ steps.f.outputs.ops }}
      code: ${{ steps.f.outputs.code }}
      provision: ${{ steps.f.outputs.provision }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: f
        run: scripts/ci/changes.sh
        env:
          BEFORE_SHA: ${{ github.event.before }}

  rust:
    name: rust (fmt, clippy, test)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable branch
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  quickwit:
    name: quickwit (parity, ingest release)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    env:
      QUICKWIT_VERSION: v0.9.1
      QUICKWIT_SHA256: ad67c2e2aab79e810906dfebec694aa50b07a001aaa75ce3ba7bc32d079f8185
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable branch
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install Quickwit
        run: scripts/ci/install-quickwit.sh
      - name: Load fixtures, serve them from a read-only searcher
        run: echo "QUICKWIT_URL=$(scripts/quickwit-fixtures.sh "$RUNNER_TEMP/qw")" >> "$GITHUB_ENV"
      - run: cargo test -p usnm-search --test quickwit_parity --locked
      # The pipeline runs its own writer node (QUICKWIT_BIN) and releases into it,
      # with the environment the official Quickwit image sets (the ingest image
      # is built on it): the writer must not pick these up.
      - run: cargo test -p usnm-ingest --test pipeline --locked
        env:
          QW_LISTEN_ADDRESS: 0.0.0.0
          QW_DATA_DIR: /quickwit/qwdata
          QW_CONFIG: /quickwit/config/quickwit.yaml
      - if: failure()
        run: tail -n 200 "$RUNNER_TEMP"/qw/*.log

  fixtures:
    name: fixtures are reproducible
    needs: changes
    if: needs.changes.outputs.fixtures == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 fixtures/generate.py
      - run: git diff --exit-code fixtures/data

  ops:
    name: ops data (version snapshots)
    needs: changes
    if: needs.changes.outputs.ops == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the checker (hash-pinned)
        run: |
          python3 -m venv "$RUNNER_TEMP/ops"
          "$RUNNER_TEMP/ops/bin/pip" install --require-hashes --no-deps -r scripts/ci/requirements-ops.txt
      - name: Every snapshot matches ops/version-snapshots/schema.json
        run: '"$RUNNER_TEMP/ops/bin/python" scripts/check-version-snapshots.py'
      - name: The checker's tests pass
        run: '"$RUNNER_TEMP/ops/bin/python" -m unittest -v scripts/test_check_version_snapshots.py'

  image:
    name: container image builds
    needs: changes
    if: needs.changes.outputs.image == 'true'
    runs-on: ubuntu-latest
    # Build and smoke-test the images. Publishing happens per environment in
    # `publish`, from the same build cache.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Docker Hub base images come through Google's mirror of it (08 §8.6):
      # a runner's anonymous Docker Hub pulls hit its rate limit.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          tags: usnewsmap-api:check
          load: true
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
      - name: The API image serves the API and the site
        run: scripts/ci/check-api-image.sh usnewsmap-api:check
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.ingest
          tags: usnm-ingest-check
          load: true
          cache-from: type=gha,scope=ingest
          cache-to: type=gha,scope=ingest,mode=max
      - name: The ingest image runs
        run: scripts/ci/check-ingest-image.sh usnm-ingest-check
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.ja-ocr
          tags: usnm-ja-ocr-check
          load: true
          cache-from: type=gha,scope=ja-ocr
          cache-to: type=gha,scope=ja-ocr,mode=max
      - name: The Japanese OCR job's tests pass
        run: |
          docker run --rm -e PYTHONDONTWRITEBYTECODE=1 -v "$PWD/ja-ocr:/t:ro" -w /t --entrypoint python3 usnm-ja-ocr-check \
            -m unittest discover -v -p 'test_*.py'
      - name: The Japanese OCR image reads Japanese
        run: scripts/ci/check-ja-ocr-image.sh usnm-ja-ocr-check

  infra:
    name: infra (bicep lint, build)
    # Also the shared-key scan, so every change but documentation runs it.
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    env:
      BICEP_VERSION: v0.47.16
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Bicep
        run: scripts/ci/install-bicep.sh
      - name: Lint (any warning fails)
        run: scripts/ci/lint-bicep.sh
      - name: No shared-key authentication (ADR-0009)
        run: scripts/ci/no-shared-keys.sh
      - run: bicep build infra/main.bicep --stdout > /dev/null
      - run: bicep build infra/guardrails.bicep --stdout > /dev/null
      # The parameters bootstrap deploys the stack with (settings from the
      # environment; unset ones take their defaults).
      - run: bicep build-params infra/main.bicepparam --stdout > /dev/null
        env:
          AZURE_ENV_NAME: ci

  web:
    name: web (lint, typecheck, test, build)
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  web-e2e:
    name: web end-to-end (Playwright + axe)
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable branch
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      # The API's build overlaps the site's; start-api-fixtures.sh runs cargo
      # build again, which waits for this one and fails the same way if it did.
      - name: Build the API in the background
        run: cargo build --release --locked -p usnm-api > cargo-build.log 2>&1 &
      # Chromium (~300 MB) is the same for a given Playwright version, so it is
      # downloaded only when that changes. Its system packages still install
      # each run (web-e2e.sh), alongside the site's build.
      - name: Playwright version
        id: playwright
        run: echo "version=$(node -p "require('./web/package-lock.json').packages['node_modules/playwright-core'].version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Build the site
        run: scripts/ci/web-e2e.sh build
      - name: Start the API on the synthetic fixtures
        run: scripts/ci/start-api-fixtures.sh
      - name: Run the end-to-end suite
        run: scripts/ci/web-e2e.sh test
        env:
          CI: "1"
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          retention-days: 7
          path: |
            web/playwright-report
            web/test-results
            api.log
            cargo-build.log
            playwright-install.log

  provision-reminder:
    name: stack change needs a provision
    # A deploy rolls the API image and applies infra/quickwit/searcher.yaml
    # (scripts/ci/roll-api.sh); CI's identity can't deploy the rest of the
    # stack (08 §8.2). When a merge to main changes it, say so on the run,
    # so the change isn't taken for deployed.
    needs: [changes]
    if: >-
      needs.changes.outputs.provision == 'true'
      && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Ask for a provision
        env:
          ENVS: ${{ vars.USNM_DEPLOY_ENVIRONMENTS || '[]' }}
        run: |
          envs=$(jq -r '.[]' <<< "$ENVS")
          msg="This merge changes the Azure stack (infra/), which a deploy doesn't apply. Run scripts/provision.sh for each environment: ${envs//$'\n'/, }."
          echo "::warning title=Stack change not deployed::$msg"
          {
            echo "### Stack change not deployed"
            echo
            echo "This merge changes \`infra/\` beyond what a deploy applies. From an up-to-date \`main\`, run:"
            echo
            echo '```sh'
            for e in $envs; do echo "scripts/provision.sh $e"; done
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: publish and roll out (${{ matrix.environment }})
    # After every check passes on main: push the images to each deployed
    # environment's private registry (08 §8.6) and roll its API onto this
    # commit. Environments are listed in the repository variable
    # USNM_DEPLOY_ENVIRONMENTS (a JSON array, e.g. ["prod"]); each GitHub
    # Environment holds its own variables, written by scripts/bootstrap.sh.
    needs: [changes, rust, quickwit, fixtures, ops, image, infra, web, web-e2e]
    # Only when the images changed, and every check that ran passed: a job
    # skipped as irrelevant must not block the deploy, and a failed one must.
    if: >-
      always() && needs.changes.outputs.image == 'true'
      && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
      && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
      && vars.USNM_DEPLOY_ENVIRONMENTS != '' && vars.USNM_DEPLOY_ENVIRONMENTS != '[]'
    strategy:
      fail-fast: false
      matrix:
        environment: ${{ fromJSON(vars.USNM_DEPLOY_ENVIRONMENTS || '[]') }}
    environment: ${{ matrix.environment }}
    runs-on: ubuntu-latest
    # id-token: the Azure sign-in below uses OIDC, so no secret is stored.
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: deploy-${{ matrix.environment }}
      cancel-in-progress: false
    env:
      ACR: ${{ vars.USNM_ACR_LOGIN_SERVER }}
      APP: ${{ vars.USNM_API_APP }}
      RG: ${{ vars.USNM_RESOURCE_GROUP }}
      QUICKWIT: quickwit/quickwit@sha256:3e0f079eb57dd5563f36a457e9a7a2963ff882316d6c77e3180ac3c59767a68f
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Only the commit main points at publishes: a slower run for an older
      # commit must not replace newer images.
      - name: Is this still the head of main?
        id: head
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci/head-of-main.sh
      - if: steps.head.outputs.current == 'true'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.USNM_CI_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - if: steps.head.outputs.current == 'true'
        run: az acr login --name "${ACR%%.*}"
      # As in `image`: Docker Hub base images through mirror.gcr.io.
      - if: steps.head.outputs.current == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
      - if: steps.head.outputs.current == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          cache-from: type=gha,scope=api
          tags: |
            ${{ env.ACR }}/usnewsmap-api:main
            ${{ env.ACR }}/usnewsmap-api:${{ github.sha }}
      - if: steps.head.outputs.current == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.ingest
          push: true
          cache-from: type=gha,scope=ingest
          build-args: USNM_GIT_SHA=${{ github.sha }}
          tags: |
            ${{ env.ACR }}/usnewsmap-ingest:main
            ${{ env.ACR }}/usnewsmap-ingest:${{ github.sha }}
      - if: steps.head.outputs.current == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.ja-ocr
          push: true
          cache-from: type=gha,scope=ja-ocr
          tags: |
            ${{ env.ACR }}/usnewsmap-ja-ocr:main
            ${{ env.ACR }}/usnewsmap-ja-ocr:${{ github.sha }}
      - name: Copy the pinned Quickwit image into the registry, digest unchanged, unless it is there
        if: steps.head.outputs.current == 'true'
        run: scripts/ci/copy-quickwit.sh
      # The API app exists once the environment pulls from its registry
      # (bootstrap's second provision); until then only the images publish.
      - name: Roll the API onto this commit's image
        if: steps.head.outputs.current == 'true' && env.APP != ''
        env:
          IMAGE: ${{ env.ACR }}/usnewsmap-api:${{ github.sha }}
        run: scripts/ci/roll-api.sh
      # Tell search engines about the sitemap's pages once the new revision
      # serves them. The script only warns, so a problem never fails the deploy.
      - name: Submit the sitemap to IndexNow
        if: steps.head.outputs.current == 'true' && env.APP != ''
        continue-on-error: true
        run: scripts/ci/indexnow.sh
