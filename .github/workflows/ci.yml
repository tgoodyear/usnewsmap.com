name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  quickwit:
    name: quickwit (parity, ingest release)
    runs-on: ubuntu-latest
    env:
      QUICKWIT_VERSION: v0.9.1
      QUICKWIT_SHA256: ad67c2e2aab79e810906dfebec694aa50b07a001aaa75ce3ba7bc32d079f8185
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Quickwit
        run: |
          curl -fsSL -o "$RUNNER_TEMP/qw.tgz" \
            "https://github.com/quickwit-oss/quickwit/releases/download/${QUICKWIT_VERSION}/quickwit-${QUICKWIT_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          echo "${QUICKWIT_SHA256}  $RUNNER_TEMP/qw.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/qw.tgz" -C "$RUNNER_TEMP"
          echo "QUICKWIT_BIN=$RUNNER_TEMP/quickwit-${QUICKWIT_VERSION}/quickwit" >> "$GITHUB_ENV"
      - name: Load fixtures, serve them from a read-only searcher
        run: echo "QUICKWIT_URL=$(scripts/quickwit-fixtures.sh "$RUNNER_TEMP/qw")" >> "$GITHUB_ENV"
      - run: cargo test -p usnm-search --test quickwit_parity --locked
      # The pipeline runs its own writer node (QUICKWIT_BIN) and releases into it.
      - run: cargo test -p usnm-ingest --test pipeline --locked
      - if: failure()
        run: tail -n 200 "$RUNNER_TEMP"/qw/*.log

  fixtures:
    name: fixtures are reproducible
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: python3 fixtures/generate.py
      - run: git diff --exit-code fixtures/data

  image:
    name: container image builds
    runs-on: ubuntu-latest
    # Build and smoke-test both images. Publishing happens per environment in
    # `publish`, from the same build cache.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          tags: usnewsmap-api:check
          outputs: type=cacheonly
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.ingest
          tags: usnm-ingest-check
          load: true
          cache-from: type=gha,scope=ingest
          cache-to: type=gha,scope=ingest,mode=max
      - name: The ingest image runs
        run: |
          docker run --rm usnm-ingest-check --version
          docker run --rm --entrypoint quickwit usnm-ingest-check --version

  infra:
    name: infra (bicep lint, build)
    runs-on: ubuntu-latest
    env:
      BICEP_VERSION: v0.47.16
    steps:
      - uses: actions/checkout@v5
      - name: Install Bicep
        run: |
          # The runner ships a root-owned bicep; install the pinned one alongside.
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL -o "$RUNNER_TEMP/bin/bicep" \
            "https://github.com/Azure/bicep/releases/download/${BICEP_VERSION}/bicep-linux-x64"
          chmod +x "$RUNNER_TEMP/bin/bicep"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/bicep" --version | grep -F "${BICEP_VERSION#v}"
      - name: Lint (any warning fails)
        run: |
          out=$(for f in infra/main.bicep infra/modules/*.bicep; do bicep lint "$f" 2>&1; done)
          echo "$out"
          test -z "$out"
      - run: bicep build infra/main.bicep --stdout > /dev/null

  web:
    name: web (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  web-e2e:
    name: web end-to-end (Playwright + axe)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Start the API on the synthetic fixtures
        run: |
          cargo build --release --locked -p usnm-api
          USNM_BIND=127.0.0.1:8080 USNM_RATE_PER_MIN=0 ./target/release/usnm-api > api.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8080/readyz && break; sleep 1; done
      - working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium
          # Default basemap style: the tests intercept it and serve a local
          # style, so no third-party tile service is needed.
          npm run build
          npm run e2e
        env:
          CI: "1"
      - if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
            api.log

  publish:
    name: publish and roll out (${{ matrix.environment }})
    # After every check passes on main: push the images to each deployed
    # environment's private registry (08 §8.6) and roll its API onto this
    # commit. Environments are listed in the repository variable
    # USNM_DEPLOY_ENVIRONMENTS (a JSON array, e.g. ["prod"]); each GitHub
    # Environment holds its own variables, written by scripts/bootstrap.sh.
    needs: [rust, quickwit, fixtures, image, infra, web, web-e2e]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.USNM_DEPLOY_ENVIRONMENTS != '' && vars.USNM_DEPLOY_ENVIRONMENTS != '[]'
    strategy:
      fail-fast: false
      matrix:
        environment: ${{ fromJSON(vars.USNM_DEPLOY_ENVIRONMENTS || '[]') }}
    environment: ${{ matrix.environment }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: deploy-${{ matrix.environment }}
      cancel-in-progress: false
    env:
      ACR: ${{ vars.USNM_ACR_LOGIN_SERVER }}
      APP: ${{ vars.USNM_API_APP }}
      RG: ${{ vars.USNM_RESOURCE_GROUP }}
      QUICKWIT: quickwit/quickwit@sha256:3e0f079eb57dd5563f36a457e9a7a2963ff882316d6c77e3180ac3c59767a68f
    steps:
      # Runs finish out of order: a slower run for an older commit must not
      # replace newer images. Only the commit main points at publishes.
      - name: Is this still the head of main?
        id: head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [ "$head" = "$GITHUB_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::main is now at $head; not publishing $GITHUB_SHA"
          fi
      - if: steps.head.outputs.current == 'true'
        uses: actions/checkout@v5
      - if: steps.head.outputs.current == 'true'
        uses: azure/login@v3
        with:
          client-id: ${{ vars.USNM_CI_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - if: steps.head.outputs.current == 'true'
        run: az acr login --name "${ACR%%.*}"
      - if: steps.head.outputs.current == 'true'
        uses: docker/setup-buildx-action@v4
      - if: steps.head.outputs.current == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          cache-from: type=gha,scope=api
          tags: |
            ${{ env.ACR }}/usnewsmap-api:main
            ${{ env.ACR }}/usnewsmap-api:${{ github.sha }}
      - if: steps.head.outputs.current == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.ingest
          push: true
          cache-from: type=gha,scope=ingest
          tags: |
            ${{ env.ACR }}/usnewsmap-ingest:main
            ${{ env.ACR }}/usnewsmap-ingest:${{ github.sha }}
      - name: Copy the pinned Quickwit image into the registry, digest unchanged
        if: steps.head.outputs.current == 'true'
        run: |
          command -v skopeo > /dev/null || { sudo apt-get update -q && sudo apt-get install -y -q skopeo; }
          token=$(az acr login --name "${ACR%%.*}" --expose-token --query accessToken -o tsv)
          skopeo login "$ACR" -u 00000000-0000-0000-0000-000000000000 -p "$token"
          skopeo copy --all --preserve-digests "docker://docker.io/${QUICKWIT}" "docker://${ACR}/quickwit/quickwit:v0.9.1"
          want="${QUICKWIT#*@}"
          got="sha256:$(skopeo inspect --raw "docker://${ACR}/quickwit/quickwit:v0.9.1" | sha256sum | cut -d' ' -f1)"
          test "$got" = "$want" || { echo "::error::copied Quickwit digest $got != $want"; exit 1; }
      # The API app exists once the environment pulls from its registry
      # (bootstrap's second provision); until then only the images publish.
      - name: Point the API at this commit's image
        if: steps.head.outputs.current == 'true' && env.APP != ''
        run: |
          az config set extension.use_dynamic_install=yes_without_prompt
          az containerapp update -n "$APP" -g "$RG" --container-name api \
            --image "$ACR/usnewsmap-api:$GITHUB_SHA" -o none
      - name: Wait for the new revision to serve
        if: steps.head.outputs.current == 'true' && env.APP != ''
        run: |
          latest="" ready=""
          for _ in $(seq 60); do
            revs=$(az containerapp show -n "$APP" -g "$RG" \
              --query "[properties.latestRevisionName, properties.latestReadyRevisionName]" -o tsv)
            latest=$(sed -n 1p <<< "$revs")
            ready=$(sed -n 2p <<< "$revs")
            if [ -n "$latest" ] && [ "$latest" = "$ready" ]; then
              echo "revision $latest is ready"
              break
            fi
            sleep 10
          done
          test "$latest" = "$ready" || { echo "::error::revision $latest did not become ready"; exit 1; }
          # Always check the app's own address; no variable can skip this.
          fqdn=$(az containerapp show -n "$APP" -g "$RG" --query properties.configuration.ingress.fqdn -o tsv)
          test -n "$fqdn" || { echo "::error::$APP has no ingress FQDN"; exit 1; }
          curl -fsS --retry 10 --retry-delay 6 --retry-all-errors "https://$fqdn/readyz"
