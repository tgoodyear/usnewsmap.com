name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  fixtures:
    name: fixtures are reproducible
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 fixtures/generate.py
      - run: git diff --exit-code fixtures/data

  image:
    name: container image builds
    runs-on: ubuntu-latest
    # Pushes to GHCR only for commits on main (08 §8.6); PRs just build.
    permissions:
      contents: read
      packages: write
    env:
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4
      - if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ env.PUBLISH == 'true' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/usnewsmap-api:main
            ghcr.io/${{ github.repository_owner }}/usnewsmap-api:${{ github.sha }}

  infra:
    name: infra (bicep lint, build)
    runs-on: ubuntu-latest
    env:
      BICEP_VERSION: v0.47.16
    steps:
      - uses: actions/checkout@v4
      - name: Install Bicep
        run: |
          # The runner ships a root-owned bicep; install the pinned one alongside.
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL -o "$RUNNER_TEMP/bin/bicep" \
            "https://github.com/Azure/bicep/releases/download/${BICEP_VERSION}/bicep-linux-x64"
          chmod +x "$RUNNER_TEMP/bin/bicep"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/bicep" --version | grep -F "${BICEP_VERSION#v}"
      - name: Lint (any warning fails)
        run: |
          out=$(for f in infra/main.bicep infra/modules/*.bicep; do bicep lint "$f" 2>&1; done)
          echo "$out"
          test -z "$out"
      - run: bicep build infra/main.bicep --stdout > /dev/null

  web:
    name: web (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  web-e2e:
    name: web end-to-end (Playwright + axe)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Start the API on the synthetic fixtures
        run: |
          cargo build --release --locked -p usnm-api
          USNM_BIND=127.0.0.1:8080 USNM_RATE_PER_MIN=0 ./target/release/usnm-api > api.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8080/readyz && break; sleep 1; done
      - working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium
          # Default basemap style: the tests intercept it and serve a local
          # style, so no third-party tile service is needed.
          npm run build
          npm run e2e
        env:
          CI: "1"
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
            api.log
