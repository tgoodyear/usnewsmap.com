name: ci
# scripts/azure/bootstrap.sh finds the run it dispatched by its correlation id.
run-name: ${{ inputs.correlation != '' && format('ci ({0})', inputs.correlation) || github.event_name == 'pull_request' && github.event.pull_request.title || github.event_name == 'push' && github.event.head_commit.message || 'ci' }}

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      correlation:
        description: "Identifies this run (set by scripts/azure/bootstrap.sh)"
        required: false
        default: ""
      scope:
        description: "full preserves bootstrap/deploy behavior; ocr-worker publishes only the checked, attested OCR worker release on current main"
        type: choice
        options: [full, ocr-worker]
        default: full

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # What each job checks, when it runs, how long it takes and which ones a pull request
  # needs green: docs/development.md, "What CI runs".
  #
  # What a change touches (scripts/ci/changes.sh): jobs it can't affect are
  # skipped, so an infra-only fix doesn't wait on Rust, web and image builds.
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.f.outputs.rust }}
      quickwit: ${{ steps.f.outputs.quickwit }}
      web: ${{ steps.f.outputs.web }}
      image: ${{ steps.f.outputs.image }}
      e2e: ${{ steps.f.outputs.e2e }}
      fixtures: ${{ steps.f.outputs.fixtures }}
      ops: ${{ steps.f.outputs.ops }}
      code: ${{ steps.f.outputs.code }}
      provision: ${{ steps.f.outputs.provision }}
      markdown: ${{ steps.f.outputs.markdown }}
      ocr_worker: ${{ steps.f.outputs.ocr_worker }}
      ocr_dash: ${{ steps.f.outputs.ocr_dash }}
      infra: ${{ steps.f.outputs.infra }}
      page_language: ${{ steps.f.outputs.page_language }}
      contrib: ${{ steps.f.outputs.contrib }}
      ocr_gold: ${{ steps.f.outputs.ocr_gold }}
      boinc_pages: ${{ steps.f.outputs.boinc_pages }}
      edge: ${{ steps.f.outputs.edge }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: f
        run: scripts/ci/changes.sh
        env:
          BEFORE_SHA: ${{ github.event.before }}
          CI_SCOPE: ${{ inputs.scope }}

  rust:
    name: rust (fmt, clippy, test)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Workspace tests
        shell: bash
        run: cargo test --workspace --locked 2>&1 | tee "$RUNNER_TEMP/rust-tests.log"
      - name: Test binary timings
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/rust-tests.log" ]; then
            python3 scripts/ci/rust-test-times.py --log "$RUNNER_TEMP/rust-tests.log" >> "$GITHUB_STEP_SUMMARY"
          fi
      # The stored ALTO profile (13 §13.8.2): the writer's golden pages
      # against LoC's ALTO 3.1 schema.
      - name: Stored ALTO against alto-3-1.xsd
        run: |
          command -v xmllint >/dev/null || { sudo apt-get update -q && sudo apt-get install -y -q libxml2-utils; }
          xmllint --noout --schema crates/usnm-alto/xsd/alto-3-1.xsd crates/usnm-alto/tests/golden/*.xml
      # The damage metric and its word lists are behind a feature nothing in
      # the workspace turns on yet (12 §12.5 Step 4).
      - run: cargo clippy -p usnm-core --all-targets --features damage --locked -- -D warnings
      - run: cargo test -p usnm-core --features damage --locked

  # The OCR work queues in PostgreSQL + pgmq (#967): usnm-store's PgmqQueue against a real
  # database set up like the queue container (TLS 1.3, client certificates, setup.sql, the
  # role checks in test_roles.sql). USNM_TEST_PGMQ_REQUIRED fails the test if the fixture is missing.
  queue:
    name: queue (PostgreSQL + pgmq, live)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - name: Start the queue fixture
        run: |
          location=$(scripts/onprem/queue/ci-fixture.sh --workdir "$RUNNER_TEMP/queue")
          echo "USNM_TEST_PGMQ=$location" >> "$GITHUB_ENV"
      - name: usnm-store's live queue test
        env:
          USNM_TEST_PGMQ_REQUIRED: '1'
        run: cargo test -p usnm-store --locked pgmq
      # The OCR-quality results database (#962) on the same image: schema, roles, the
      # loader's upserts and the ranking queries.
      - name: usnm_quality schema and roles
        run: scripts/onprem/quality/ci-check.sh

  # The hosting for the stock BOINC server (ADR-0019): shell scripts, XML
  # templates and Bicep. No Rust: the client and bridge are crates/usnm-boinc, whose changes also run this job.
  contrib-compute:
    name: contrib-compute (xml, shell, bicep)
    needs: changes
    if: needs.changes.outputs.contrib == 'true'
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mirror.gcr.io/library/mysql:8.4@sha256:24989179f58856db763f418010c1169fecc944e3ec1ea7e921572d83eb070f70
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
        ports:
          - 127.0.0.1:3307:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=5s --health-timeout=5s --health-retries=30
    defaults:
      run:
        working-directory: contrib-compute
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Project templates are well-formed XML
        run: |
          # config.xml.template carries @NAME@ placeholders, which are valid XML text.
          for f in boinc/project.xml boinc/plan_class_spec.xml boinc/config.xml.template; do
            python3 -c 'import sys, xml.dom.minidom as m; m.parse(sys.argv[1])' "$f"
          done
      - name: project.xml has no quotes or backslashes in its text
        # xadd (BoincApp::insert) puts user_friendly_name into SQL unescaped; an apostrophe
        # failed register-apps on prod (#469). Checks parsed text, so &apos; / &#39; count too.
        run: |
          python3 - boinc/project.xml <<'PY'
          import sys, xml.etree.ElementTree as ET
          bad = [(e.tag, e.text) for e in ET.parse(sys.argv[1]).iter() if e.text and any(c in e.text for c in "'\\\"")]
          for tag, text in bad:
              print(f"error: <{tag}> in boinc/project.xml has a quote or backslash, which xadd inserts into SQL unescaped: {text!r}")
          sys.exit(1 if bad else 0)
          PY
      - run: shellcheck -x -S warning images/server/*.sh images/appver/*.sh images/bridge/*.sh
      - name: The gold-bundle step's tests pass
        run: python3 -m unittest -v images/bridge/test_gold_bundle.py
      - name: The server daemon configuration tests pass
        run: python3 -m unittest -v boinc/test_config.py
      - name: The daemon runner keeps bin/start's pid directory off the share
        run: python3 -m unittest -v images/server/test_boinc_daemons.py
      - name: The Arc token path sends its key only to a loopback endpoint
        run: python3 -m unittest -v images/server/test_lib_kv_token.py
      - name: Key Vault reads retry transient failures (#958)
        run: python3 -m unittest -v images/server/test_lib_kv_retry.py
      - name: The server images take Debian's security updates (#969)
        run: python3 -m unittest -v images/server/test_security_updates.py
      - name: The work-volume export and workbook queries pass
        run: python3 -m unittest -v images/server/test_work_volume.py
        env:
          USNM_WORK_VOLUME_MYSQL_PORT: '3307'
      - name: The bounded volunteer batch inventory tests pass
        working-directory: .
        run: python3 -m unittest -v contrib-compute/images/server/test_batch_inventory.py
        env:
          USNM_WORK_VOLUME_MYSQL_PORT: '3307'
      # The app version's signature checks and the installer (no server needed).
      - name: Install scheduler gate test headers
        run: sudo apt-get update -q && sudo apt-get install -y -q nlohmann-json3-dev
      # The other scripts/boinc tests run in the infra job (scripts/ci/run-unit-tests.py), which
      # every contrib change also triggers. The gold-routing test is left out of that run: it
      # compiles C++ against the header installed above.
      - name: The app version checks' tests pass
        working-directory: .
        run: |
          python3 -m unittest -v scripts/boinc/test_patch_server_gold_routing.py
          python3 -m unittest -v contrib-compute/images/appver/test_check_appver.py
          python3 -m unittest -v contrib-compute/images/appver/test_publish_appver.py
      - name: Install Bicep
        working-directory: .
        run: scripts/ci/install-bicep.sh
      - name: Bicep builds
        working-directory: .
        run: scripts/ci/build-bicep.sh

  # The BOINC project's web pages: a PHP syntax check, no image build.
  boinc-pages:
    name: boinc pages (php lint)
    needs: changes
    if: needs.changes.outputs.boinc_pages == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: find contrib-compute/boinc/html -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: python3 -m unittest -v contrib-compute/images/server/test_work_summary.py

  boinc-db-tls:
    name: BOINC actual database TLS (private disposable fixture)
    needs: changes
    if: needs.changes.outputs.contrib == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -m unittest -v scripts/boinc/test_db_tls_fixture.py
      - run: shellcheck -x -S warning scripts/boinc/check-db-tls.sh
      - run: scripts/boinc/check-db-tls.sh

  boinc-mysql84-db-tls:
    name: BOINC actual database TLS (private MySQL 8.4)
    needs: changes
    if: needs.changes.outputs.contrib == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -m unittest -v scripts/boinc/test_db_tls_fixture.py scripts/boinc/test_mysql84_db_tls.py
      - run: shellcheck -x -S warning scripts/boinc/check-mysql84-db-tls.sh
      - run: scripts/boinc/check-mysql84-db-tls.sh

  boinc-node-client:
    name: BOINC stable node client (EL9 build, no host installation)
    needs: changes
    if: needs.changes.outputs.contrib == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the actual pinned client away from production
        run: |
          python3 -m unittest -v scripts/boinc/test_node_client.py scripts/boinc/test_observe_node.py
          shellcheck -x -S warning scripts/boinc/build-node-client-container.sh
          scripts/boinc/build-node-client-container.sh --out "$PWD/target/boinc-node-client"
      - name: Archive and re-extract the retained executable bundle
        run: |
          tar -C target -czf target/boinc-node-client.tar.gz boinc-node-client
          mkdir target/client-archive-check
          tar -C target/client-archive-check -xzf target/boinc-node-client.tar.gz
          cd target/client-archive-check/boinc-node-client
          sha256sum -c SHA256SUMS
          test -x install/bin/boinc
          test -x install/bin/boinccmd
          test "$(cat runtime-memory-max)" = 1610612736
          test "$(cat runtime-cpu-max)" = "100000 100000"
      - name: The exported client loads on EL10 without a host install
        run: |
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges \
            -v "$PWD/target/client-archive-check/boinc-node-client/install:/client:ro" \
            mirror.gcr.io/library/almalinux:10@sha256:838c2fafefb1a8a0d7f8cdbc3b0551c2a2b1eb0cd87aad6d62aecadb18311f1b \
            /bin/sh -ec 'ldd /client/bin/boinc; ldd /client/bin/boinccmd; /client/bin/boinc --version; /client/bin/boinccmd --version'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: boinc-node-client-el9
          retention-days: 7
          path: target/boinc-node-client.tar.gz

  # The BOINC server image and the bridge job image (contrib-compute/images). Built, smoke-tested
  # and not pushed: where they are published is the maintainer's step (docs/images.md).
  contrib-images:
    name: contrib-compute (server and bridge images)
    needs: changes
    if: needs.changes.outputs.contrib == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Every base image in these Containerfiles is pinned by digest.
      - name: Base images are pinned by digest
        run: |
          bad=$(grep -nE '^(FROM|ARG BASE=)' contrib-compute/images/*/Containerfile | grep -vE '@sha256:[0-9a-f]{64}|FROM \$\{|FROM scratch$' || true)
          [ -z "$bad" ] || { echo "::error::base image without a digest:"; echo "$bad"; exit 1; }
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # BuildKit follows the dependency graph: base/server and Rust bridge-bin
      # can build concurrently, without shipping large images between runners.
      - uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7
        with:
          source: .
          files: contrib-compute/images/ci.hcl
          targets: ci
        env:
          CI_CACHE_WRITE: ${{ github.ref == 'refs/heads/main' && 'true' || 'false' }}
      - name: The server image has the stock tools and daemons
        run: scripts/ci/check-boinc-server-image.sh --image usnm-boinc-server:check
      - name: Record the image id
        run: docker image inspect usnm-boinc-server:check --format 'server image id {{.Id}}'
      - name: The actual server installs and restarts a full private TLS-required project
        timeout-minutes: 15
        run: |
          python3 -m unittest -v scripts/boinc/test_full_db_tls.py contrib-compute/images/server/test_refresh_project_code.py
          shellcheck -x -S warning scripts/boinc/check-full-db-tls.sh
          scripts/boinc/check-full-db-tls.sh --local-server-image usnm-boinc-server:check
      # crates/usnm-boinc arrives with PR #441; until then there is no bridge binary to build.
      - name: The bridge image builds
        if: hashFiles('crates/usnm-boinc/Cargo.toml') != ''
        run: |
          docker run --rm --entrypoint usnm-boinc usnm-boinc-bridge:check --help > /dev/null
          # The gold-bundle step's tools (docs/boinc/gold-check.md#build-the-gold-bundle).
          docker run --rm --entrypoint sh usnm-boinc-bridge:check -c 'usnm-ocr-survey --help > /dev/null &&
            bsdtar --version && python3 -c "import PIL; assert PIL.__version__ == \"13.0.0\", PIL.__version__" &&
            python3 /usr/local/lib/usnm-boinc/gold/scripts/ocr-survey/gold.py --help > /dev/null &&
            python3 /usr/local/lib/usnm-boinc/gold/scripts/ocr-survey/transcription.py --help > /dev/null &&
            test -s /usr/local/lib/usnm-boinc/gold/selections/transcription-audited-20261015.json &&
            cd /usr/local/lib/usnm-boinc/gold/scripts/ocr-survey && python3 -c "import gold, crops, altotext, locfetch, transcription" &&
            test -f /usr/local/lib/usnm-boinc/gold-bundle.sh && test -s /usr/local/lib/usnm-boinc/gold/bundle-v1.lock.json &&
            test -s /usr/local/lib/usnm-boinc/gold/bundle-v2.lock.json'

  # The page-language detector on text of known language (05 §5.5.8): behind
  # #[ignore], so the rust job doesn't run it.
  page-language-samples:
    name: page language samples
    needs: changes
    if: needs.changes.outputs.page_language == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - run: cargo test -p usnm-core --test page_language_samples --locked -- --ignored

  # The fallback Worker in front of the tunnel (ADR-0027, #1098): its node:test tests, which
  # run offline on Node's own test runner with no dependencies, and shellcheck of its deploy
  # script. No package.json and no npm cache, so it does not use setup-node-web.
  edge:
    name: edge (fallback worker tests)
    needs: changes
    if: needs.changes.outputs.edge == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: node --test edge/fallback-worker/*.test.mjs
      - run: shellcheck -x -S warning edge/fallback-worker/deploy.sh

  quickwit-tests:
    name: quickwit (${{ matrix.suite }})
    needs: changes
    if: needs.changes.outputs.quickwit == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: [parity, pipeline]
    # Upstream's v0.9.1 release binary, not our build (ADR-0013): our one
    # commit changes only the Azure Blob client, which these tests don't
    # reach (they index and search local files), and building ours takes an
    # hour with no binary published.
    env:
      QUICKWIT_VERSION: v0.9.1
      QUICKWIT_SHA256: ad67c2e2aab79e810906dfebec694aa50b07a001aaa75ce3ba7bc32d079f8185
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: ${{ matrix.suite }}
      - name: Install Quickwit
        run: scripts/ci/install-quickwit.sh
      - name: Load fixtures, serve them from a read-only searcher
        if: matrix.suite == 'parity'
        run: echo "QUICKWIT_URL=$(scripts/dev/quickwit-fixtures.sh --workdir "$RUNNER_TEMP/qw")" >> "$GITHUB_ENV"
      - name: Search parity
        if: matrix.suite == 'parity'
        shell: bash
        run: cargo test -p usnm-search --test quickwit_parity --locked 2>&1 | tee "$RUNNER_TEMP/quickwit-tests.log"
      # The pipeline runs its own writer node (QUICKWIT_BIN) and releases into it,
      # with the environment the official Quickwit image sets (the ingest image
      # is built on it): the writer must not pick these up.
      - name: Ingest pipeline
        if: matrix.suite == 'pipeline'
        shell: bash
        run: cargo test -p usnm-ingest --test pipeline --locked 2>&1 | tee "$RUNNER_TEMP/quickwit-tests.log"
        env:
          QW_LISTEN_ADDRESS: 0.0.0.0
          QW_DATA_DIR: /quickwit/qwdata
          QW_CONFIG: /quickwit/config/quickwit.yaml
      - name: Test binary timings
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/quickwit-tests.log" ]; then
            python3 scripts/ci/rust-test-times.py --log "$RUNNER_TEMP/quickwit-tests.log" >> "$GITHUB_STEP_SUMMARY"
          fi
      - if: failure() && matrix.suite == 'parity'
        run: tail -n 200 "$RUNNER_TEMP"/qw/*.log

  quickwit:
    name: quickwit (parity, ingest release)
    needs: [changes, quickwit-tests]
    if: always() && needs.changes.outputs.quickwit == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Both isolated suites must pass
        env:
          RESULT: ${{ needs.quickwit-tests.result }}
        run: test "$RESULT" = success

  fixtures:
    name: fixtures are reproducible
    needs: changes
    if: needs.changes.outputs.fixtures == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 fixtures/generate.py
      - run: git diff --exit-code fixtures/data

  ops:
    name: ops data (version snapshots, index history)
    needs: changes
    if: needs.changes.outputs.ops == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the checker (hash-pinned)
        run: |
          python3 -m venv "$RUNNER_TEMP/ops"
          "$RUNNER_TEMP/ops/bin/pip" install --require-hashes --no-deps -r scripts/ci/requirements-ops.txt
      - name: Every snapshot matches ops/version-snapshots/schema.json
        run: '"$RUNNER_TEMP/ops/bin/python" scripts/ops/check-version-snapshots.py'
      - name: ops/index-history.json matches ops/index-history.schema.json, keys sorted
        run: '"$RUNNER_TEMP/ops/bin/python" scripts/ops/check-index-history.py'
      - name: The checkers' and searches.sh date-span tests pass
        run: >-
          "$RUNNER_TEMP/ops/bin/python" -m unittest -v
          scripts/ops/test_check_version_snapshots.py scripts/ops/test_check_index_history.py
          scripts/azure/test_date_spans.py

  image-tests:
    name: container image (${{ matrix.image }})
    needs: changes
    if: needs.changes.outputs.image == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [api, ingest, ja-ocr]
    # Build and smoke-test the images. Publishing happens per environment in
    # `publish`, from the same build cache.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Docker Hub base images come through Google's mirror of it (08 §8.6):
      # a runner's anonymous Docker Hub pulls hit its rate limit.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
      - uses: ./.github/actions/build-check-image
        if: matrix.image == 'api'
        with:
          file: docker/Dockerfile.api
          tag: usnewsmap-api:check
          cache-scope: api
      - name: The API image serves the API and the site
        if: matrix.image == 'api'
        run: scripts/ci/check-api-image.sh --image usnewsmap-api:check
      - uses: ./.github/actions/build-check-image
        if: matrix.image == 'ingest'
        with:
          file: docker/Dockerfile.ingest
          tag: usnm-ingest-check
          cache-scope: ingest
      - name: The ingest image runs
        if: matrix.image == 'ingest'
        run: scripts/ci/check-ingest-image.sh --image usnm-ingest-check
      # PR builds have no registry, so docker/Dockerfile.ingest's default base is
      # upstream's image; it must be the one infra/quickwit-image.json pins.
      - name: docker/Dockerfile.ingest's default Quickwit is the pinned upstream image
        if: matrix.image == 'ingest'
        run: |
          want=$(jq -r '.upstream | "\(.image):\(.tag)@\(.digest)"' infra/quickwit-image.json)
          grep -qxF "ARG QUICKWIT_IMAGE=$want" docker/Dockerfile.ingest ||
            { echo "::error::docker/Dockerfile.ingest's QUICKWIT_IMAGE default isn't $want"; exit 1; }
      - uses: ./.github/actions/build-check-image
        if: matrix.image == 'ja-ocr'
        with:
          file: docker/Dockerfile.ja-ocr
          tag: usnm-ja-ocr-check
          cache-scope: ja-ocr
      # The whole checkout, read-only: test_page_language_parity.py checks
      # the Rust port's word list and parity fixture against this Python.
      - name: The Japanese OCR job's tests pass
        if: matrix.image == 'ja-ocr'
        run: |
          docker run --rm -e PYTHONDONTWRITEBYTECODE=1 -v "$PWD:/repo:ro" -w /repo/ocr/ja-ocr --entrypoint python3 usnm-ja-ocr-check \
            -m unittest discover -v -p 'test_*.py'
      - name: The Japanese OCR image reads Japanese
        if: matrix.image == 'ja-ocr'
        run: scripts/ci/check-ja-ocr-image.sh --image usnm-ja-ocr-check

  image:
    name: container image builds
    needs: [changes, image-tests]
    if: always() && needs.changes.outputs.image == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: All image builds and smoke tests must pass
        env:
          RESULT: ${{ needs.image-tests.result }}
        run: test "$RESULT" = success

  # The on-prem OCR worker for the nodes (12 Step 2): built on AlmaLinux 9,
  # so it links against EL9's glibc (2.34) and runs on EL9 and RHEL 10.
  ocr-worker-el9:
    name: ocr worker (EL9 build, glibc)
    needs: changes
    if: needs.changes.outputs.ocr_worker == 'true' || needs.changes.outputs.ocr_dash == 'true'
    runs-on: ubuntu-latest
    env:
      # A pull request that changes only the dashboard builds only the
      # dashboard. A pull request that changes the worker, and every run that
      # is not a pull request, builds both, as the release carries both.
      BUILD_WORKER: ${{ needs.changes.outputs.ocr_worker == 'true' || github.event_name != 'pull_request' }}
    container:
      image: mirror.gcr.io/library/almalinux:9@sha256:9819dc675b67b595c2b59e42be7763fca1a8bb217fa5944e04daa22e9a64db16
    steps:
      - name: Build tools
        run: dnf -y -q install gcc binutils git-core tar gzip && dnf clean all
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: el9
      # --version prints the commit (USNM_GIT_SHA at build time).
      # The LAN dashboard (usnm-ocrdash, 12 §12.2.5) ships in the same
      # release; its container on pve-big is Debian 12 (glibc 2.36).
      - name: Build
        run: |
          packages=(-p usnm-ocr-dash)
          if [ "$BUILD_WORKER" = true ]; then packages+=(-p usnm-ocr-worker); fi
          cargo build --release --locked "${packages[@]}"
        env:
          USNM_GIT_SHA: ${{ github.sha }}
      - name: No glibc symbol newer than EL9's 2.34
        run: |
          mkdir -p dist
          names=(usnm-ocrdash)
          if [ "$BUILD_WORKER" = true ]; then names+=(usnm-ocr-worker); fi
          for name in "${names[@]}"; do
            bin=target/release/$name
            newest=$(objdump -T "$bin" | grep -o 'GLIBC_[0-9][0-9.]*' | sed 's/GLIBC_//' | sort -uV | tail -n 1)
            echo "$name: newest glibc symbol version: $newest"
            if [ "$(printf '%s\n2.34\n' "$newest" | sort -V | tail -n 1)" != 2.34 ]; then
              echo "::error::$name needs glibc $newest; EL9 has 2.34"
              exit 1
            fi
            "$bin" --version | grep -F "commit $GITHUB_SHA"
            cp "$bin" "dist/$name"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ocr-worker-el9
          retention-days: 7
          path: |
            dist/usnm-ocr-worker
            dist/usnm-ocrdash
          if-no-files-found: error

  # The worker runs on RHEL 10 too, and reads a page with the Tesseract
  # image it ships with, the way a node runs it (podman, one container per
  # page).
  ocr-worker-check:
    name: ocr worker (RHEL 10, Tesseract image)
    needs: [changes, ocr-worker-el9]
    # The release is built from this job's artifact, so a dashboard change on
    # main runs it too; a pull request that changes only the dashboard doesn't.
    if: >-
      needs.changes.outputs.ocr_worker == 'true'
      || (needs.changes.outputs.ocr_dash == 'true' && github.event_name != 'pull_request')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ocr-worker-el9
          path: dist
      - run: chmod +x dist/usnm-ocr-worker dist/usnm-ocrdash
      - name: It runs on AlmaLinux 10 (RHEL 10)
        run: >-
          docker run --rm -v "$PWD/dist:/w:ro"
          mirror.gcr.io/library/almalinux:10@sha256:838c2fafefb1a8a0d7f8cdbc3b0551c2a2b1eb0cd87aad6d62aecadb18311f1b
          /w/usnm-ocr-worker --version
      - name: Build the Tesseract image
        run: |
          podman build --pull=missing -f ocr/engines/tesseract/Containerfile -t usnm-ocr/tesseract:check ocr/engines/tesseract
          id=$(podman image inspect --format '{{.Id}}' usnm-ocr/tesseract:check)
          echo "image id sha256:$id"
          echo "sha256:$id" > dist/usnm-ocr-tesseract.image-id
          podman save --format oci-archive -o dist/usnm-ocr-tesseract.oci.tar usnm-ocr/tesseract:check
          gzip -n dist/usnm-ocr-tesseract.oci.tar
      - name: The worker reads a line with the image, as on a node
        run: |
          dist/usnm-ocr-worker check-engine --tesseract-image "$(cat dist/usnm-ocr-tesseract.image-id)"
      - name: The archive loads back as the same image
        run: |
          podman rmi -f usnm-ocr/tesseract:check
          podman load -i dist/usnm-ocr-tesseract.oci.tar.gz
          podman image exists "$(cat dist/usnm-ocr-tesseract.image-id)"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ocr-worker-release
          retention-days: 7
          path: |
            dist/usnm-ocr-worker
            dist/usnm-ocrdash
            dist/usnm-ocr-tesseract.oci.tar.gz
            dist/usnm-ocr-tesseract.image-id
          if-no-files-found: error

  # Require one always-reporting context, not path-filtered child checks.
  worker-contrib:
    name: worker and BOINC checks
    needs:
      - changes
      - contrib-compute
      - boinc-pages
      - boinc-db-tls
      - boinc-mysql84-db-tls
      - boinc-node-client
      - contrib-images
      - ocr-worker-el9
      - ocr-worker-check
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every applicable worker and BOINC check must pass
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          CONTRIB_REQUIRED: ${{ needs.changes.outputs.contrib }}
          PAGES_REQUIRED: ${{ needs.changes.outputs.boinc_pages }}
          WORKER_REQUIRED: ${{ needs.changes.outputs.ocr_worker }}
          DASH_REQUIRED: ${{ needs.changes.outputs.ocr_dash }}
        run: |
          python3 - <<'PY'
          import json
          import os

          needs = json.loads(os.environ["NEEDS_JSON"])
          if needs.get("changes", {}).get("result") != "success":
              raise SystemExit("::error::changes must succeed before classifying worker/BOINC checks")
          flags = {}
          for name in ("CONTRIB_REQUIRED", "PAGES_REQUIRED", "WORKER_REQUIRED", "DASH_REQUIRED"):
              value = os.environ.get(name)
              if value not in ("true", "false"):
                  raise SystemExit(f"::error::{name} must be true or false, got {value!r}")
              flags[name] = value == "true"
          event = os.environ["GITHUB_EVENT_NAME"]
          if event not in ("pull_request", "push", "workflow_dispatch"):
              raise SystemExit(f"::error::unsupported CI event: {event}")
          required = dict.fromkeys((
              "contrib-compute", "boinc-db-tls", "boinc-mysql84-db-tls",
              "boinc-node-client", "contrib-images",
          ), flags["CONTRIB_REQUIRED"])
          required["boinc-pages"] = flags["PAGES_REQUIRED"]
          required["ocr-worker-el9"] = flags["WORKER_REQUIRED"] or flags["DASH_REQUIRED"]
          required["ocr-worker-check"] = flags["WORKER_REQUIRED"] or (
              flags["DASH_REQUIRED"] and event != "pull_request"
          )
          errors = []
          for name, selected in required.items():
              expected = "success" if selected else "skipped"
              result = needs.get(name, {}).get("result", "missing")
              print(f"{name}: {result} (expected {expected})")
              if result != expected:
                  errors.append(f"::error::{name} must be {expected}, got {result}")
          if errors:
              raise SystemExit("\n".join(errors))
          PY

  # On main: a GitHub release of the worker binary, the LAN dashboard and
  # the Tesseract image, with a build provenance attestation, which hosts
  # check with `gh attestation verify` before they install anything. No node
  # runs the binary as a queue worker (#966: local OCR runs through BOINC
  # only); the scan archive host (scripts/ocr-node/install-archive-host.sh),
  # the scan fetcher and the dashboard install from it.
  ocr-worker-release:
    name: ocr worker release
    needs: [changes, rust, ocr-worker-el9, ocr-worker-check]
    if: >-
      always() && (needs.changes.outputs.ocr_worker == 'true' || needs.changes.outputs.ocr_dash == 'true')
      && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
      && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # A slower run for an older commit doesn't publish after a newer one: only
      # the commit main points at publishes, or an older one when none of main's
      # newer commits change the worker or the dashboard build (their runs
      # publish no release).
      - name: Is this still the head of main?
        id: head
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci/head-of-main.sh --unless-changed ocr_worker,ocr_dash
      - if: steps.head.outputs.current == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ocr-worker-release
          path: dist
      - name: Checksums
        if: steps.head.outputs.current == 'true'
        working-directory: dist
        run: |
          sha256sum usnm-ocr-worker usnm-ocrdash usnm-ocr-tesseract.oci.tar.gz usnm-ocr-tesseract.image-id > SHA256SUMS
          cat SHA256SUMS
      - if: steps.head.outputs.current == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/usnm-ocr-worker
            dist/usnm-ocrdash
            dist/usnm-ocr-tesseract.oci.tar.gz
            dist/usnm-ocr-tesseract.image-id
            dist/SHA256SUMS
      - name: Publish the release
        if: steps.head.outputs.current == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci/ocr-worker-release.sh --dist dist

  # Every change, documentation included: no private (RFC 1918) address
  # may be committed anywhere.
  private-addresses:
    name: no private addresses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: scripts/ci/no-private-addresses.sh

  infra-checks:
    name: infra configuration checks
    # Also the shared-key scan and the named-arguments check (#277), so every
    # change but documentation runs them. The Bicep, naming, workbook and
    # script-test jobs run when something they read changed (`infra`), which
    # a change confined to src/ and tests/ of the LAN dashboard crate doesn't.
    # The OCR gold steps follow `ocr_gold`.
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Bicep
        if: needs.changes.outputs.infra == 'true'
        run: scripts/ci/install-bicep.sh
      - name: Lint (any warning fails)
        if: needs.changes.outputs.infra == 'true'
        run: scripts/ci/lint-bicep.sh
      - name: No shared-key authentication (ADR-0009)
        run: scripts/ci/no-shared-keys.sh
      - name: Scripts and CLIs take named arguments, not positional ones (#277)
        run: scripts/ci/no-positional-args.py
      # The Surya image's pins live in ocr/boinc/surya/engine.lock and the NDLOCR-Lite commit in its
      # models.lock; this checks the places that can't read them (the Containerfiles, the adapter's
      # COMMIT, the engine catalog). Its unit test runs with the others below.
      - name: Engine pins written in more than one place agree
        if: needs.changes.outputs.infra == 'true'
        run: scripts/ci/check-engine-pins.py
      - name: The OCR gold set's tests pass (#296)
        if: needs.changes.outputs.ocr_gold == 'true'
        run: |
          python3 -m pip install --quiet --break-system-packages pillow==13.0.0
          python3 -m unittest -v scripts/ocr-survey/test_gold.py
          python3 -m unittest discover -s scripts/ocr-survey -p test_transcription.py -v
      - name: The Rust scorer's golden files match gold.py (#457)
        if: needs.changes.outputs.ocr_gold == 'true'
        run: python3 scripts/ocr-survey/golden_score.py --out crates/usnm-ocr-survey/tests/golden --check
      - name: The OCR node scripts pass their image tests and shellcheck
        if: needs.changes.outputs.infra == 'true'
        run: |
          python3 -m pip install --quiet --break-system-packages pillow==13.0.0
          python3 -m unittest -v scripts/ocr-node/test_quality_jpeg_cache.py
          python3 -m unittest -v scripts/ocr-node/test_quality_jpeg_list.py
          shellcheck -x -S warning scripts/ocr-node/reboot-if-needed.sh scripts/ocr-node/push-boinc-scan.sh \
            scripts/ocr-node/check-scan-archive.sh scripts/ocr-node/grant-archive-uploader.sh \
            scripts/ocr-node/install-archive-host.sh
      - name: The BOINC scripts pass shellcheck
        if: needs.changes.outputs.infra == 'true'
        run: |
          shellcheck -x -S warning scripts/boinc/start-boinc-bridge.sh scripts/boinc/provision-boinc.sh scripts/boinc/boinc-app-release.sh \
            scripts/boinc/onprem/image-security-check.sh
      # Every setting infra/main.bicepparam reads is in the schema, and the
      # committed files hold only known public ones, typed and sorted (#295).
      - name: Each environment's committed settings match infra/env/schema.json
        if: needs.changes.outputs.infra == 'true'
        run: scripts/lib/env_settings.py --check
      # Resource names (ADR-0017): names() in infra/naming.bicep against the
      # rules, infra/names/exceptions.json (which only shrinks against the
      # base branch) and infra/names/prod.json, and no module building a
      # name of its own. The base branch's tip is fetched into a ref of its
      # own (one commit is enough: only its exceptions.json is read). A
      # fetch that still fails after retries fails the step, and so does a
      # base check-names.py can't read (--require-base), so the shrink check
      # never drops out quietly.
      - name: Resource names follow ADR-0017 and prod's are unchanged
        if: needs.changes.outputs.infra == 'true'
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
        run: |
          for try in 1 2 3 4; do
            git fetch --no-tags --depth=1 origin "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF" && break
            if [ "$try" = 4 ]; then echo "::error::can't fetch the base branch $BASE_REF"; exit 1; fi
            sleep $((try * 5))
          done
          scripts/ci/check-names.py --require-base --base "refs/remotes/origin/$BASE_REF"
      # The workbooks are loaded as text, so Bicep doesn't parse them.
      - name: The workbook definitions parse and name the workspace placeholder
        if: needs.changes.outputs.infra == 'true'
        run: |
          scripts/ci/check-workbooks.py
          scripts/ci/check-workbooks.py --module contrib-compute/infra/boinc/modules/workbook.bicep
      - name: Build every Bicep template
        if: needs.changes.outputs.infra == 'true'
        run: scripts/ci/build-bicep.sh
      # The parameters bootstrap deploys the stack with (settings from the
      # environment; unset ones take their defaults). The VNet block has no
      # default; this sample is from RFC 5737's documentation range.
      - if: needs.changes.outputs.infra == 'true'
        run: bicep build-params infra/main.bicepparam --stdout > /dev/null
        env:
          AZURE_ENV_NAME: dev
          USNM_VNET_ADDRESS_PREFIX: 192.0.2.0/24

  script-tests:
    name: script tests (${{ matrix.shard }})
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Bicep for ARM contract tests
        run: scripts/ci/install-bicep.sh
      - name: Every selected script module runs in exactly one isolated shard
        env:
          SHARD: ${{ matrix.shard }}
        run: scripts/ci/run-unit-tests.py --shard-index "$SHARD" --shard-count 3 --timings "$RUNNER_TEMP/script-timings.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: script-timings-${{ matrix.shard }}
          path: ${{ runner.temp }}/script-timings.json
          retention-days: 7
          if-no-files-found: error

  infra:
    name: infra (bicep lint, build)
    needs: [changes, infra-checks, script-tests]
    if: always() && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Configuration and all relevant script shards must pass
        env:
          CONFIG_RESULT: ${{ needs.infra-checks.result }}
          SCRIPTS_RESULT: ${{ needs.script-tests.result }}
          SCRIPTS_REQUIRED: ${{ needs.changes.outputs.infra }}
        run: |
          test "$CONFIG_RESULT" = success
          if [ "$SCRIPTS_REQUIRED" = true ]; then
            test "$SCRIPTS_RESULT" = success
          else
            test "$SCRIPTS_RESULT" = skipped
          fi

  web:
    name: web (lint, typecheck, test, build)
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node-web
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint
      # Prettier: web/ and Markdown anywhere in the repository.
      - run: npm run format:check
      - run: python3 ../scripts/ci/check-doc-links.py
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # Prettier on changed Markdown when the web job, which runs the same check,
  # is skipped.
  markdown:
    name: markdown (format)
    needs: changes
    if: needs.changes.outputs.markdown == 'true' && needs.changes.outputs.web != 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node-web
      - run: npm ci
      - run: npm run format:check
      - run: python3 ../scripts/ci/check-doc-links.py

  web-e2e:
    name: web end-to-end (Playwright + axe)
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - uses: ./.github/actions/setup-node-web
      # The API's build overlaps the site's; start-api-fixtures.sh runs cargo
      # build again, which waits for this one and fails the same way if it did.
      - name: Build the API in the background
        run: cargo build --release --locked -p usnm-api > cargo-build.log 2>&1 &
      # Chromium (~300 MB) is the same for a given Playwright version, so it is
      # downloaded only when that changes. Its system packages still install
      # each run (web-e2e.sh), alongside the site's build.
      - name: Playwright version
        id: playwright
        run: echo "version=$(node -p "require('./web/package-lock.json').packages['node_modules/playwright-core'].version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Build the site
        run: scripts/ci/web-e2e.sh --step build
      - name: Start the API on the synthetic fixtures
        run: scripts/ci/start-api-fixtures.sh
      - name: Run the end-to-end suite
        run: scripts/ci/web-e2e.sh --step test
        env:
          CI: "1"
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          retention-days: 7
          path: |
            web/playwright-report
            web/test-results
            api.log
            cargo-build.log
            playwright-install.log

  provision-reminder:
    name: stack change needs a provision
    # A deploy rolls the API image and applies infra/quickwit/searcher.yaml
    # (scripts/ci/roll-api.sh); CI's identity can't deploy the rest of the
    # stack (08 §8.2). When a merge to main changes it, say so on the run,
    # so the change isn't taken for deployed. That includes a settings
    # change, which is committed in infra/env/<env>.json (#295).
    needs: [changes]
    if: >-
      needs.changes.outputs.provision == 'true'
      && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Ask for a provision
        env:
          ENVS: ${{ vars.USNM_DEPLOY_ENVIRONMENTS || '[]' }}
        run: |
          envs=$(jq -r '.[]' <<< "$ENVS")
          msg="This merge changes the Azure stack or an environment's settings (infra/), which a deploy doesn't apply. Run scripts/azure/provision.sh for each environment: ${envs//$'\n'/, }."
          echo "::warning title=Stack change not deployed::$msg"
          {
            echo "### Stack change not deployed"
            echo
            echo "This merge changes \`infra/\` beyond what a deploy applies. From an up-to-date \`main\`, run:"
            echo
            echo '```sh'
            for e in $envs; do echo "scripts/azure/provision.sh --env $e"; done
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: publish and roll out (${{ matrix.environment }})
    # After every check passes on main: push the images to each deployed
    # environment's private registry (08 §8.6) and roll its API onto this
    # commit. Environments are listed in the repository variable
    # USNM_DEPLOY_ENVIRONMENTS (a JSON array, e.g. ["prod"]); each GitHub
    # Environment holds its own variables, written by scripts/azure/bootstrap.sh.
    needs: [changes, rust, queue, page-language-samples, quickwit, fixtures, ops, image, infra, web, markdown, web-e2e, private-addresses]
    # Only when the images changed, and every check that ran passed: a job
    # skipped as irrelevant must not block the deploy, and a failed one must.
    if: >-
      always() && needs.changes.outputs.image == 'true'
      && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
      && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
      && vars.USNM_DEPLOY_ENVIRONMENTS != '' && vars.USNM_DEPLOY_ENVIRONMENTS != '[]'
    strategy:
      fail-fast: false
      matrix:
        environment: ${{ fromJSON(vars.USNM_DEPLOY_ENVIRONMENTS || '[]') }}
    environment: ${{ matrix.environment }}
    runs-on: ubuntu-latest
    # id-token: the Azure sign-in below uses OIDC, so no secret is stored;
    # the API image's attestation step needs it too, for its Sigstore
    # signing certificate. attestations: that attestation is stored on the
    # repository.
    permissions:
      contents: read
      id-token: write
      attestations: write
    concurrency:
      group: deploy-${{ matrix.environment }}
      cancel-in-progress: false
    env:
      ACR: ${{ vars.USNM_ACR_LOGIN_SERVER }}
      APP: ${{ vars.USNM_API_APP }}
      RG: ${{ vars.USNM_RESOURCE_GROUP }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # A slower run for an older commit must not replace newer images: only
      # the commit main points at publishes, or an older one when none of
      # main's newer commits change the images (their runs publish nothing).
      - name: Is this still the head of main?
        id: head
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci/head-of-main.sh --unless-changed image
      - if: steps.head.outputs.current == 'true'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.USNM_CI_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - if: steps.head.outputs.current == 'true'
        run: az acr login --name "${ACR%%.*}"
      # Before the ingest image, which is built on it: our Quickwit build if
      # infra/quickwit-image.json lists this environment (it must be in the
      # registry already), otherwise upstream's, copied in by digest.
      - name: The registry has the pinned Quickwit image
        id: quickwit
        if: steps.head.outputs.current == 'true'
        env:
          ENVIRONMENT: ${{ matrix.environment }}
        run: scripts/ci/quickwit-image.sh
      # As in `image`: Docker Hub base images through mirror.gcr.io.
      - if: steps.head.outputs.current == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
      - if: steps.head.outputs.current == 'true'
        id: api
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile.api
          push: true
          cache-from: type=gha,scope=api
          tags: |
            ${{ env.ACR }}/usnewsmap-api:main
            ${{ env.ACR }}/usnewsmap-api:${{ github.sha }}
      - if: steps.head.outputs.current == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile.ingest
          push: true
          cache-from: type=gha,scope=ingest
          build-args: |
            USNM_GIT_SHA=${{ github.sha }}
            QUICKWIT_IMAGE=${{ steps.quickwit.outputs.image }}
          tags: |
            ${{ env.ACR }}/usnewsmap-ingest:main
            ${{ env.ACR }}/usnewsmap-ingest:${{ github.sha }}
      - if: steps.head.outputs.current == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile.ja-ocr
          push: true
          cache-from: type=gha,scope=ja-ocr
          tags: |
            ${{ env.ACR }}/usnewsmap-ja-ocr:main
            ${{ env.ACR }}/usnewsmap-ja-ocr:${{ github.sha }}
      # The API app exists once the environment pulls from its registry
      # (bootstrap's second provision); until then only the images publish.
      - name: Roll the API onto this commit's image
        if: steps.head.outputs.current == 'true' && env.APP != ''
        env:
          IMAGE: ${{ env.ACR }}/usnewsmap-api:${{ github.sha }}
        run: scripts/ci/roll-api.sh
      - name: Restore the last successful IndexNow submission
        if: steps.head.outputs.current == 'true' && env.APP != ''
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/indexnow/sitemap.sha256
          key: indexnow-v1-${{ matrix.environment }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: indexnow-v1-${{ matrix.environment }}-
      # Submit every live sitemap URL only when the URL set changes. Record
      # state only after all batches succeed, so failures are retried later.
      - name: Submit the sitemap to IndexNow
        id: indexnow
        if: steps.head.outputs.current == 'true' && env.APP != ''
        continue-on-error: true
        env:
          INDEXNOW_STATE_FILE: ${{ runner.temp }}/indexnow/sitemap.sha256
        run: scripts/ci/indexnow.sh
      - name: Save the successful IndexNow submission
        if: steps.indexnow.outputs.submitted == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/indexnow/sitemap.sha256
          key: indexnow-v1-${{ matrix.environment }}-${{ github.run_id }}-${{ github.run_attempt }}
      # A build provenance attestation for the API image, for an origin that
      # checks it before it runs the image (#955), as hosts check the OCR
      # worker release's. Its subject is the
      # digest the push returned, the one `usnewsmap-api:<sha>` names. Last,
      # so a failure here doesn't hold back the rollout or IndexNow, but
      # still fails the deployment.
      - name: Attest the API image
        if: steps.head.outputs.current == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.ACR }}/usnewsmap-api
          subject-digest: ${{ steps.api.outputs.digest }}
