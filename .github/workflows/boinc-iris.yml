name: boinc-iris
# The usnm_iris worker image (#703, ocr/boinc/iris): Qwen3-VL-4B INT4 on OpenVINO GenAI for an Intel
# Iris Xe GPU. A pull request that changes it runs the contract tests and builds the image without
# pushing. A manual run on main also pushes ghcr.io/tgoodyear/usnm-boinc-worker:iris-<commit>,
# attests its build provenance to the registry (GitHub OIDC, no secrets), and its summary gives the
# immutable digest that the campaign's jobs pin as worker_image.
#
# Hosted runners have no Intel GPU, so CI proves the image's offline contract (model manifest,
# engine versions, input checks, explicit device failure with no CPU fallback), not inference.
run-name: ${{ github.event_name == 'workflow_dispatch' && format('boinc-iris ({0})', inputs.correlation) || github.event.pull_request.title }}
on:
  workflow_dispatch:
    inputs:
      correlation:
        description: "Identifies this run, for finding it after the dispatch"
        required: false
        default: "manual"
  pull_request:
    paths:
      - ".github/workflows/boinc-iris.yml"
      - "ocr/boinc/iris/**"
      - "scripts/boinc/test_iris_worker.py"

permissions:
  contents: read

concurrency:
  group: boinc-iris-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/tgoodyear/usnm-boinc-worker

jobs:
  # Pull requests: test and build only, with a read-only token.
  check:
    name: iris worker image (build)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps: &steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Contract and worker tests (no GPU, no OpenVINO)
        run: python3 -m unittest -v scripts/boinc/test_iris_worker.py
      # Disposable hosted runner only; never run this cleanup on a volunteer node.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af > /dev/null
          df -h /
      - name: Build
        run: |
          docker build -f ocr/boinc/iris/Containerfile \
            --build-arg "BUILD_REVISION=$GITHUB_SHA" \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.description=usnewsmap BOINC usnm_iris worker (Qwen3-VL-4B INT4, OpenVINO, Intel Iris Xe)" \
            -t "$IMAGE:iris-$GITHUB_SHA" .
          hc=$(docker image inspect --format '{{json .Config.Healthcheck}}' "$IMAGE:iris-$GITHUB_SHA")
          [[ $hc == null || $hc == '{"Test":["NONE"]}' ]] || { echo "::error::image declares a healthcheck: $hc"; exit 1; }
          docker image ls "$IMAGE"
      # A valid unit in the job.toml sandbox but without the GPU: the worker must check the
      # job, page and model, then refuse the missing render node with an explicit error result
      # and a nonzero exit, never a success-shaped output or a CPU run.
      - name: Without a GPU the unit fails explicitly
        run: |
          work="$PWD/.iris-nogpu"
          mkdir -p "$work" && chmod 777 "$work"
          docker run --rm --network=none -v "$work:/out" "$IMAGE:iris-$GITHUB_SHA" /opt/iris/venv/bin/python -I -c '
          import io, sys
          sys.path.insert(0, "/opt/iris/app")
          import contract as c
          from PIL import Image, ImageDraw
          image = Image.new("RGB", (640, 120), "white")
          ImageDraw.Draw(image).text((10, 40), "THE LUCKY TIGER COMPANY 1887", fill="black")
          buf = io.BytesIO(); image.save(buf, "JPEG", quality=90); page = buf.getvalue()
          job = c.make_job(crop_id="ci-nogpu-0001", doc_id="ci/nogpu", worker_image=c.WORKER_IMAGE_REPOSITORY + "@sha256:" + "0" * 64,
                           page=page, width=640, height=120)
          open("/out/page.jpg", "wb").write(page)
          open("/out/iris.json", "wb").write(c.encode_job(job))
          open("/out/init_data.xml", "w").write("<app_init_data>\n<hostid>9</hostid>\n</app_init_data>\n")
          '
          set +e
          docker run --rm --network=none --read-only --cap-drop=ALL --cap-add=DAC_OVERRIDE \
            --security-opt=no-new-privileges --memory=9g --memory-swap=9g --cpus=2 --pids-limit=256 \
            --tmpfs=/tmp:rw,size=1g -v "$work:/work" "$IMAGE:iris-$GITHUB_SHA" 2> "$work/stderr.txt"
          code=$?
          set -e
          cat "$work/stderr.txt"
          [[ $code == 1 ]] || { echo "::error::expected exit 1 without a GPU, got $code"; exit 1; }
          grep -q '^usnm_iris_result ' "$work/stderr.txt"
          jq -e '.status == "error" and .text == null and .error.stage == "device"
                 and .model_manifest_sha256 != null and .page_sha256 != null and .host_id == 9' "$work/iris-result.json"
          docker run --rm --network=none -v "$work:/out:ro" "$IMAGE:iris-$GITHUB_SHA" /opt/iris/venv/bin/python -I -c '
          import json, sys
          sys.path.insert(0, "/opt/iris/app")
          import contract as c
          job = c.parse_job_bytes(open("/out/iris.json", "rb").read())
          result = c.parse_result_bytes(open("/out/iris-result.json", "rb").read(), job)
          print(json.dumps(result["error"]))
          '
      - name: Push to GHCR and attest
        id: push
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$ACTOR" --password-stdin
          docker push "$IMAGE:iris-$GITHUB_SHA"
          digest=$(docker buildx imagetools inspect "$IMAGE:iris-$GITHUB_SHA" --format '{{json .Manifest}}' | jq -r .digest)
          [[ $digest =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::no registry digest after the push"; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Attest build provenance
        if: steps.push.outcome == 'success'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - name: Summary
        if: steps.push.outcome == 'success'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          docker logout ghcr.io
          manifest=$(docker image inspect --format '{{json .Config.Env}}' "$IMAGE:iris-$GITHUB_SHA" \
            | jq -r '.[] | select(startswith("USNM_IRIS_MODEL_MANIFEST=")) | sub("^[^=]*="; "")')
          {
            echo "### usnm_iris worker image"
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| job worker_image (release --worker-image) | \`$IMAGE@$DIGEST\` |"
            echo "| digest | \`$DIGEST\` |"
            echo "| model manifest | \`$manifest\` |"
            echo "| provenance | \`gh attestation verify oci://$IMAGE@$DIGEST -R $GITHUB_REPOSITORY\` |"
            echo "| commit | \`$GITHUB_SHA\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  # A manual run on main: the same steps, then the push and attestation. Only this job can write.
  publish:
    name: iris worker image (build, push)
    # Only main, so what is published went through review and branch protection.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps: *steps
