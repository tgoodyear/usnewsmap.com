name: boinc-worker-build
description: >-
  Builds the Tesseract engine image and the BOINC worker image on it
  (.github/workflows/boinc-worker.yml), and checks the worker names and is built
  on that engine. Pushes nothing.
inputs:
  image:
    description: The worker image's repository
    required: true
  tag:
    description: The local tag to give the worker image
    required: true
outputs:
  tesseract_image:
    description: The engine's image id (sha256:...), the worker's TESSERACT_IMAGE
    value: ${{ steps.engine.outputs.tesseract_image }}
runs:
  using: composite
  steps:
    # Docker's own builder, so the worker build can use the engine from the
    # daemon's image store by its local tag (TESSERACT_FROM).
    - name: Build the Tesseract engine image
      id: engine
      shell: bash
      run: |
        docker build -f ocr/engines/tesseract/Containerfile -t usnm-ocr/tesseract:worker ocr/engines/tesseract
        id=$(docker image inspect --format '{{.Id}}' usnm-ocr/tesseract:worker)
        [[ $id =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::unexpected engine image id $id"; exit 1; }
        echo "tesseract_image=$id" >> "$GITHUB_OUTPUT"
        echo "engine image $id"
    - name: Build the worker image on it
      env:
        TESSERACT_IMAGE: ${{ steps.engine.outputs.tesseract_image }}
        SHA: ${{ inputs.tag }}
        WORKER_IMAGE: ${{ inputs.image }}
      shell: bash
      run: |
        docker build -f ocr/boinc/Containerfile --build-arg "TESSERACT_IMAGE=$TESSERACT_IMAGE" \
          --build-arg TESSERACT_FROM=usnm-ocr/tesseract:worker \
          --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
          --label "org.opencontainers.image.revision=$SHA" \
          --label "org.opencontainers.image.description=usnewsmap BOINC OCR worker (Tesseract and usnm-boinc)" \
          -t "$WORKER_IMAGE:$SHA" .
    # FROM resolved the engine's tag: its layers must be the engine's, in order.
    - name: The image is built on the engine image
      env:
        TESSERACT_IMAGE: ${{ steps.engine.outputs.tesseract_image }}
        SHA: ${{ inputs.tag }}
        WORKER_IMAGE: ${{ inputs.image }}
      shell: bash
      run: |
        engine=$(docker image inspect --format '{{json .RootFS.Layers}}' "$TESSERACT_IMAGE")
        worker=$(docker image inspect --format '{{json .RootFS.Layers}}' "$WORKER_IMAGE:$SHA")
        jq -e --argjson e "$engine" '.[0:($e | length)] == $e' <<< "$worker" > /dev/null ||
          { echo "::error::the worker image is not built on $TESSERACT_IMAGE"; exit 1; }
    - name: The image names its engine and runs usnm-boinc
      env:
        TESSERACT_IMAGE: ${{ steps.engine.outputs.tesseract_image }}
        SHA: ${{ inputs.tag }}
        WORKER_IMAGE: ${{ inputs.image }}
      shell: bash
      run: |
        got=$(docker image inspect --format '{{range .Config.Env}}{{println .}}{{end}}' "$WORKER_IMAGE:$SHA" |
          sed -n 's/^USNM_TESSERACT_IMAGE=//p')
        [ "$got" = "$TESSERACT_IMAGE" ] || { echo "::error::USNM_TESSERACT_IMAGE is '$got', not $TESSERACT_IMAGE"; exit 1; }
        docker run --rm --network=none "$WORKER_IMAGE:$SHA" /usr/local/bin/usnm-boinc --help > /dev/null
        docker run --rm --network=none "$WORKER_IMAGE:$SHA" tesseract --version
