name: boinc-worker-build
description: Build and check one native architecture of the BOINC worker; publish nothing.
inputs:
  image:
    description: Worker image repository
    required: true
  tag:
    description: Local image tag
    required: true
  arch:
    description: Native architecture (amd64 or arm64)
    required: true
  base_image:
    description: Pinned Debian base for this architecture
    required: true
  rust_image:
    description: Pinned Rust build base for this architecture
    required: true
outputs:
  tesseract_image:
    description: Native engine configuration/image ID
    value: ${{ steps.build.outputs.tesseract_image }}
runs:
  using: composite
  steps:
    - id: build
      shell: bash
      env:
        ARCH: ${{ inputs.arch }}
        BASE_IMAGE: ${{ inputs.base_image }}
        RUST_IMAGE: ${{ inputs.rust_image }}
        WORKER_IMAGE: ${{ inputs.image }}
        TAG: ${{ inputs.tag }}
      run: |
        case "$ARCH:$(uname -m)" in amd64:x86_64|arm64:aarch64) ;; *) echo 'native runner architecture mismatch' >&2; exit 1 ;; esac
        docker build --platform "linux/$ARCH" --build-arg "BASE=$BASE_IMAGE" \
          -f ocr/engines/tesseract/Containerfile -t usnm-ocr/tesseract:worker ocr/engines/tesseract
        engine=$(docker image inspect --format '{{.Id}}' usnm-ocr/tesseract:worker)
        [[ $engine =~ ^sha256:[0-9a-f]{64}$ ]]
        args=(--platform "linux/$ARCH" --build-arg "TESSERACT_IMAGE=$engine"
          --build-arg TESSERACT_FROM=usnm-ocr/tesseract:worker --build-arg "RUST_IMAGE=$RUST_IMAGE"
          -f ocr/boinc/Containerfile)
        docker build "${args[@]}" --target build -t usnm-boinc-build:worker .
        docker build "${args[@]}" --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
          --label "org.opencontainers.image.revision=$GITHUB_SHA" -t "$WORKER_IMAGE:$TAG" .
        e=$(docker image inspect --format '{{json .RootFS.Layers}}' "$engine")
        w=$(docker image inspect --format '{{json .RootFS.Layers}}' "$WORKER_IMAGE:$TAG")
        jq -e --argjson e "$e" '.[0:($e | length)] == $e' <<< "$w" > /dev/null
        got=$(docker image inspect --format '{{range .Config.Env}}{{println .}}{{end}}' "$WORKER_IMAGE:$TAG" | sed -n 's/^USNM_TESSERACT_IMAGE=//p')
        [ "$got" = "$engine" ]
        echo "tesseract_image=$engine" >> "$GITHUB_OUTPUT"
        python3 scripts/boinc/smoke-worker.py --image "$WORKER_IMAGE:$TAG" --build-image usnm-boinc-build:worker \
          --arch "$ARCH" --dir "$RUNNER_TEMP/boinc-worker-smoke"
