name: setup-rust
description: >-
  The stable Rust toolchain and the Cargo build cache, as the Rust jobs of .github/workflows/ci.yml
  set them up. A job that calls this runs after its checkout.
inputs:
  components:
    description: Comma-separated rustup components to install with the toolchain, for example "rustfmt, clippy"
    required: false
    default: ""
  cache-key:
    description: An extra key for the build cache, for a job whose target directory the others' can't reuse (the EL9 container)
    required: false
    default: ""
runs:
  using: composite
  steps:
    - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable branch
      with:
        toolchain: stable
        components: ${{ inputs.components }}
    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      with:
        key: ${{ inputs.cache-key }}
