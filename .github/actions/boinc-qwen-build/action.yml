name: boinc-qwen-build
description: >-
  Builds one immutable usnm_qwen payload, checks cold/warm extraction and all three
  error outputs, and for 2b verifies a rendered-line CPU reading. Pushes nothing.
inputs:
  image:
    description: The image's repository
    required: true
  tag:
    description: The local tag to give the image
    required: true
  model:
    description: Immutable model payload (2b CPU or 8b GPU)
    required: true
runs:
  using: composite
  steps:
    # Disposable hosted runner only; never run this cleanup on a volunteer node.
    - name: Free disk space
      shell: bash
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        docker system prune -af > /dev/null
        df -h /
    - name: Build
      env:
        IMAGE: ${{ inputs.image }}
        SHA: ${{ inputs.tag }}
        MODEL: ${{ inputs.model }}
      shell: bash
      run: |
        docker build -f ocr/boinc/qwen/Containerfile \
          --build-arg "QWEN_MODEL=$MODEL" \
          --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
          --label "org.opencontainers.image.revision=$GITHUB_SHA" \
          --label "org.opencontainers.image.description=usnewsmap BOINC Qwen3-VL worker (llama.cpp, usnm-boinc)" \
          -t "$IMAGE:$SHA" .
        docker image ls "$IMAGE"
    - name: Cold and warm extraction in an isolated empty image store
      env:
        IMAGE: ${{ inputs.image }}
        SHA: ${{ inputs.tag }}
        MODEL: ${{ inputs.model }}
      shell: bash
      run: |
        python3 scripts/boinc/qwen_cold_cache.py --image "$IMAGE:$SHA" --model "$MODEL" --state ".qwen-cold-$MODEL"
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: always()
      with:
        name: qwen-disk-${{ inputs.model }}
        path: |
          .qwen-cold-${{ inputs.model }}/measurement.json
          .qwen-cold-${{ inputs.model }}/daemon.log
          .qwen-cold-${{ inputs.model }}/load.log
    # Without a GPU: the diagnostics, the probe and a unit that is refused (no job) must still
    # write all three outputs.
    - name: The image runs a unit and always returns its outputs
      env:
        IMAGE: ${{ inputs.image }}
        SHA: ${{ inputs.tag }}
        MODEL: ${{ inputs.model }}
      shell: bash
      run: |
        work="$PWD/.qwen-invalid-$MODEL"
        mkdir -p "$work"
        chmod 777 "$work"
        echo '{}' > "$work/qwen.json"
        echo x > "$work/page.jpg"
        docker run --rm --network=none --read-only --cap-drop=ALL --cap-add=DAC_OVERRIDE --security-opt=no-new-privileges --tmpfs=/tmp:rw,size=1g --cpus=4 --memory=6g --memory-swap=6g --pids-limit=1024 -v "$work:/work" "$IMAGE:$SHA"
        for f in readings.json result.json diag.txt; do
          test -f "$work/$f" || { echo "::error::no $f"; exit 1; }
        done
        jq -e '.unit_error != null' "$work/result.json" > /dev/null
        grep -q '== llama-server probe' "$work/diag.txt"
        docker run --rm "$IMAGE:$SHA" usnm-boinc qwen probe
        cat "$work/diag.txt"
