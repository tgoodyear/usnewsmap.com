# Weekly update PRs. GitHub Actions are pinned to commit SHAs in the
# workflows and in the composite actions under .github/actions, so this is
# what keeps those pins current.
version: 2
updates:
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo-minor:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    ignore:
      # Node types follow the Node version CI and the image use (24).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      npm-minor:
        update-types: [minor, patch]
  - package-ecosystem: pip
    directory: /scripts/ci
    schedule:
      interval: weekly
