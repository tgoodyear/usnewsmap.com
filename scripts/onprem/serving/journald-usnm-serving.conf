# The serving container's journal (#955), installed by install.sh as
# /etc/systemd/journald.conf.d/usnm-serving.conf. The API's console logs
# land here, and /privacy says the server's other logs are deleted after 30
# days (in Azure, the Container Apps console log table's retention). No
# unit here logs a client address or a query string (09 §9.4.2).
[Journal]
MaxRetentionSec=30day
