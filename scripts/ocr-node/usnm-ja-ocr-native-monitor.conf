[Service]
EnvironmentFile=/etc/usnm/ja-ocr-monitor.env
ExecStart=
ExecStart=/opt/usnm-ja-native/monitor/usnm-ingest ja-ocr-run --executable /opt/usnm-ja-native/current/venv/bin/python --arg /opt/usnm-ja-native/current/jaocr/jaocr.py --arg run --arg=--fail-on-issue-error --arg=--limit --arg ${JAOCR_LIMIT}
