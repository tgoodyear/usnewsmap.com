# The Quickwit searcher sidecar's node config (08 §8.4). Bicep loads this
# file into the quickwit container's USNM_QW_CONFIG (modules/containerapp.bicep),
# and every CI deploy applies it to the running app when it differs
# (scripts/ci/roll-api.sh), so a change here goes live on merge without a
# provision. __STORAGE_ACCOUNT__ becomes the environment's storage account.
#
# Searcher-only node on localhost. The metastore service opens the
# file-backed metastore read-only and polls it (08 §8.4.1); the API looks
# each index up before serving a version that lists it, because the
# searcher reads the index list only at start (S-2). Aggregation limits per
# 05 §5.7; caches sized for the 4 GiB container.
version: 0.8
cluster_id: usnm-searcher
node_id: searcher
enabled_services: [searcher, metastore]
listen_address: 127.0.0.1
rest:
  listen_port: 7280
data_dir: /quickwit/qwdata
metastore_uri: azure://qw-index#polling_interval=30s
default_index_root_uri: azure://qw-index
storage:
  azure:
    account: __STORAGE_ACCOUNT__
searcher:
  aggregation_bucket_limit: 200000
  aggregation_memory_limit: 768MB
  fast_field_cache_capacity: 1GB
  split_footer_cache_capacity: 256MB
  partial_request_cache_capacity: 32MB
  predicate_cache_capacity: 32MB
  # 8 to 24 (#125): on the dev 1% index one 2-vCPU searcher's cold median
  # went 1.66 to 1.1-1.3 s and its median one-at-a-time search 1.39 to 0.98 s;
  # peak throughput +19%. Prod baseline at 8 on pages-v20261008-1 (American
  # Stories, 640 splits; 9 Oct): cold radio 48 s, television 77 s, yellow
  # fever 100 s. The same searches are re-run after this rolls out (#125).
  #
  # 24 to 48 (#251): in 0.9.1 this is the number of splits downloading what a
  # search needs at once (warm-up slots), not CPU work, which the search pool
  # does (RAYON_NUM_THREADS, infra/modules/containerapp.bicep). Prod at 24 and
  # 3.75 vCPU: cold median 28.3 s, 2.2 vCPU used.
  max_num_concurrent_split_searches: 48
  # An admission budget for splits warming up, not a ceiling: Quickwit admits
  # a split on its initial estimate (300 MB scaled by its docs over 10M, at
  # least 10 MB, so 10 MB for ours of 30k to 56k docs) and lets actual use run
  # past the budget, only pausing new admissions. The default is 100 GB, which
  # never pauses anything. Headroom: the caches and aggregation limit above
  # take about 2.1 GB, leaving about 5.4 GB of the 7.5 GiB. At 24 slots the
  # whole searcher used 0.8 GB during cold searches (#251), so 48 should stay
  # near 1.6 GB; replica memory is checked after the rollout.
  warmup_memory_budget: 3GB
  # Quickwit cancels a search, and each split search in it, at these (both
  # 30 s by default) and answers 408. The API's own limit on a computation
  # is 120 s (USNM_COMPUTE_CAP_SECS), so Quickwit's must be longer, or busy
  # cold searches fail at 30 s (October 2026 load test, 06 §6.5).
  request_timeout_secs: 125
  leaf_request_timeout_secs: 125
