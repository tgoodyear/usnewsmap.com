<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1010" viewBox="0 0 1280 1010" role="img" aria-labelledby="title desc">
<title id="title">OCR and search pipeline with BOINC</title>
<desc id="desc">Library of Congress scans flow through the on-prem scan fetcher and OCR nodes to ocr-out, ocr-sync, the curated lake, the release and the Quickwit index behind the API. A BOINC branch hands reserved pages to an Azure-hosted BOINC server, volunteer hosts run the pinned worker, and results come back to the node, where collect gates them on gold-check trust before publishing to the same ocr-out.</desc>
