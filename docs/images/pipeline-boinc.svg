  .s { font-size: 12px; fill: #59636e; }
  .l { font-size: 11.5px; fill: #59636e; font-style: italic; }
  .ll { font-size: 11.5px; fill: #59636e; font-style: italic; text-anchor: start; }
  .g { font-size: 12px; fill: #6e7781; text-anchor: start; letter-spacing: .04em; text-transform: uppercase; font-weight: 600; }
  .a { stroke: #59636e; stroke-width: 1.5; fill: none; }
  .d { stroke: #59636e; stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; }
</style>
