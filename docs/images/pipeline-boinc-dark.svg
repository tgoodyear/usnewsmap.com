  .g { font-size: 12px; fill: #9198a1; text-anchor: start; letter-spacing: .04em; text-transform: uppercase; font-weight: 600; }
  .a { stroke: #9198a1; stroke-width: 1.5; fill: none; }
  .d { stroke: #9198a1; stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; }
</style>
