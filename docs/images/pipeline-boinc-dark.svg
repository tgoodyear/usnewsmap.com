<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1100" viewBox="0 0 1280 1100" role="img" aria-labelledby="title desc">
<title id="title">OCR and search pipeline with BOINC</title>
<desc id="desc">Library of Congress scans flow through the on-prem scan fetcher and OCR nodes to ocr-out, ocr-sync, the curated lake, the release and the Quickwit index behind the API. A BOINC branch hands reserved pages to an Azure-hosted BOINC server, volunteer hosts run the pinned worker, and the scan fetcher pushes cached scans to a hand-off container, a job in the main environment reserves and later collects the pages, and the BOINC bridge pulls each job from the container and puts its result spool back, Collect publishes a trusted host's result straight to the same ocr-out the OCR nodes write to, and holds an untrusted host's result in the dispatch root's quarantine.</desc>
