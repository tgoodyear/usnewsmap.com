# Upstream Tesseract sources for boinc/apps/native/Containerfile.upstream (#1835), one per line:
#   version  tarball URL  commit  sha256 of the tarball
# The tarball is GitHub's archive of the tag. The build refuses a tarball whose sha256 differs
# or whose embedded commit (the tar header's `comment=` field, set by `git archive`) isn't the
# commit here. 5.5.0 is the control: its tarball is byte-for-byte the orig tarball of Debian's
# tesseract_5.5.0.orig.tar.gz, so a 5.5.0 built this way differs from the default build only in
# how libtesseract is built (docs/reports/2026-11-tesseract-5-5-4.md).
