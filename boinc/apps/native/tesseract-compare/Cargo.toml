# Compares the output of two Tesseract builds (#1835). Standalone, outside the
# repository's workspace: `cargo build --release` in this directory (clap is its only dependency).
[package]
name = "tesseract-compare"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
clap = { version = "4", features = ["derive"] }
