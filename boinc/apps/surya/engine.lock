# The pins of the usnm_surya worker image (#516, #842): the one place each is written. One KEY=value per
# line, the keys named as the Containerfile's build arguments, so a build passes a line as it is:
#   pins=$(sed -n 's/^[A-Z][A-Z_]*=/--build-arg &/p' boinc/apps/surya/engine.lock)
#   docker build -f boinc/apps/surya/Containerfile $pins -t usnm-boinc-surya .
# .github/actions/boinc-surya-build passes them the same way. usnm-boinc compiles SURYA_VERSION in as
# the default of `surya ... --engine-surya`. scripts/ci/check-engine-pins.py checks this file against
# weights.lock and the Containerfile.
#
# surya-ocr, installed from PyPI; the image's USNM_SURYA_VERSION, and the version a unit is staged for.
SURYA_VERSION=0.22.1
# ghcr.io/ggml-org/llama.cpp:server-cuda, build 11610 (commit 091b6a7fc); the image's USNM_SURYA_LLAMA_IMAGE
# for the cuda variant, and SURYA_ENGINE_LLAMA when a campaign is staged for it.
LLAMA_DIGEST=sha256:b0baccbe2e00b5d74e63f85f9f023c93d61d0f329475269e1e7002e87eb875ea
# ghcr.io/ggml-org/llama.cpp:server-vulkan, the same commit; the vulkan variant's USNM_SURYA_LLAMA_IMAGE.
LLAMA_VULKAN_DIGEST=sha256:d64043576ad8fb29170563c769a997dbc1b9928f0d4a127fb9e4a9706ccb475b
# sha256: and the sha256 of weights.lock's lines that are not comments; the image's USNM_SURYA_WEIGHTS, and
# SURYA_ENGINE_WEIGHTS when a campaign is staged. The build fails if the weights it fetches hash otherwise.
SURYA_WEIGHTS=sha256:557aca6f56e5844007dbb04fe69a638f40e8d55823e89de07a1d4906c291b701
