# Not in the unit: fetch the handoff copy before the check. Managed identity only (az --auth-mode login).
[Service]
Environment=AZURE_CONFIG_DIR=/root/.azure
# "+": runs as root outside the sandbox, with the machine's own az identity; read-only on the store.
# HOME=/root is set for this step only (via env), so the unprivileged check keeps its own HOME for gh.
ExecStartPre=+/usr/bin/env HOME=/root /usr/bin/python3 /opt/usnm-crossbuild/fetch_handoff.py --dest /var/lib/usnm-crossbuild/handoff \
    --check-script /opt/usnm-crossbuild/native_crossbuild_check.py --trust-file /opt/usnm-crossbuild/native-build-trust.json
# Windows instance only: stage LoC's text for the day's sample (stage_loc_texts.py, #1929) once the handoff
# is in place. "-": a failure never stops the check, which then runs as before. Runs as the service user
# in the sandbox, niced and idle like the check; reads the LoC bulk OCR archives and the keep store.
ExecStartPre=-/usr/bin/python3 /opt/usnm-crossbuild/stage_loc_texts.py --handoff /var/lib/usnm-crossbuild/handoff \
    --scans ${SCANS_DIR} --state-dir /var/lib/usnm-crossbuild-check --out /var/lib/usnm-crossbuild-loc-texts \
    --archives /tank/locbulk/ocr --trust-file /opt/usnm-crossbuild/native-build-trust.json \
    --check-script /opt/usnm-crossbuild/native_crossbuild_check.py
# The texts are kept between runs; StateDirectory creates the directory for the service user and makes it
# writable under ProtectSystem=strict (the same effect as a ReadWritePaths entry).
StateDirectory=usnm-crossbuild-loc-texts
TasksMax=128
