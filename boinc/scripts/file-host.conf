limit_conn_zone $binary_remote_addr zone=boinc_client:1m;
limit_conn_zone $server_name zone=boinc_server:1m;

server {
    listen 8080 default_server;
    listen [::]:8080 default_server;
    server_name _;
    server_tokens off;
    root /srv/usnm-boinc-downloads;
    disable_symlinks on;
    autoindex off;
    gzip off;
    sendfile on;
    max_ranges 1;
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 30s;
    keepalive_timeout 10s;
    limit_conn boinc_client 4;
    limit_conn boinc_server 16;
    limit_conn_status 429;
    limit_rate 2m;

    location ~ "^/[0-9a-f]{64}$" {
        limit_except GET {
            deny all;
        }
        default_type application/octet-stream;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    location / {
        return 404;
    }
}
