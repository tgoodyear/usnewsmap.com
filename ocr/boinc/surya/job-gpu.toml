# usnm_surya, NVIDIA GPU version (plan class docker_nvidia_cuda). use_gpu makes the stock
# docker_wrapper add --gpus all: Docker needs the NVIDIA Container Toolkit's runtime, Podman a CDI
# spec (nvidia-ctk cdi generate). Two CPUs for Python and llama-server's host side; 8 GiB, no swap.
workdir = "/work"
use_gpu = true
create_args = "--network=none --read-only --cap-drop=ALL --cap-add=DAC_OVERRIDE --security-opt=no-new-privileges --cpus=2 --memory=8g --memory-swap=8g --pids-limit=1024 --tmpfs=/tmp:rw,size=1g"
