# Model files for the Tesseract image: file name, URL, sha256. The image's
# build downloads each one and checks its hash. The same entries as the
# engine survey's models.lock (#296), less osd (psm 3 doesn't read
# orientation). frak2021 is cleared (CC0 1.0, 13 §13.7.2) and is the
# worker's German route (#296's pilot); it comes from its Zenodo record
# (10125246), the same file the survey ran, not a checkpoint from UB
# Mannheim's server. Every other model here is Apache-2.0.
# UB Mannheim frak2021 0.905 (best), Zenodo record 10125246, CC0 1.0.
