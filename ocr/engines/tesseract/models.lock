# engine survey's models.lock (#296), less osd (psm 3 doesn't read
# orientation). frak2021 is cleared (CC0 1.0, 13 §13.7.2) and is the
# worker's German route (#296's pilot); it comes from its Zenodo record
# (10125246), the same file the survey ran, not a checkpoint from UB
