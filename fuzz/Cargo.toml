[package]
name = "usnm-fuzz"
version = "0.0.0"
publish = false
edition = "2021"
license = "MIT"

[package.metadata]
cargo-fuzz = true

# Keep nightly/libFuzzer dependencies out of the production workspace.
[workspace]
members = ["."]

[dependencies]
bytes = "1"
libfuzzer-sys = "0.4"
parquet = { version = "60", default-features = false, features = ["arrow", "zstd"] }
peak_alloc = "0.3"
usnm-alto = { path = "../crates/usnm-alto" }
usnm-ocr-contract = { path = "../crates/usnm-ocr-contract" }
usnm-overlay = { path = "../crates/usnm-overlay" }

[dev-dependencies]
chrono = "0.4"
serde_json = "1"

[[bin]]
name = "read_node_part"
path = "fuzz_targets/read_node_part.rs"
test = false
doc = false
bench = false

[[bin]]
name = "alto_check"
path = "fuzz_targets/alto_check.rs"
test = false
doc = false
bench = false

[[bin]]
name = "decode_dead_letter"
path = "fuzz_targets/decode_dead_letter.rs"
test = false
doc = false
bench = false
